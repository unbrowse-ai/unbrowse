[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unbrowse-hermes"
version = "2.0.10"
description = "Hermes Agent plugin that makes Unbrowse the preferred tool for website tasks."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lewis", email = "lewis@unbrowse.ai"}]
requires-python = ">=3.10"
keywords = ["hermes", "hermes-agent", "unbrowse", "browser", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.entry-points."hermes_agent.plugins"]
unbrowse = "unbrowse_hermes.plugin:register"

[project.urls]
Homepage = "https://github.com/unbrowse-ai/unbrowse"
Repository = "https://github.com/unbrowse-ai/unbrowse"

[tool.setuptools.packages.find]
include = ["unbrowse_hermes*"]
