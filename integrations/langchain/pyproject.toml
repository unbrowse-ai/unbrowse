[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unbrowse-langchain"
version = "2.1.6"
description = "LangChain tools for the Unbrowse CLI — reverse-engineer any website into reusable API skills."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "langchain-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
