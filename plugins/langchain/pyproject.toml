[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-unbrowse"
version = "0.1.0"
description = "LangChain tools for Unbrowse: read any web page as markdown, find site capabilities, run web tasks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
authors = [{ name = "Unbrowse AI" }]
keywords = ["langchain", "unbrowse", "web", "scraping", "agents", "tools", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["langchain-core>=0.3.0,<2.0.0"]

[project.optional-dependencies]
test = ["pytest>=8", "langchain-tests>=0.3.0"]

[project.urls]
Homepage = "https://unbrowse.ai"
Documentation = "https://github.com/unbrowse-ai/unbrowse/tree/main/plugins/langchain#readme"
Source = "https://github.com/unbrowse-ai/unbrowse/tree/main/plugins/langchain"
Issues = "https://github.com/unbrowse-ai/unbrowse/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_unbrowse"]

[tool.hatch.build.targets.sdist]
include = ["langchain_unbrowse/", "tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
