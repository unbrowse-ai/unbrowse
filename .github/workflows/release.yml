# Every job here runs on a fresh machine, never on the local runner pool (UNB-166): the pool runs pull-request code
# and shares a cargo cache across jobs, so nothing built or signed for users runs there. Blacksmith gives each job a
# fresh VM (UNB-224). The publishing jobs run on GitHub's own machines, because npm's trusted publishing works from
# cloud-hosted runners only. There is no Intel Mac build (UNB-224, 22 Nov 2026): Apple silicon only.
#
# The programs for every machine (the Mac app on Apple silicon, Linux on x64 and arm64, Windows on x64), the installers
# people click (the Mac disk image, the Windows setup, the Linux packages: every one of them on the release itself, so
# there is one release per version and no second family to keep in step) and `unbrowse` for npm and PyPI, for each of the
# three places a commit goes (CONTRIBUTING.md, "Branches and releases"); the version is the ref's
# (.github/scripts/release-version.sh):
#
#   staging       every commit on staging CI passes: X.Y.0-staging.N on npm's `staging` tag, and nothing else
#   pre-production every commit on a release/X.Y branch CI passes: X.Y.P-rc.N on npm's `next` tag and on canary, which
#                 it holds until something newer comes and never hands to stable (before stable's first release, `next` alone)
#   production    a vX.Y.Z tag pushed on main: X.Y.Z on npm's `latest`, a GitHub release, and canary, which updates.yml
#                 gives to stable once it has soaked
#
# In the public release repository, npm gets `unbrowse`, each machine's `@unbrowse/<platform>` and, outside staging,
# the signed `@unbrowse/updates` metadata. `updates.yml` promotes, halts and refreshes it. Run it by hand
# on staging, a release branch or a tag to release that ref again under a new run. No pull request runs it: this
# workflow holds the signing keys, so it runs only for those refs, in the `release` environment (ci.yml's `papers` job
# tests a pull request's changes to the release scripts, with no secret in reach).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, "release/**"]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      # A rehearsal: every job up to the publish runs, with the keys, and nothing leaves (no npm, no GitHub release, no
      # tag). Npm lacking a package is a warning, not a stop. Used when the workflow moves to a new repository or
      # environment, to prove the keys sign there before anything ships.
      dry_run:
        description: Build and sign, publish nothing
        type: boolean
        default: false
      # Moves npm's next tag up to a release already shipped, and does nothing else: no build, no key, no publish
      # (unbrowse-core#629). The version must be npm's latest.
      next_to:
        description: Only move npm's next tag up to this shipped version (e.g. 13.0.0)
        type: string
        default: ""
      sha:
        description: Commit approved by the triggering CI run, which must still be the dispatch branch tip
        type: string
        default: ""

# One release at a time, each reading the tags the last one made.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # In the public repo a workflow_run uses the default branch's deployment ref. Dispatch from the checked branch
  # so GitHub evaluates the existing release environment policy for the actual source.
  hand-over:
    name: Hand the release to its branch
    if: >-
      github.repository == 'unbrowse-ai/unbrowse' && toJSON(github.event.repository.private) == 'false' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: write
    steps:
      - name: Dispatch the exact checked source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$SOURCE_REF" in staging | release/*) ;; *) echo '::error::not a release branch'; exit 1 ;; esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::CI did not provide a commit SHA'; exit 1; }
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" -f sha="$SOURCE_SHA"

  version:
    permissions:
      contents: read
      # The promotion gate reads the coverage and task-bank artifacts CI kept for the tree it ships.
      actions: read
    name: Version
    # Core builds a successful CI push directly. Public branch releases arrive by dispatch on the source ref, and
    # public tags arrive by push. release-version.sh refuses refs outside the release branches and tags.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.next_to == '' || github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.repository != 'unbrowse-ai/unbrowse' || toJSON(github.event.repository.private) != 'false')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.free.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
      channel: ${{ steps.next.outputs.channel }}
      npm_tag: ${{ steps.next.outputs.npm_tag }}
    steps:
      # npm provenance attests GITHUB_SHA. The hand-over may only build when that is the commit CI checked.
      - name: The checked commit is still the branch tip
        if: inputs.sha != ''
        env:
          WANT: ${{ inputs.sha }}
        run: |
          if [ "$WANT" != "$GITHUB_SHA" ]; then
            echo '::error::the branch moved after CI approved the commit'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Every branch and tag: the version counts from them, and a tag is checked against main and its release branch.
          fetch-depth: 0
          persist-credentials: false
      - id: next
        env:
          REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(sh .github/scripts/release-version.sh "$REF" "$RUN")
          case $REF in
            refs/tags/*) channel=production npm_tag=latest ;;
            refs/heads/release/*) channel=preproduction npm_tag=next ;;
            *) channel=staging npm_tag=staging ;;
          esac
          { echo "version=$version"; echo "channel=$channel"; echo "npm_tag=$npm_tag"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $REF to $channel"
      # Nothing ships from a commit whose own checks are not all green (UNB-248): every workflow its pushes started (CI,
      # Coverage, QA, the promotion gate's harness, …), each one's latest run, waited on while it runs. CI passing is
      # what starts this on staging and a release branch, and it was the only thing read: on 23-24 Nov 2026 merges with
      # red and cancelled checks went out. A dry run reads it and goes on.
      - name: Every check on this commit is green
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.next.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          status=0
          python3 -I .github/scripts/checks_green.py sha --repo "$GITHUB_REPOSITORY" --sha "$SHA" --event push \
            --skip-run "$GITHUB_RUN_ID" --wait 3600 || status=$?
          if [ "$status" != 0 ]; then
            [ "$DRY_RUN" = true ] || { echo "::error::nothing is released from ${SHA:0:12}: its checks are not all green (above)"; exit 1; }
            echo "::warning::a dry run: ${SHA:0:12}'s checks are not all green (above)"
          fi
      # Before anything is built: one message naming every package npm doesn't have, where the publish would stop at the
      # first, and a refusal when npm holds the version already. A build in core keeps its own artifacts.
      - name: Npm has every package
        id: free
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          PUBLIC_PUBLISHER: ${{ github.repository == 'unbrowse-ai/unbrowse' && toJSON(github.event.repository.private) == 'false' }}
        run: |
          if [ "$PUBLIC_PUBLISHER" != true ]; then
            echo 'This repository builds and checks release artifacts. Approved source publishes from unbrowse-ai/unbrowse.' >> "$GITHUB_STEP_SUMMARY"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = true ]; then
            node .github/scripts/npm-preflight.mjs "$VERSION" || echo "::warning::a dry run: npm can't take $VERSION yet (above), so it is built and signed and not published"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/npm-preflight.mjs "$VERSION"
          fi
      # Public only with the bar met (UNB-208, AGENTS.md "Tests, requirements and the merge scorecard"): 90% line
      # coverage in every gated part, the whole task bank on this tree with no task lost from the last promotion,
      # no confident wrong answer and no fewer passes than the floor, and the bench on the top 1,000 sites (gate-1k.yml,
      # UNB-307) with no fewer right and no higher confidently wrong rate than its floor, every task measured. A tag stops here when it isn't met, each rule
      # named. A dry run reads the gate and goes on; staging and release branches don't reach public, so they skip it.
      - name: The promotion gate
        if: steps.next.outputs.version != '' && (steps.next.outputs.channel == 'production' || inputs.dry_run == true)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.next.outputs.channel }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          status=0
          sh .github/scripts/promotion-gate.sh "$(git rev-parse 'HEAD^{tree}')" "$RUNNER_TEMP/promotion" || status=$?
          cat "$RUNNER_TEMP/promotion/verdict.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$status" != 0 ]; then
            if [ "$CHANNEL" = production ] && [ "$DRY_RUN" != true ]; then
              echo "::error::the promotion gate refuses this release (above)"; exit 1
            fi
            echo "::warning::the promotion gate would refuse this ref (a dry run, or not a public release)"
          fi

  # The programs for each machine, built on it: the node, `unb`, the browser and the window. A Mac's are Unbrowse.app;
  # Linux's and Windows' the four programs in one folder.
  programs:
    permissions:
      contents: read
    name: Programs (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: blacksmith-6vcpu-macos-15 }
          # Ubuntu 22.04's glibc (2.35) is the oldest a Linux machine needs; the wheels are tagged for it.
          - { platform: linux-x64, runner: blacksmith-4vcpu-ubuntu-2204 }
          - { platform: linux-arm64, runner: blacksmith-4vcpu-ubuntu-2204-arm }
          - { platform: win32-x64, runner: blacksmith-4vcpu-windows-2025 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXE: ${{ startsWith(matrix.platform, 'win32') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
      # A release builds from nothing but the commit and what its own steps fetch and check: no cache, since a cache's
      # key names its inputs, not what was saved under it, and other runs (a pull request's among them) write caches.
      # The script fetches btls-sys and checks it against crates.io's checksum.
      - working-directory: unbrowse-node
        run: sh scripts/apply-tls-patch.sh
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # Zig 0.17's std aborts on a connect a signal interrupted ("programmer bug caused syscall error: ISCONN"): patched
      # in place before anything builds (.github/scripts/patch_zig_std.py; Zig 0.17.1 and master read it the same way).
      - name: Patch Zig's std (an interrupted connect settles)
        shell: bash
        run: if command -v python3 >/dev/null; then python3 -I "$GITHUB_WORKSPACE/.github/scripts/patch_zig_std.py"; else python -I "$GITHUB_WORKSPACE/.github/scripts/patch_zig_std.py"; fi

      # The node reports its version from the workspace's; the tag is the only place it changes. The lockfile's
      # entries for the workspace's own crates follow it, so the build stays --locked to every other dependency.
      # What a fresh install starts with (app/src/build_config.rs), from the repository's variables. A release runs on
      # Arc testnet unless UNBROWSE_DEFAULT_CHAIN names another (a local devnet needs Anvil, which an install doesn't
      # have); its local use needs no chain at all until the owner signs in. The other variables, left unset, reach
      # the build empty, which is the build's own default.
      - name: Build the node and unb
        working-directory: unbrowse-node
        env:
          UNBROWSE_DEFAULT_CHAIN: ${{ vars.UNBROWSE_DEFAULT_CHAIN || 'arc-testnet' }}
          UNBROWSE_SITE: ${{ vars.UNBROWSE_SITE }}
          UNBROWSE_SHARE_DEFAULT: ${{ vars.UNBROWSE_SHARE_DEFAULT }}
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak
          grep -qx "version = \"$VERSION\"" Cargo.toml
          py=$(command -v python3 || command -v python)
          cargo metadata --no-deps --offline --format-version 1 | "$py" -c '
          import json, re, sys
          version = sys.argv[1]
          ours = {p["name"] for p in json.load(sys.stdin)["packages"] if p["version"] == version}
          lock = open("Cargo.lock").read()
          # A crate of this workspace: its lockfile entry has no source line.
          entry = re.compile(r"(\[\[package\]\]\nname = \"([^\"]+)\"\nversion = \")[^\"]+(\"\n)(?!source = )")
          new = entry.sub(lambda m: m.group(1) + version + m.group(3) if m.group(2) in ours else m.group(0), lock)
          open("Cargo.lock", "w", newline="\n").write(new)
          ' "$VERSION"
          # A build the release makes keeps itself up to date (app/src/update.rs); one built from source doesn't.
          UNBROWSE_RELEASE=1 cargo build --release --locked --bin unbrowse-node --bin unb
      - name: Build the browser
        working-directory: unbrowse-browser/cli
        run: cargo build --release --locked

      - if: startsWith(matrix.platform, 'darwin')
        name: Build Unbrowse.app
        working-directory: unbrowse-node/window
        # A bundle's version is numbers alone (CFBundleShortVersionString): a prerelease's is its X.Y.Z.
        run: zig build app -Doptimize=ReleaseSafe -Dcpu=baseline -Dversion="${VERSION%%-*}"
      - if: startsWith(matrix.platform, 'darwin')
        name: Archive unsigned Mac build inputs
        run: tar -czf mac-inputs.tar.gz unbrowse-node/target/release/unbrowse-node unbrowse-node/target/release/unb unbrowse-browser/cli/target/release/agent-browser unbrowse-node/window/zig-out/Unbrowse.app && shasum -a 256 mac-inputs.tar.gz > mac-inputs.tar.gz.sha256
      - if: startsWith(matrix.platform, 'darwin')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-inputs-${{ matrix.platform }}
          path: mac-inputs.tar.gz*
          if-no-files-found: error
      - if: ${{ !startsWith(matrix.platform, 'darwin') }}
        name: Build the window
        working-directory: unbrowse-node/window
        # -Dcpu=baseline: Zig builds for the build machine's own processor unless told, and a window built for a newer
        # one dies on start with an illegal instruction on an older one (0xc000001d on Windows runners, Nov 2026).
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline
      - if: ${{ !startsWith(matrix.platform, 'darwin') }}
        name: Pack the programs
        run: sh .github/scripts/package-programs.sh "$VERSION" "${{ matrix.platform }}" dist

      - name: Check the programs run
        run: |
          # unb says its usage and exits 2.
          { UNBROWSE_AGENT_TOKEN=check unbrowse-node/target/release/unb$EXE 2>&1 || true; } | grep -q '^usage: unb'
          unbrowse-browser/cli/target/release/agent-browser$EXE --version
      - if: ${{ !startsWith(matrix.platform, 'darwin') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: programs-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      # The separately signed browser package is installed by the node from its authenticated targets inventory.
      - name: The browser on its own
        run: mkdir -p browser && cp "unbrowse-browser/cli/target/release/agent-browser$EXE" "browser/agent-browser-${{ matrix.platform }}$EXE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.platform }}
          path: browser/*
          if-no-files-found: error

  # This runner receives only hashed build artifacts, installs no dependencies, and performs no compilation.
  mac-sign:
    permissions:
      contents: read
    name: Sign Mac app (${{ matrix.platform }})
    needs: [version, programs]
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: blacksmith-6vcpu-macos-15 }
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-inputs-${{ matrix.platform }}
          path: inputs
      - name: Verify and unpack the hashed build data
        run: |
          (cd inputs && shasum -a 256 -c mac-inputs.tar.gz.sha256)
          python3 - <<'PY'
          import os, tarfile
          allowed = (
              "unbrowse-node/target/release/unbrowse-node",
              "unbrowse-node/target/release/unb",
              "unbrowse-browser/cli/target/release/agent-browser",
              "unbrowse-node/window/zig-out/Unbrowse.app",
          )
          with tarfile.open("inputs/mac-inputs.tar.gz") as archive:
              members = archive.getmembers()
              for member in members:
                  name = member.name.rstrip("/")
                  if name.startswith("/") or ".." in name.split("/") or not any(name == root or name.startswith(root + "/") or root.startswith(name + "/") for root in allowed):
                      raise SystemExit(f"unsafe Mac build artifact path: {name}")
                  if member.issym() or member.islnk() or not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unexpected Mac build artifact type: {name}")
              destination = os.path.join(os.environ["RUNNER_TEMP"], "mac-inputs")
              os.makedirs(destination, exist_ok=True)
              archive.extractall(destination)
          PY
          root="$RUNNER_TEMP/mac-inputs"
          for file in unbrowse-node/target/release/unbrowse-node unbrowse-node/target/release/unb unbrowse-browser/cli/target/release/agent-browser; do
            mkdir -p "$(dirname "$file")"
            cp "$root/$file" "$file"
          done
          mkdir -p unbrowse-node/window/zig-out
          ditto "$root/unbrowse-node/window/zig-out/Unbrowse.app" unbrowse-node/window/zig-out/Unbrowse.app
      - name: Load Developer ID and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_ALLOW_UNNOTARIZED: ${{ vars.MACOS_ALLOW_UNNOTARIZED }}
        run: |
          # A production release is never signed ad hoc: an ad hoc build is quarantined on every machine that downloads it,
          # and its programs' code identity changes every build, which the Keychain rule for the node's key checks
          # (unbrowse-core#630).
          if [ -z "$MACOS_CERTIFICATE" ] && [ "$CHANNEL" = production ]; then
            echo "::error::MACOS_CERTIFICATE isn't set in the release environment, and a production release isn't signed ad hoc. Add the Developer ID Application certificate (.p12, base64) as MACOS_CERTIFICATE and its password as MACOS_CERTIFICATE_PASSWORD, with APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER (an App Store Connect team key) to notarize, then rerun"
            exit 1
          fi
          [ -n "$MACOS_CERTIFICATE" ] || echo "::warning::MACOS_CERTIFICATE isn't set: this $CHANNEL build is signed ad hoc"
          if [ -n "$MACOS_CERTIFICATE" ]; then
            keychain=$RUNNER_TEMP/signing.keychain-db
            pass=$(openssl rand -hex 16)
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            printf %s "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
            security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/developer-id.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')
            test -n "$identity"
            export MACOS_SIGN_IDENTITY="$identity"
          fi
          mkdir -p dist
          sh .github/scripts/package-macos.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: programs-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # The disk image as an owner gets it (UNB-266): mounted, the app copied out, its node started, the window's Connect
  # sent, and every client's entry answering with the node's tools. Prints MAC_INSTALL_E2E_OK. It runs the programs
  # just built and a script of the repository's, so it has a runner of its own with no signing key on it
  # (check_signing_jobs.py); the packages below wait for it, so an image that doesn't install is never released.
  mac-install:
    permissions:
      contents: read
    name: Mac install, end to end (${{ matrix.platform }})
    needs: [version, mac-sign]
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: blacksmith-6vcpu-macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: programs-${{ matrix.platform }}
          path: dist
      - run: sh unbrowse-node/scripts/install-e2e.sh --dmg dist/Unbrowse-"$VERSION"-macos-*.dmg

  # Each machine's package and the manifest of their hashes. No secret: what runs here (setup-node, the packing
  # scripts) never shares a runner with a signing key. It also records the hash of every program archive and browser
  # program the GitHub release will publish, as a job output: this job runs nothing from a package registry, and it runs
  # before `sdks` installs and runs third-party build code, which could otherwise replace those artifacts unseen.
  platforms:
    permissions:
      contents: read
    name: Machine packages
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      programs: ${{ steps.programs.outputs.programs }}
    needs: [version, programs, mac-sign, mac-install]
    if: needs.version.outputs.version != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: programs-*
          path: programs
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-*
          path: browser
          merge-multiple: true
      - name: Record the program archives and browser programs the release publishes
        id: programs
        run: python3 -I .github/scripts/artifact-hashes.py record-files programs browser --key programs --github-output "$GITHUB_OUTPUT"
      - name: Pack each machine's programs
        run: |
          sh .github/scripts/pack-platforms.sh "$VERSION" programs dist
          # Every machine made it into the packages, and each has its browser add-on apart from them.
          for p in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            test -f "dist/unbrowse-$p-$VERSION.tgz"
            test -f "dist/unbrowse-browser-$p-$VERSION.tgz"
            if tar -tzf "dist/unbrowse-$p-$VERSION.tgz" | grep -q 'agent-browser'; then echo "::error::@unbrowse/$p carries the browser"; exit 1; fi
          done
      - name: Record built package hashes
        id: hashes
        run: python3 -I .github/scripts/artifact-hashes.py record dist --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platforms
          path: dist/*
          if-no-files-found: error

  # The installers people click, for the two systems whose download isn't the disk image: the Windows setup and the Linux
  # packages, packed from the archives the machines just made (package-windows-installer.sh, package-linux-deb.sh). This
  # job builds nothing and holds no key; every file it makes is recorded, so the release publishes exactly these bytes
  # (artifact-hashes.py). A release carries them beside the disk image, so one release is the whole download page and
  # there is no second family of releases to keep in step.
  installers:
    permissions:
      contents: read
    name: Installers
    outputs:
      installers: ${{ steps.files.outputs.installers }}
    needs: [version, platforms]
    if: needs.version.outputs.version != '' && (needs.version.outputs.channel == 'production' || inputs.dry_run == true)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: programs-*
          path: programs
          merge-multiple: true
      - name: Install makensis
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Pack the installers
        run: |
          mkdir -p installers
          sh .github/scripts/package-windows-installer.sh "$VERSION" "programs/unbrowse-$VERSION-windows-x64.zip" installers
          for arch in x64 arm64; do
            sh .github/scripts/package-linux-deb.sh "$VERSION" "programs/unbrowse-$VERSION-linux-$arch.tar.gz" installers
          done
          # One of each, or the release waits: a person on Windows or Linux has nothing else to click.
          test -f "installers/Unbrowse-$VERSION-windows-x64-setup.exe"
          test -f "installers/unbrowse_${VERSION}_amd64.deb"
          test -f "installers/unbrowse_${VERSION}_arm64.deb"
          ls -l installers
      - name: Record the installers' hashes
        id: files
        run: python3 -I .github/scripts/artifact-hashes.py record-files installers --key installers --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: installers/*
          if-no-files-found: error

  # Each installer on a fresh machine of its kind, installed and opened as a person does, the node's MCP checked from
  # outside (installers-device-test.yml). A production run does it before npm publishes anything, so an installer that
  # doesn't install stops the release while its version is still npm's to take; a dry run does it on a release branch,
  # so the proof comes before the tag.
  installer-device-test:
    name: Installer device test
    needs: [version, installers]
    if: needs.version.outputs.version != '' && (needs.version.outputs.channel == 'production' || inputs.dry_run == true)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/installers-device-test.yml
    with:
      run-id: ${{ github.run_id }}

  # The release key signs the manifest here and nowhere else. The job installs nothing and runs nothing a package
  # registry gave it: the checkout of the signing script and the node's trusted key, the manifest, and the runner's own
  # Node with its built-in crypto. Its runner is a fresh Blacksmith VM for this job, so no earlier step of another job can
  # be waiting on it to read the key. The key is a secret of the `release` environment, and the job refuses any ref but
  # the three that release.
  sign-manifest:
    permissions:
      contents: read
    name: Sign the manifest
    needs: [version, platforms]
    if: needs.version.outputs.version != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/sign-manifest.mjs
            unbrowse-node/app/src/update.rs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platforms
          path: dist
      - name: Refuse any other ref
        env:
          NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          case $NAME in staging | release/[0-9]*.[0-9]* | v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::a release signs only staging, a release branch or a vX.Y.Z tag, not $NAME"; exit 1 ;; esac
      - name: Sign the manifest
        env:
          UNBROWSE_RELEASE_KEY: ${{ secrets.UNBROWSE_RELEASE_KEY }}
        run: node .github/scripts/sign-manifest.mjs dist/manifest.json unbrowse-node/app/src/update.rs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-sig
          path: dist/manifest.sig
          if-no-files-found: error

  # `unbrowse` for npm and PyPI, each with the skill and the client, the signed manifest and each machine's programs
  # beside it. No secret here: building them installs packages from npm and PyPI.
  sdks:
    permissions:
      contents: read
    name: unbrowse packages
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      files: ${{ steps.hashes.outputs.files }}
    needs: [version, platforms, sign-manifest]
    if: needs.version.outputs.version != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          # No cache in a release, as with the programs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platforms
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest-sig
          path: dist
      - name: Install lockfile-pinned npm
        run: |
          npm ci --ignore-scripts --prefix .github/tools/npm
          echo "$GITHUB_WORKSPACE/.github/tools/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Pack unbrowse
        env:
          NOTARIZED: ${{ vars.MACOS_NOTARIZED }}
        run: |
          sh .github/scripts/pack-sdks.sh "$VERSION" dist
          # A release signed with the Developer ID pins its Team ID in `unbrowse`: the CLI runs an Unbrowse.app found
          # outside the package only when it is signed by that team, and with none pinned runs none.
          if [ "$NOTARIZED" = true ]; then
            tar -xzOf "dist/unbrowse-$VERSION.tgz" package/package.json | grep -Eq '"unbrowseAppTeam": "[A-Z0-9]{10}"' || { echo "::error::unbrowse pins no Mac signing team"; exit 1; }
          fi
      - name: Record built package hashes
        id: hashes
        run: |
          python3 -I .github/scripts/artifact-hashes.py record dist --github-output "$GITHUB_OUTPUT"
          python3 -I .github/scripts/artifact-hashes.py record-files dist --key files --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdks
          path: dist/*
          if-no-files-found: error

  # A detached signature ties every distributable npm and Python package to the untrusted build output. The
  # hash map is an immutable job output; publishing jobs verify it and this signed inventory before publishing.
  sign-artifacts:
    permissions:
      contents: read
    name: Sign package hashes
    needs: [version, sdks]
    if: needs.version.outputs.version != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/sign-artifact-manifest.mjs
            unbrowse-node/app/src/update.rs
          sparse-checkout-cone-mode: false
      - name: Sign build output hashes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HASHES: ${{ needs.sdks.outputs.hashes }}
          UNBROWSE_RELEASE_KEY: ${{ secrets.UNBROWSE_RELEASE_KEY }}
        run: node .github/scripts/sign-artifact-manifest.mjs "$VERSION" "$HASHES" unbrowse-node/app/src/update.rs release-artifacts.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release-artifacts.json
          if-no-files-found: error

  # The update metadata: this release on canary, stable as it was, a fresh timestamp. Read from what npm has now,
  # signed with the targets and timestamp keys (the release key until root 2 names others), and checked against the
  # root nodes trust before anything is published. Like `sign-manifest`, the keys are in this job alone; package
  # creation runs later with npm installed from this trusted checkout's lockfile, with lifecycle scripts disabled.
  sign-updates:
    permissions:
      contents: read
    name: Sign the update metadata
    needs: [version, sdks, sign-artifacts, platforms]
    # A staging build goes to npm's `staging` tag alone: no node updates to it.
    if: needs.version.outputs.version != '' && needs.version.outputs.channel != 'staging'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    outputs:
      targets_changed: ${{ steps.sign.outputs.targets_changed }}
      cosign_required: ${{ steps.sign.outputs.cosign_required }}
      # false only for a release candidate before stable's first release: it publishes no update metadata.
      published: ${{ steps.sign.outputs.published }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/updates.mjs
            .github/scripts/artifact-hashes.py
            .github/scripts/verify-artifact-manifest.mjs
            unbrowse-node/app/src/update.rs
            unbrowse-node/updates
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted-main
          persist-credentials: false
          sparse-checkout: .github/scripts/updates.mjs
          sparse-checkout-cone-mode: false
      - name: Check update root transition metadata before signing
        run: node .github/scripts/updates.mjs root-check --main-updates "$GITHUB_WORKSPACE/trusted-main/.github/scripts/updates.mjs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdks
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Verify every published package against the build output
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HASHES: ${{ needs.sdks.outputs.hashes }}
          PLATFORM_HASHES: ${{ needs.platforms.outputs.hashes }}
        run: |
          python3 -I .github/scripts/artifact-hashes.py verify-subset dist --expected "$PLATFORM_HASHES"
          python3 -I .github/scripts/artifact-hashes.py verify dist --expected "$HASHES"
          node .github/scripts/verify-artifact-manifest.mjs dist "$VERSION" "$HASHES" unbrowse-node/app/src/update.rs release-artifacts/release-artifacts.json
      - name: Refuse any other ref
        env:
          NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          case $NAME in staging | release/[0-9]*.[0-9]* | v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::a release signs only staging, a release branch or a vX.Y.Z tag, not $NAME"; exit 1 ;; esac
      - id: sign
        name: Sign the update metadata
        env:
          UNBROWSE_RELEASE_KEY: ${{ secrets.UNBROWSE_RELEASE_KEY }}
          UNBROWSE_TARGETS_KEY: ${{ secrets.UNBROWSE_TARGETS_KEY }}
          UNBROWSE_TIMESTAMP_KEY: ${{ secrets.UNBROWSE_TIMESTAMP_KEY }}
        run: |
          node .github/scripts/updates.mjs release "$VERSION" dist --out "$RUNNER_TEMP/updates" --github-output "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-dir
          path: ${{ runner.temp }}/updates/**
          if-no-files-found: error

  # A changed targets file needs an independent signature from a separately protected environment.
  cosign-updates:
    permissions:
      contents: read
    name: Co-sign changed targets
    needs: [version, sign-updates, sdks, sign-artifacts]
    if: needs.sign-updates.outputs.cosign_required == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: targets-cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/updates.mjs
            unbrowse-node/app/src/update.rs
            unbrowse-node/updates
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updates-dir
          path: ${{ runner.temp }}/partial
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdks
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/inventory
      - name: Add the independent targets signature
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UNBROWSE_TARGETS_KEY_2: ${{ secrets.UNBROWSE_TARGETS_KEY_2 }}
          UNBROWSE_TIMESTAMP_KEY: ${{ secrets.UNBROWSE_TIMESTAMP_KEY }}
        run: node .github/scripts/updates.mjs co-sign "$RUNNER_TEMP/partial" --action release --release-version "$VERSION" --manifest-dir "$RUNNER_TEMP/dist" --inventory-dir "$RUNNER_TEMP/inventory" --out "$RUNNER_TEMP/updates"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-cosigned
          path: ${{ runner.temp }}/updates/**
          if-no-files-found: error

  pack-updates:
    permissions:
      contents: read
    name: Package signed update metadata
    needs: [version, sign-updates, cosign-updates, sdks]
    outputs:
      updates: ${{ steps.updates.outputs.updates }}
    if: always() && needs.version.outputs.version != '' && needs.version.outputs.channel != 'staging' && needs.sdks.result == 'success' && needs.sign-updates.result == 'success' && needs.sign-updates.outputs.published == 'true' && (needs.cosign-updates.result == 'success' || needs.cosign-updates.result == 'skipped')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/tools/npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign-updates.outputs.cosign_required == 'true' && 'updates-cosigned' || 'updates-dir' }}
          path: ${{ runner.temp }}/updates
      - name: Install lockfile-pinned npm without lifecycle scripts
        run: npm ci --ignore-scripts --prefix .github/tools/npm
      - name: Pack signed metadata with the lockfile-pinned npm CLI
        run: |
          mkdir -p updates
          cd "$RUNNER_TEMP/updates"
          "$GITHUB_WORKSPACE/.github/tools/npm/node_modules/.bin/npm" pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/updates" >/dev/null
      - name: Record the metadata package's hash
        id: updates
        run: python3 -I .github/scripts/artifact-hashes.py record-files updates --key updates --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates
          path: updates/*.tgz
          if-no-files-found: error

  # The GitHub release comes last, once npm has everything: its notes tell people to `npm install -g unbrowse`, so
  # nothing says a release exists that npm doesn't have. Production's alone: a prerelease's programs are this run's
  # artifacts. It carries every installer (the disk image, the Windows setup, the Linux packages), each of which the
  # device test above installed on a fresh machine of its kind.
  release:
    name: Release
    needs: [version, programs, platforms, installers, installer-device-test, sdks, pack-updates, sign-artifacts, npm]
    if: ${{ !cancelled() && !failure() && needs.npm.result == 'success' && needs.version.outputs.channel == 'production' && inputs.dry_run != true }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/verify-artifact-manifest.mjs
            .github/scripts/artifact-hashes.py
            unbrowse-node/app/src/update.rs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{programs-*,sdks,browser-*,installers}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Verify every published package against the build output
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HASHES: ${{ needs.sdks.outputs.hashes }}
          PLATFORM_HASHES: ${{ needs.platforms.outputs.hashes }}
          FILES: ${{ needs.sdks.outputs.files }}
          PROGRAMS: ${{ needs.platforms.outputs.programs }}
          INSTALLERS: ${{ needs.installers.outputs.installers }}
        run: |
          python3 -I .github/scripts/artifact-hashes.py verify-subset dist --expected "$PLATFORM_HASHES"
          python3 -I .github/scripts/artifact-hashes.py verify dist --expected "$HASHES"
          node .github/scripts/verify-artifact-manifest.mjs dist "$VERSION" "$HASHES" unbrowse-node/app/src/update.rs release-artifacts/release-artifacts.json
          # Every file the release publishes (disk images, archives, browser programs, the installers, the sdist, the
          # manifest) is exactly one the job that made it recorded, byte for byte.
          python3 -I .github/scripts/artifact-hashes.py verify-files dist --expected "$FILES" --expected "$PROGRAMS" --expected "$INSTALLERS"
      - name: Include the signed package inventory in the release
        run: cp release-artifacts/release-artifacts.json dist/release-artifacts.json
      - name: Tag and publish
        env:
          NOTARIZED: ${{ vars.MACOS_NOTARIZED }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          ALLOW_UNNOTARIZED: ${{ vars.MACOS_ALLOW_UNNOTARIZED }}
        run: |
          # A production Mac app is notarized, or package-macos.sh stopped the release (unless MACOS_ALLOW_UNNOTARIZED
          # let it through); another channel's is when the repository's MACOS_NOTARIZED variable says so.
          if [ "$CHANNEL" = production ] && [ "$ALLOW_UNNOTARIZED" != true ]; then NOTARIZED=true; fi
          if [ "$NOTARIZED" = true ]; then
            MAC_TRUST="It is signed with Unbrowse's Developer ID and notarized by Apple, so it opens like any app."
          else
            MAC_TRUST="It is signed ad hoc, not notarized by Apple, so macOS stops the first launch and says it can't check
          the app for malware. Open it once by hand: in Applications, right-click (or Control-click) Unbrowse and choose
          Open, then Open again. On macOS 15 (Sequoia) or later that no longer offers Open: after the warning, go to
          System Settings > Privacy & Security, scroll to Security, click Open Anyway beside \"Unbrowse was blocked\",
          and confirm."
          fi
          cd dist
          # Every download at a name that stays (releases/latest/download/<name>): unbrowse.ai and the READMEs link
          # these, so a link never names a build that stops being the newest one, and never rots into an older release.
          cp "Unbrowse-$VERSION-macos-arm64.dmg" "Unbrowse-macos-arm64.dmg"
          cp "Unbrowse-$VERSION-windows-x64-setup.exe" "Unbrowse-windows-x64-setup.exe"
          cp "unbrowse_${VERSION}_amd64.deb" "unbrowse_amd64.deb"
          cp "unbrowse_${VERSION}_arm64.deb" "unbrowse_arm64.deb"
          sha256sum -- * > SHA256SUMS
          # The browser's npm postinstall installs a machine's browser only when its hash is listed here.
          for p in darwin-arm64 linux-x64 linux-arm64 win32-x64.exe; do
            grep -q "  agent-browser-$p\$" SHA256SUMS || { echo "::error::SHA256SUMS lists no agent-browser-$p"; exit 1; }
          done
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Download the app**, the newest release's files at the names that stay
          (\`releases/latest/download/…\`, which is what unbrowse.ai and the READMEs link):
          - **Mac** (Apple silicon; there is no Intel Mac build): [\`Unbrowse-macos-arm64.dmg\`](https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Unbrowse-macos-arm64.dmg).
            Open it and drag Unbrowse onto Applications. $MAC_TRUST
          - **Windows** (x64): [\`Unbrowse-windows-x64-setup.exe\`](https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Unbrowse-windows-x64-setup.exe).
            It installs for your user alone, with no administrator prompt, and opens Unbrowse when it finishes.
          - **Linux** (Debian, Ubuntu): [\`unbrowse_amd64.deb\`](https://github.com/$GITHUB_REPOSITORY/releases/latest/download/unbrowse_amd64.deb)
            or [\`unbrowse_arm64.deb\`](https://github.com/$GITHUB_REPOSITORY/releases/latest/download/unbrowse_arm64.deb):
            \`sudo apt install ./unbrowse_amd64.deb\`, then Unbrowse in your apps menu.

          Each installer holds the window, the node, \`unb\` and the browser program the node fetches when a goal first
          needs it. The versioned copy of every file is below, with its SHA-256.

          **\`unbrowse\`**, the app, the node, the agent skill and the client in one package:
          \`npm install -g unbrowse\` (or \`pip install unbrowse-$VERSION-py3-none-<your machine>.whl\` from below), then
          \`unbrowse app\` opens the window and \`unbrowse start\` runs the node without it. npm fetches the programs for
          the machine it installs on: macOS (Apple silicon), Linux (x64 and arm64, glibc 2.35 or later) and
          Windows (x64). \`unbrowse-$VERSION-py3-none-any.whl\` is the client alone, for any other machine. No install
          brings a browser or downloads Chrome: the node runs without one, and fetches its browser program
          (\`@unbrowse/browser-<machine>\`, checked against this release's signature) and, when there's no Chromium,
          Chrome for Testing the first time a goal needs them. \`unbrowse browser install\` fetches them now, and
          \`unbrowse browser fetch off\` stops the node fetching them itself.

          **The programs alone**, for each machine:
          - macOS: \`Unbrowse-$VERSION-macos-<arch>.dmg\` is the disk image, \`Unbrowse-$VERSION-macos-<arch>.zip\` the
            same app in a zip, and \`unbrowse-$VERSION-macos-<arch>.tar.gz\` the node, \`unb\` and the browser without the
            window.
          - Linux: \`unbrowse_${VERSION}_<arch>.deb\` is the installer, \`unbrowse-$VERSION-linux-<arch>.tar.gz\` the
            window, the node, \`unb\` and the browser in one folder. The window needs GTK 4 (or 3); on a machine without a
            desktop the node keeps its key in \`~/.unbrowse/root.key\`, readable by its user alone.
          - Windows: \`Unbrowse-$VERSION-windows-x64-setup.exe\` is the installer, \`unbrowse-$VERSION-windows-x64.zip\` the
            same four programs (\`.exe\`).

          The node browses in Chrome or another Chromium browser on the machine, and downloads Chrome for Testing when a
          goal first needs a browser and there's none. It needs Foundry's Anvil (\`foundryup\`).

          EOF
          gh release create "v$VERSION" * \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest

  # Check the uploaded artifact set and its signed inventory on builds that stop before publication.
  verify-packages:
    name: Verify release packages
    needs: &package_jobs [version, sdks, platforms, installer-device-test, sign-updates, pack-updates, sign-artifacts]
    if: >-
      ${{ !cancelled() && !failure() && needs.version.outputs.version != '' &&
      (github.repository != 'unbrowse-ai/unbrowse' || toJSON(github.event.repository.private) != 'false' || inputs.dry_run == true) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: &package_environment
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      NPM_TAG: ${{ needs.version.outputs.npm_tag }}
      # A staging build, or a release candidate before stable's first release, publishes no @unbrowse/updates.
      WITH_UPDATES: ${{ needs.version.outputs.channel != 'staging' && needs.sign-updates.outputs.published == 'true' }}
    steps:
      # The shared package checks and the public signing key.
      - &package_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/tools/npm
            unbrowse-node/app/src/update.rs
      - &package_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - &package_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - &package_sdks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdks
          path: dist
      - &package_manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts
      - &package_updates
        if: env.WITH_UPDATES == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updates
          path: updates
      - &package_verification
        name: Verify every package against the build output
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          HASHES: ${{ needs.sdks.outputs.hashes }}
          PLATFORM_HASHES: ${{ needs.platforms.outputs.hashes }}
          FILES: ${{ needs.sdks.outputs.files }}
          UPDATES: ${{ needs.pack-updates.outputs.updates }}
        run: |
          python3 -I .github/scripts/artifact-hashes.py verify-subset dist --expected "$PLATFORM_HASHES"
          python3 -I .github/scripts/artifact-hashes.py verify dist --expected "$HASHES"
          node .github/scripts/verify-artifact-manifest.mjs dist "$VERSION" "$HASHES" unbrowse-node/app/src/update.rs release-artifacts/release-artifacts.json
          python3 -I .github/scripts/artifact-hashes.py verify-files dist --expected "$FILES"
          if [ "$CHANNEL" = production ] && [ "$WITH_UPDATES" != true ]; then echo "::error::a production release always publishes update metadata"; exit 1; fi
          [ "$WITH_UPDATES" != true ] || python3 -I .github/scripts/artifact-hashes.py verify-files updates --expected "$UPDATES"

  # The public release repository builds the approved source and publishes its own verified bytes with provenance.
  # npm trusts this workflow in the release environment. The publisher starts with the same artifact checks as a rehearsal.
  npm:
    name: Publish to npm
    needs: *package_jobs
    if: >-
      ${{ !cancelled() && !failure() && needs.version.outputs.version != '' && inputs.dry_run != true &&
      github.repository == 'unbrowse-ai/unbrowse' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env: *package_environment
    steps:
      - *package_checkout
      - *package_node
      - *package_python
      - *package_sdks
      - *package_manifest
      - *package_updates
      - *package_verification
      # No registry-url: with one, setup-node writes an .npmrc whose token is a placeholder, and when npm's OIDC exchange
      # fails npm publishes with that placeholder and npm answers 404, which hides why. Without it npm says it couldn't
      # authenticate.
      # Trusted publishing uses npm installed from this trusted checkout's lockfile with lifecycle scripts disabled.
      - name: Install lockfile-pinned npm without lifecycle scripts
        run: npm ci --ignore-scripts --prefix .github/tools/npm
      - name: Publish
        run: |
          export PATH="$GITHUB_WORKSPACE/.github/tools/npm/node_modules/.bin:$PATH"
          set -- ./dist/unbrowse-*-"$VERSION".tgz "./dist/unbrowse-$VERSION.tgz"
          [ "$WITH_UPDATES" != true ] || set -- "$@" ./updates/*.tgz
          sh .github/scripts/npm-publish.sh "$VERSION" release.yml "$@"

  # npm install unbrowse@next must never get a candidate the shipped release has passed: after a production release, or
  # by hand (`next_to`), unbrowse's next tag and its platform packages' move up to the release when they are behind
  # (unbrowse-core#629). npm authenticates dist-tags by trusted publishing, this workflow's own identity in the release
  # environment: no token, and no secret in this job. Each package's trusted publisher needs "Allow npm dist-tag" on.
  # By hand (`next_to`) it skips the version job, so the ref is named here: only a run on main moves the tag, as only a
  # release merged into main ships.
  npm-next:
    name: Move npm's next tag up to the release
    needs: [version, npm]
    if: >-
      ${{ !cancelled() && github.repository == 'unbrowse-ai/unbrowse' && toJSON(github.event.repository.private) == 'false' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.next_to != '' ||
      needs.npm.result == 'success' && needs.version.outputs.channel == 'production' && inputs.dry_run != true) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/tools/npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      # npm 12.2.0 or later takes dist-tags by trusted publishing; the lockfile pins 12.2.2.
      - name: Install lockfile-pinned npm without lifecycle scripts
        run: npm ci --ignore-scripts --prefix .github/tools/npm
      - name: Move next up to the release
        env:
          VERSION: ${{ inputs.next_to || needs.version.outputs.version }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.github/tools/npm/node_modules/.bin:$PATH"
          latest=$(npm view unbrowse dist-tags.latest)
          if [ "$VERSION" != "$latest" ]; then echo "::error::$VERSION isn't npm's latest ($latest): next only moves up to a shipped release"; exit 1; fi
          sh .github/scripts/npm-next-follows.sh "$VERSION" unbrowse
