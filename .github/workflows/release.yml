name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── Stage 1: Run all tests ──
  test-gate:
    name: Test Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test tests/path-params.test.ts tests/utils.test.ts
        name: Unit tests
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test ./evals/quality-gate.test.ts
        name: Quality gate
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test ./evals/resolve-execute.test.ts
        name: Resolve-execute eval

  # ── Stage 2: Deploy to staging ──
  deploy-staging:
    name: Deploy to Staging
    runs-on: self-hosted
    needs: test-gate
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd backend && npx wrangler deploy --env staging
        name: Deploy backend to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Stage 3: Smoke test staging ──
  smoke-staging:
    name: Smoke Test Staging
    runs-on: self-hosted
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          STAGING_URL=https://unbrowse-backend-staging.lewis-6d8.workers.dev \
            bun test ./evals/staging-smoke.test.ts
        name: Run staging smoke tests

  # ── Stage 4: Live client eval against staging ──
  live-eval-staging:
    name: Live Eval (Staging)
    runs-on: self-hosted
    needs: smoke-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          UNBROWSE_BACKEND_URL=https://unbrowse-backend-staging.lewis-6d8.workers.dev \
            bun test ./evals/staging-live.test.ts
        name: Run live client eval against staging

  # ── Stage 5: Browser capture eval against staging ──
  browser-eval-staging:
    name: Browser Eval (Staging)
    runs-on: self-hosted
    needs: live-eval-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
          UNBROWSE_BACKEND_URL=https://unbrowse-backend-staging.lewis-6d8.workers.dev \
            bun test ./evals/staging-browser.test.ts
        name: Run browser capture eval against staging

  # ── Stage 6: Publish to npm ──
  publish-cli:
    name: Publish CLI (npm)
    runs-on: self-hosted
    needs: browser-eval-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Resolve npm token
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN — skipping npm publish."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$NPM_TOKEN"
          echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"

      - name: Check if version exists
        if: steps.npm-auth.outputs.skip != '1'
        id: version-check
        run: |
          PKG_NAME="$(node -p "require('./packages/skill/package.json').name")"
          PKG_VERSION="$(node -p "require('./packages/skill/package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VERSION} already published."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.npm-auth.outputs.skip != '1' && steps.version-check.outputs.skip != '1'
        working-directory: packages/skill
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          node scripts/prepare-pack.mjs

      - name: Publish to npm
        if: steps.npm-auth.outputs.skip != '1' && steps.version-check.outputs.skip != '1'
        working-directory: packages/skill
        run: npm publish

  # ── Stage 7: Deploy to production ──
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [browser-eval-staging, publish-cli]
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd backend && npx wrangler deploy
        name: Deploy backend to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd frontend && npx wrangler pages deploy dist --project-name=unbrowse 2>/dev/null || echo "Frontend deploy skipped (no dist)"
        name: Deploy frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Stage 6: Verify production ──
  verify-prod:
    name: Verify Production
    runs-on: self-hosted
    needs: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          STAGING_URL=https://beta-api.unbrowse.ai \
            bun test ./evals/staging-smoke.test.ts
        name: Verify production health
