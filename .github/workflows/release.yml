name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test-gate:
    name: Test Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test tests/path-params.test.ts tests/utils.test.ts
        name: Unit tests
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test ./evals/quality-gate.test.ts
        name: Quality gate
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test ./evals/resolve-execute.test.ts
        name: Resolve-execute eval

  publish-cli:
    name: Publish CLI (npm)
    runs-on: self-hosted
    needs: test-gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Resolve npm token
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN set — skipping npm publish."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$NPM_TOKEN"
          echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"

      - name: Check if version already exists
        if: steps.npm-auth.outputs.skip_publish != '1'
        id: version-check
        run: |
          PKG_NAME="$(node -p "require('./packages/skill/package.json').name")"
          PKG_VERSION="$(node -p "require('./packages/skill/package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VERSION} already published — skipping."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish CLI to npm
        if: steps.npm-auth.outputs.skip_publish != '1' && steps.version-check.outputs.skip_publish != '1'
        working-directory: packages/skill
        run: npm publish --provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"

  deploy-backend:
    name: Deploy Backend (CF Worker)
    runs-on: self-hosted
    needs: publish-cli
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd backend && bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend (CF Pages)
    runs-on: self-hosted
    needs: publish-cli
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd frontend && bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
