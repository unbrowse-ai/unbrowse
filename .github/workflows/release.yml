name: Publish to npm

# Canonical npm publish for `unbrowse` from this PUBLIC repo.
# Private unbrowse-dev builds the tarball, uploads it as a release asset, then
# dispatches this workflow with the tag.
#
# Auth order:
#   1) OIDC Trusted Publishing + --provenance (preferred)
#   2) NPM_TOKEN secret (granular automation token with publish on `unbrowse`)
#
# Trusted Publisher (when used):
#   https://www.npmjs.com/package/unbrowse/access
#   repo unbrowse-ai/unbrowse, workflow release.yml, environment prod
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v9.0.0 or v9.0.0-preview.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish (OIDC)
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No registry-url: placeholder NODE_AUTH_TOKEN breaks OIDC.

      - name: Upgrade npm to latest (OIDC support)
        run: npm install -g npm@latest

      - name: Download the prebuilt npm tarball from this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "unbrowse-${VERSION}.tgz" \
            --output "/tmp/unbrowse-${VERSION}.tgz"
          ls -la "/tmp/unbrowse-${VERSION}.tgz"

      - name: Publish to npm via OIDC (provenance)
        id: oidc
        continue-on-error: true
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NPM_TAG="latest"
          case "$VERSION" in *-preview.*) NPM_TAG="preview" ;; esac
          echo "Publishing unbrowse@${VERSION} (dist-tag: ${NPM_TAG}) via OIDC trusted publishing"
          if npm view "unbrowse@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::unbrowse@${VERSION} already published; nothing to do."
            echo "already=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish "/tmp/unbrowse-${VERSION}.tgz" \
            --provenance \
            --access=public \
            --tag "$NPM_TAG"
          echo "published=1" >> "$GITHUB_OUTPUT"

      - name: Fallback publish with NPM_TOKEN (no provenance)
        if: steps.oidc.outcome == 'failure' && steps.oidc.outputs.already != '1'
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NPM_TAG="latest"
          case "$VERSION" in *-preview.*) NPM_TAG="preview" ;; esac
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::OIDC publish failed and NPM_TOKEN is empty."
            echo "Configure Trusted Publishing (workflow=release.yml, environment=prod) OR set a granular automation NPM_TOKEN with publish rights on unbrowse."
            exit 1
          fi
          if npm view "unbrowse@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::unbrowse@${VERSION} already published; nothing to do."
            exit 0
          fi
          echo "::warning::OIDC Trusted Publishing failed; trying NPM_TOKEN without provenance."
          # npm expects .npmrc with _authToken when using setup-node without registry-url
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          # Validate token can authenticate before multi-MB upload
          if ! npm whoami --registry https://registry.npmjs.org/ 2>/dev/null; then
            echo "::error::NPM_TOKEN is invalid or revoked (npm whoami failed). Create a new granular automation token with Read+Write on package unbrowse and update secrets NPM_TOKEN on unbrowse-ai/unbrowse and unbrowse-ai/unbrowse-dev."
            exit 1
          fi
          npm publish "/tmp/unbrowse-${VERSION}.tgz" \
            --access=public \
            --tag "$NPM_TAG"
          echo "published unbrowse@${VERSION} via NPM_TOKEN fallback (dist-tag=${NPM_TAG})"
