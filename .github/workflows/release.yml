name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  build-darwin-kuri:
    name: Build Kuri for darwin (native macOS runner)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Build kuri darwin-arm64 (native)
        working-directory: submodules/kuri
        run: |
          zig build -Doptimize=ReleaseFast
          file zig-out/bin/kuri
      - name: Stage darwin-arm64 artifact
        run: |
          mkdir -p artifacts/darwin-arm64
          cp submodules/kuri/zig-out/bin/kuri artifacts/darwin-arm64/kuri
      - uses: actions/upload-artifact@v4
        with:
          name: kuri-darwin-arm64
          path: artifacts/darwin-arm64/kuri
          retention-days: 1

  upload-release-assets:
    name: Upload CLI Release Assets
    runs-on: self-hosted
    needs: build-darwin-kuri
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - name: Setup Bun (use pre-installed if available)
        run: |
          if command -v bun >/dev/null 2>&1; then
            echo "Using pre-installed bun: $(bun --version)"
            exit 0
          fi
          curl -fsSL https://bun.sh/install | BUN_INSTALL="$HOME/.bun" bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install GitHub CLI
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          GH_VERSION=2.70.0
          curl -fsSL -o /tmp/gh.tgz "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tgz -C /tmp
          echo "/tmp/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Resolve public release repo token
        env:
          GH_TOKEN_INPUT: ${{ github.token }}
          SKILL_REPO_TOKEN: ${{ secrets.SKILL_REPO_TOKEN }}
        run: |
          TARGET_REPO="unbrowse-ai/unbrowse"
          TOKEN="$GH_TOKEN_INPUT"
          if [ "$GITHUB_REPOSITORY" != "$TARGET_REPO" ]; then
            TOKEN="${SKILL_REPO_TOKEN:-}"
            if [ -z "$TOKEN" ]; then
              echo "::error::Missing SKILL_REPO_TOKEN for public release assets in ${TARGET_REPO}."
              exit 1
            fi
          fi
          echo "::add-mask::$TOKEN"
          echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "UNBROWSE_RELEASE_REPO=$TARGET_REPO" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Download darwin-arm64 kuri artifact
        uses: actions/download-artifact@v4
        with:
          name: kuri-darwin-arm64
          path: packages/skill/vendor/kuri/darwin-arm64
      - name: Make downloaded kuri binary executable
        run: chmod +x packages/skill/vendor/kuri/darwin-arm64/kuri
      - run: bash scripts/build-binaries.sh --all
        env:
          UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}
      - name: Create or update GitHub release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TARGET_REPO="${UNBROWSE_RELEASE_REPO}"
          # Upload only the version-scoped tarballs that install.mjs / verify-release-assets.mjs
          # actually consume (4 platforms × ~25MB) plus the signed manifest. Skips raw 69MB binaries
          # and stale tarballs from prior builds. ~4.7x smaller upload than the prior unbrowse-* glob.
          ASSETS=(
            "dist/unbrowse-v${VERSION}-darwin-arm64.tar.gz"
            "dist/unbrowse-v${VERSION}-darwin-x64.tar.gz"
            "dist/unbrowse-v${VERSION}-linux-arm64.tar.gz"
            "dist/unbrowse-v${VERSION}-linux-x64.tar.gz"
            "dist/release-manifest.json"
            "dist/release-manifest.sig"
          )
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$TARGET_REPO" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --repo "$TARGET_REPO" "${ASSETS[@]}" --title "$TAG" --notes "Release ${TAG}"
          fi

  verify-release-assets:
    name: Verify CLI Release Assets
    runs-on: self-hosted
    needs: upload-release-assets
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release assets are reachable
        working-directory: packages/skill
        env:
          UNBROWSE_RELEASE_REPO: unbrowse-ai/unbrowse
          UNBROWSE_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-assets.mjs

  publish-cli:
    name: Publish CLI (npm)
    runs-on: self-hosted
    needs: [verify-release-assets, build-darwin-kuri]
    outputs:
      package_name: ${{ steps.pkg.outputs.name }}
      package_version: ${{ steps.pkg.outputs.version }}
      published: ${{ steps.publish-result.outputs.published }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Setup Bun (use pre-installed if available)
        run: |
          if command -v bun >/dev/null 2>&1; then
            echo "Using pre-installed bun: $(bun --version)"
            exit 0
          fi
          curl -fsSL https://bun.sh/install | BUN_INSTALL="$HOME/.bun" bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Download darwin-arm64 kuri artifact
        uses: actions/download-artifact@v4
        with:
          name: kuri-darwin-arm64
          path: packages/skill/vendor/kuri/darwin-arm64
      - name: Make downloaded kuri binary executable
        run: chmod +x packages/skill/vendor/kuri/darwin-arm64/kuri
      - name: Build Kuri vendor binaries (uses pre-staged artifacts where present)
        run: node packages/skill/scripts/build-kuri-binaries.mjs
      - name: Sync manifest sha256 to actual artifact (zig builds are non-deterministic)
        run: |
          HASH=$(sha256sum packages/skill/vendor/kuri/darwin-arm64/kuri | awk '{print $1}')
          echo "[manifest-sync] darwin-arm64 binary hash: $HASH"
          node -e "
            const fs = require('fs');
            const p = 'packages/skill/vendor/kuri/manifest.json';
            const m = JSON.parse(fs.readFileSync(p));
            m.binaries['darwin-arm64'].sha256 = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
            console.log('[manifest-sync] manifest updated');
          " "$HASH"
      - run: bun run check:kuri-vendor
        name: Check baked Kuri vendor state
      - name: Leak guard — block sensitive ops names from public artifacts
        run: bash scripts/leak-guard.sh

      - name: Read package metadata
        id: pkg
        run: |
          PKG_NAME="$(node -p 'require("./packages/skill/package.json").name')"
          PKG_VERSION="$(node -p 'require("./packages/skill/package.json").version')"
          if [ -z "$PKG_NAME" ] || [ -z "$PKG_VERSION" ]; then
            echo "::error::Failed to read package metadata from packages/skill/package.json."
            exit 1
          fi
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve npm token
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN_INPUT: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          TOKEN="${NPM_TOKEN:-${NPM_PUBLISH_TOKEN:-${NODE_AUTH_TOKEN_INPUT:-}}}"
          if [ -z "$TOKEN" ]; then
            if [ "$GITHUB_REPOSITORY" = "unbrowse-ai/unbrowse" ]; then
              echo "::error::Missing npm publish secret. Set NPM_TOKEN or NPM_PUBLISH_TOKEN."
              exit 1
            fi
            echo "::notice::Skipping npm publish; no npm token configured for $GITHUB_REPOSITORY."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Validate package tarball
        if: steps.npm-auth.outputs.skip_publish != '1'
        working-directory: packages/skill
        run: npm pack --dry-run
        env:
          UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}

      - name: Smoke packaged global install
        if: steps.npm-auth.outputs.skip_publish != '1'
        run: bash scripts/smoke-packaged-cli.sh
        env:
          UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}

      - name: Check if version already exists
        if: steps.npm-auth.outputs.skip_publish != '1'
        id: version-check
        run: |
          PKG_NAME="${{ steps.pkg.outputs.name }}"
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          if [ -z "$PKG_NAME" ] || [ -z "$PKG_VERSION" ]; then
            echo "::error::Package metadata outputs are empty; refusing to publish."
            exit 1
          fi
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VERSION} is already published; skipping npm publish."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish CLI to npm
        id: npm-publish
        if: steps.npm-auth.outputs.skip_publish != '1' && steps.version-check.outputs.skip_publish != '1'
        working-directory: packages/skill
        env:
          UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}
        run: |
          PUBLISH_LOG="$(mktemp)"
          set +e
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npm publish 2>&1 | tee "$PUBLISH_LOG"
            STATUS=${PIPESTATUS[0]}
          else
            npm publish --provenance 2>&1 | tee "$PUBLISH_LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "published=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qi "previously published versions" "$PUBLISH_LOG"; then
            echo "::notice::Package version already exists on npm; treating publish as a no-op."
            echo "duplicate_version=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$STATUS"

      - name: Mark publish result
        id: publish-result
        if: always()
        run: |
          PUBLISHED=0
          if [ "${{ steps.npm-publish.outputs.published }}" = "1" ]; then
            PUBLISHED=1
          fi
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Sync npm dist-tags (latest + preview)
        if: steps.publish-result.outputs.published == '1' || steps.npm-publish.outputs.duplicate_version == '1'
        run: bash scripts/npm-dist-tag-sync.sh
        env:
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
          UNBROWSE_PUBLISHED_VERSION: ${{ steps.pkg.outputs.version }}
  deploy-backend:
    name: Deploy Backend (CF Worker)
    runs-on: self-hosted
    needs: publish-cli
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - name: Setup Bun (use pre-installed if available)
        run: |
          if command -v bun >/dev/null 2>&1; then
            echo "Using pre-installed bun: $(bun --version)"
            exit 0
          fi
          curl -fsSL https://bun.sh/install | BUN_INSTALL="$HOME/.bun" bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend (CF Pages)
    runs-on: self-hosted
    needs: publish-cli
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - name: Setup Bun (use pre-installed if available)
        run: |
          if command -v bun >/dev/null 2>&1; then
            echo "Using pre-installed bun: $(bun --version)"
            exit 0
          fi
          curl -fsSL https://bun.sh/install | BUN_INSTALL="$HOME/.bun" bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
