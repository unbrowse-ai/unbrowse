name: Release

# Publishes a prebuilt unbrowse tarball attached to a public GitHub release.
# Trusted Publishing is bound to environment=prod on this workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v11.4.2) whose unbrowse-VERSION.tgz should be published"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag override (e.g. next). Default: preview for -preview.N versions, else latest."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish unbrowse tarball to npm
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm 11 (Trusted Publishing requires >= 11.5.1)
        run: |
          npm install -g npm@11
          npm --version
      - name: Download release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo unbrowse-ai/unbrowse --pattern "unbrowse-${VERSION}.tgz"
          test -s "unbrowse-${VERSION}.tgz"
          BYTES="$(wc -c < "unbrowse-${VERSION}.tgz" | tr -d ' ')"
          echo "tarball bytes=$BYTES"
          if [ "$BYTES" -ge 100000000 ]; then
            echo "::error::tarball is ${BYTES} bytes; npm silently drops publishes over 100MB"
            exit 1
          fi
          echo "tarball=unbrowse-${VERSION}.tgz" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          DT="${{ inputs.dist_tag }}"
          if [ -z "$DT" ]; then case "$VERSION" in *-preview.*) DT=preview ;; *) DT=latest ;; esac; fi
          echo "DIST_TAG=$DT" >> "$GITHUB_ENV"
      - name: Assert packed linux-x64 kuri is a real ELF
        # 12.x is the v3 client: a pure Node CLI with no bundled browser broker.
        if: ${{ !startsWith(inputs.tag, 'v12.') }}
        run: |
          MEMBER="package/vendor/kuri/linux-x64/kuri"
          tar -tzf "$tarball" | grep -F "$MEMBER"
          SIZE="$(tar -xOf "$tarball" "$MEMBER" | wc -c)"
          echo "linux-x64 kuri bytes=$SIZE"
          test "$SIZE" -gt 100000
          HEADER="$(tar -xOf "$tarball" "$MEMBER" | head -c 4 | od -An -tx1 | tr -d ' \n')"
          test "$HEADER" = "7f454c46"
          if tar -xOf "$tarball" package/package.json | grep -q cloakbrowser; then
            echo "::error::packed package.json still depends on cloakbrowser"
            exit 1
          fi
      - name: Refuse if version already exists
        id: version-check
        run: |
          if npm view "unbrowse@${version}" version >/dev/null 2>&1; then
            echo "::notice::unbrowse@${version} is already published; nothing to do."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm via Trusted Publishing
        id: oidc
        if: steps.version-check.outputs.skip_publish != '1'
        run: |
          # npm 11 uses GitHub OIDC. Do not set NODE_AUTH_TOKEN here.
          npm publish "$tarball" --access public --provenance --tag "$DIST_TAG"
      - name: Publish to npm via NPM_TOKEN fallback
        if: steps.version-check.outputs.skip_publish != '1' && steps.oidc.conclusion != 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          npm publish "$tarball" --access public --tag "$DIST_TAG"
      - name: Verify version and dist-tag
        if: steps.version-check.outputs.skip_publish != '1'
        run: |
          # Large tarballs take minutes to appear on the packument (11.5.0, 54 MB: ~4.5 min). Wait up to 10.
          for i in $(seq 1 60); do
            PUBLISHED="$(npm view "unbrowse@${version}" version 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$version" ]; then
              break
            fi
            sleep 10
          done
          test "$PUBLISHED" = "$version"
          # The dist-tag chosen above (input, else preview/latest). Tags lag the version briefly.
          TAG="$DIST_TAG"
          for i in $(seq 1 60); do
            ACTUAL="$(npm view unbrowse "dist-tags.${TAG}" 2>/dev/null || true)"
            [ "$ACTUAL" = "$version" ] && break
            sleep 10
          done
          test "$ACTUAL" = "$version"

  publish-sdk:
    # @unbrowse/sdk, same Trusted Publisher binding (this workflow, environment prod). Runs only when
    # the release carries unbrowse-sdk-VERSION.tgz; otherwise it is a no-op.
    name: Publish @unbrowse/sdk tarball to npm
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm 11 (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@11
      - name: Download SDK tarball if the release has one
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          ASSET="unbrowse-sdk-${VERSION}.tgz"
          if ! gh release view "$TAG" --repo unbrowse-ai/unbrowse --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "::notice::release $TAG has no $ASSET; nothing to publish."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$TAG" --repo unbrowse-ai/unbrowse --pattern "$ASSET"
          NAME="$(tar -xOf "$ASSET" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(p.name+"@"+p.version)})')"
          test "$NAME" = "@unbrowse/sdk@${VERSION}" || { echo "::error::tarball is $NAME, expected @unbrowse/sdk@${VERSION}"; exit 1; }
          echo "sdk_tarball=$ASSET" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          DT="${{ inputs.dist_tag }}"
          if [ -z "$DT" ]; then case "$VERSION" in *-preview.*) DT=preview ;; *) DT=latest ;; esac; fi
          echo "DIST_TAG=$DT" >> "$GITHUB_ENV"
      - name: Refuse if version already exists
        id: version-check
        if: steps.asset.outputs.skip != '1'
        run: |
          if npm view "@unbrowse/sdk@${version}" version >/dev/null 2>&1; then
            echo "::notice::@unbrowse/sdk@${version} is already published; nothing to do."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish via Trusted Publishing
        if: steps.asset.outputs.skip != '1' && steps.version-check.outputs.skip_publish != '1'
        # --loglevel verbose shows the OIDC token exchange, so a Trusted Publisher mismatch is diagnosable.
        run: npm publish "$sdk_tarball" --access public --provenance --loglevel verbose --tag "$DIST_TAG"
      - name: Verify version and dist-tag
        if: steps.asset.outputs.skip != '1' && steps.version-check.outputs.skip_publish != '1'
        run: |
          TAG="$DIST_TAG"
          for i in $(seq 1 60); do
            [ "$(npm view "@unbrowse/sdk@${version}" version 2>/dev/null || true)" = "$version" ] && \
            [ "$(npm view @unbrowse/sdk "dist-tags.${TAG}" 2>/dev/null || true)" = "$version" ] && exit 0
            sleep 10
          done
          echo "::error::@unbrowse/sdk@${version} did not appear as ${TAG} within 10 minutes"; exit 1
