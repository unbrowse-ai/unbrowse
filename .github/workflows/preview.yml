name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to rebuild the preview for
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  context:
    name: Resolve Preview Context
    runs-on: self-hosted
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      internal_pr: ${{ steps.context.outputs.internal_pr }}
    steps:
      - name: Resolve PR metadata
        id: context
        uses: actions/github-script@v7
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            let pr = context.payload.pull_request;
            if (context.eventName === "workflow_dispatch") {
              const prNumber = Number(process.env.INPUT_PR_NUMBER);
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed("workflow_dispatch requires a numeric pr_number input.");
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = response.data;
            }

            if (!pr) {
              core.setFailed("No pull request context available for preview workflow.");
              return;
            }

            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput(
              "internal_pr",
              pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` ? "true" : "false",
            );

  note-fork-skip:
    name: Note Fork Preview Skip
    runs-on: self-hosted
    needs: context
    if: ${{ github.event_name == 'pull_request_target' && needs.context.outputs.internal_pr != 'true' }}
    steps:
      - name: Upsert fork preview note
        uses: actions/github-script@v7
        env:
          PREVIEW_MARKER: "<!-- codex-preview-environment -->"
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
        with:
          script: |
            const marker = process.env.PREVIEW_MARKER;
            const issue_number = Number(process.env.PR_NUMBER);
            const body = [
              marker,
              "## Preview Environment",
              "",
              "Preview skipped for this PR because the head branch comes from a fork.",
              "",
              "Cloudflare deploy credentials and `PREVIEW_API_URL` are not exposed to forked code.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

  deploy-preview:
    name: Deploy Frontend Preview
    runs-on: self-hosted
    needs: context
    if: ${{ github.event_name != 'pull_request_target' && needs.context.outputs.internal_pr == 'true' }}
    concurrency:
      group: preview-pr-${{ needs.context.outputs.pr_number }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_sha }}

      - run: git submodule update --init submodules/kuri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - run: bun install --frozen-lockfile

      - name: Resolve preview API URL
        id: api-url
        env:
          PREVIEW_API_URL_VAR: ${{ vars.PREVIEW_API_URL }}
          PREVIEW_API_URL_SECRET: ${{ secrets.PREVIEW_API_URL }}
        run: |
          API_URL="${PREVIEW_API_URL_VAR:-${PREVIEW_API_URL_SECRET:-}}"
          if [ -z "$API_URL" ]; then
            echo "::notice::Skipping preview deploy; missing PREVIEW_API_URL repo variable or secret."
            echo "skip_preview=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$API_URL"
          echo "preview_api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Build frontend for preview
        id: build
        if: ${{ steps.api-url.outputs.skip_preview != '1' }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.api-url.outputs.preview_api_url }}
        run: ./node_modules/.bin/opennextjs-cloudflare build

      - name: Upload Cloudflare preview version
        id: upload
        if: ${{ steps.api-url.outputs.skip_preview != '1' }}
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ steps.api-url.outputs.preview_api_url }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview-output.jsonl
        run: |
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          ./node_modules/.bin/opennextjs-cloudflare upload --preview-alias "pr-${{ needs.context.outputs.pr_number }}"

      - name: Parse Wrangler preview output
        id: parse
        if: ${{ steps.api-url.outputs.skip_preview != '1' && steps.upload.outcome == 'success' }}
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview-output.jsonl
        run: |
          node <<'NODE'
          const fs = require("fs");

          const outputPath = process.env.WRANGLER_OUTPUT_FILE_PATH;
          if (!outputPath || !fs.existsSync(outputPath)) {
            throw new Error(`Wrangler output file not found: ${outputPath}`);
          }

          const lines = fs.readFileSync(outputPath, "utf8")
            .split(/\n+/)
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => JSON.parse(line));

          const entry = [...lines].reverse().find((item) => item.type === "version-upload");
          if (!entry) {
            throw new Error("Missing version-upload record in Wrangler output.");
          }

          const append = (key, value) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value ?? ""}\n`);
          };

          append("worker_name", entry.worker_name ?? "");
          append("version_id", entry.version_id ?? "");
          append("preview_url", entry.preview_url ?? "");
          append("preview_alias_url", entry.preview_alias_url ?? "");
          NODE

      - name: Upsert preview comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          PREVIEW_MARKER: "<!-- codex-preview-environment -->"
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          SKIP_PREVIEW: ${{ steps.api-url.outputs.skip_preview }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PREVIEW_API_URL: ${{ steps.api-url.outputs.preview_api_url }}
          PREVIEW_URL: ${{ steps.parse.outputs.preview_url }}
          PREVIEW_ALIAS_URL: ${{ steps.parse.outputs.preview_alias_url }}
          VERSION_ID: ${{ steps.parse.outputs.version_id }}
        with:
          script: |
            const marker = process.env.PREVIEW_MARKER;
            const issue_number = Number(process.env.PR_NUMBER);
            const shortSha = (process.env.HEAD_SHA || "").slice(0, 7);
            const buildOutcome = process.env.BUILD_OUTCOME || "skipped";
            const uploadOutcome = process.env.UPLOAD_OUTCOME || "skipped";
            const previewAliasUrl = process.env.PREVIEW_ALIAS_URL || "";
            const previewUrl = process.env.PREVIEW_URL || "";
            const previewApiUrl = process.env.PREVIEW_API_URL || "";
            const versionId = process.env.VERSION_ID || "";
            const previewSkipped = process.env.SKIP_PREVIEW === "1";

            let body;
            if (previewSkipped) {
              body = [
                marker,
                "## Preview Environment",
                "",
                "Preview skipped because `PREVIEW_API_URL` is not configured for this repository.",
                "",
                "Set the repo variable or secret, then rerun the `Preview` workflow.",
              ].join("\n");
            } else if (buildOutcome === "success" && uploadOutcome === "success") {
              const stableUrl = previewAliasUrl || previewUrl;
              const commitUrl = previewUrl || previewAliasUrl;
              body = [
                marker,
                "## Preview Environment",
                "",
                `Stable preview: ${stableUrl ? `[${stableUrl}](${stableUrl})` : "unavailable"}`,
                `Commit preview: ${commitUrl ? `[${commitUrl}](${commitUrl})` : "unavailable"}`,
                `Commit: \`${shortSha}\``,
                `Version: \`${versionId.slice(0, 8)}\``,
                `API: \`${previewApiUrl}\` (staging)`,
                "",
                "This preview is public on `workers.dev` and does not affect production traffic.",
              ].join("\n");
            } else {
              body = [
                marker,
                "## Preview Environment",
                "",
                `Preview build/deploy failed for commit \`${shortSha}\`.`,
                `API target: \`${previewApiUrl || "unresolved"}\` (staging)`,
                "",
                "See the latest `Preview` workflow run for logs.",
              ].join("\n");
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
