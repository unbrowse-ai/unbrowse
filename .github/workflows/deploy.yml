name: Deploy

on:
  push:
    branches: [main, staging, 'lewis/experiments']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend (CF Worker)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - name: Deploy backend worker
        run: |
          case "${GITHUB_REF_NAME}" in
            staging)
              ./node_modules/.bin/wrangler deploy --config wrangler.ci.toml --env staging
              ;;
            lewis/experiments)
              ./node_modules/.bin/wrangler deploy --config wrangler.ci.toml --env experiments
              ;;
            *)
              bun run deploy:ci
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend (CF Pages)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - name: Resolve frontend API target
        id: api-url
        env:
          PREVIEW_API_URL_VAR: ${{ vars.PREVIEW_API_URL }}
          PREVIEW_API_URL_SECRET: ${{ secrets.PREVIEW_API_URL }}
          EXPERIMENTS_API_URL_VAR: ${{ vars.EXPERIMENTS_API_URL }}
          EXPERIMENTS_API_URL_SECRET: ${{ secrets.EXPERIMENTS_API_URL }}
        run: |
          case "${GITHUB_REF_NAME}" in
            staging)
              API_URL="${PREVIEW_API_URL_VAR:-${PREVIEW_API_URL_SECRET:-}}"
              if [ -z "$API_URL" ]; then
                echo "::notice::Skipping staging frontend deploy; missing PREVIEW_API_URL repo variable or secret."
                echo "skip_frontend=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            lewis/experiments)
              API_URL="${EXPERIMENTS_API_URL_VAR:-${EXPERIMENTS_API_URL_SECRET:-}}"
              if [ -z "$API_URL" ]; then
                echo "::notice::Skipping experiments frontend deploy; missing EXPERIMENTS_API_URL repo variable or secret."
                echo "skip_frontend=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              API_URL="https://beta-api.unbrowse.ai"
              ;;
          esac
          echo "::add-mask::$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Deploy frontend worker
        if: steps.api-url.outputs.skip_frontend != '1'
        run: |
          case "${GITHUB_REF_NAME}" in
            staging)
              CLOUDFLARE_ENV=staging ./node_modules/.bin/opennextjs-cloudflare build
              OPEN_NEXT_DEPLOY=true ./node_modules/.bin/wrangler deploy --env staging
              ;;
            lewis/experiments)
              ./node_modules/.bin/opennextjs-cloudflare build
              OPEN_NEXT_DEPLOY=true ./node_modules/.bin/wrangler deploy
              ;;
            *)
              bun run deploy:ci
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ steps.api-url.outputs.api_url }}

  publish-preview-cli:
    name: Publish Preview CLI (npm)
    runs-on: self-hosted
    if: github.ref_name == 'lewis/experiments'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile

      - name: Set preview backend URL + version
        env:
          EXPERIMENTS_API_URL_VAR: ${{ vars.EXPERIMENTS_API_URL }}
          EXPERIMENTS_API_URL_SECRET: ${{ secrets.EXPERIMENTS_API_URL }}
        run: |
          API_URL="${EXPERIMENTS_API_URL_VAR:-${EXPERIMENTS_API_URL_SECRET:-https://unbrowse-backend-experiments.lewis-6d8.workers.dev}}"
          # Set backend URL for build-release-manifest.ts (writes build-info.generated.ts)
          echo "UNBROWSE_BUILD_DEFAULT_BACKEND_URL=${API_URL}" >> "$GITHUB_ENV"
          # Set preview version: base version + commit sha
          BASE_VERSION=$(node -p 'require("./packages/skill/package.json").version')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | head -c 7)
          PREVIEW_VERSION="${BASE_VERSION}-experiments.${SHORT_SHA}"
          echo "PREVIEW_VERSION=${PREVIEW_VERSION}" >> "$GITHUB_ENV"
          # Bump version everywhere so assert-release-flow.mjs passes
          node -e "
            const fs = require('fs');
            const v = '${PREVIEW_VERSION}';
            for (const f of ['package.json', 'packages/skill/package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
            const vj = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            vj.version = v;
            fs.writeFileSync('version.json', JSON.stringify(vj, null, 2) + '\n');
          "

      - name: Resolve npm token
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN_INPUT: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          TOKEN="${NPM_TOKEN:-${NPM_PUBLISH_TOKEN:-${NODE_AUTH_TOKEN_INPUT:-}}}"
          if [ -z "$TOKEN" ]; then
            echo "::notice::Skipping npm preview publish; no npm token configured."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish preview CLI
        if: steps.npm-auth.outputs.skip_publish != '1'
        working-directory: packages/skill
        env:
          UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}
        run: |
          npm pack
          npm publish --tag experiments --ignore-scripts
          echo "Published unbrowse@${PREVIEW_VERSION} with tag 'experiments'"

  sync-skill:
    name: Sync Skill Repo
    runs-on: self-hosted
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile

      - name: Resolve skill repo token
        id: skill-auth
        env:
          SKILL_REPO_TOKEN: ${{ secrets.SKILL_REPO_TOKEN }}
        run: |
          if [ -n "$SKILL_REPO_TOKEN" ]; then
            echo "skip_sync=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REPOSITORY" = "unbrowse-ai/unbrowse" ]; then
            echo "::error::Missing SKILL_REPO_TOKEN for canonical deploy."
            exit 1
          fi
          echo "::notice::Skipping skill repo sync; no SKILL_REPO_TOKEN configured for $GITHUB_REPOSITORY."
          echo "skip_sync=1" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout skill repo
        if: steps.skill-auth.outputs.skip_sync != '1'
        uses: actions/checkout@v4
        with:
          repository: unbrowse-ai/unbrowse
          token: ${{ secrets.SKILL_REPO_TOKEN }}
          ref: stable
          path: _skill-repo

      - name: Sync and push
        if: steps.skill-auth.outputs.skip_sync != '1'
        env:
          CI: "true"
          UNBROWSE_SKILL_REPO: ${{ github.workspace }}/_skill-repo
          UNBROWSE_SKILL_REPO_BRANCH: stable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-skill.sh "chore: sync main ${GITHUB_SHA}"
