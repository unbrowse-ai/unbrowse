name: Deploy

on:
  push:
    branches: [main, staging, 'lewis/experiments']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  deploy-backend:
    name: Deploy Backend (CF Worker)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      # Principle 20260521T194246Z-7ad798e3: deploy-time identity vars feed
      # GET /v1/version so any caller can verify they hit the artifact CI
      # built (signed_manifest_hash = hex(hmac-sha256(version|build_sha|
      # deployed_at, RELEASE_MANIFEST_SIGNING_SECRET))). Without these,
      # /v1/version surfaces null fields per the no-stubs principle
      # 20260521T193905Z-61e01c0e and the gate cannot fire.
      - name: Compute deploy identity vars
        id: vars
        working-directory: .
        run: |
          VERSION=$(node -e "console.log(require('./version.json').version)")
          BUILD_SHA="${GITHUB_SHA}"
          DEPLOYED_AT=$(date -u +%FT%TZ)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"
          echo "deployed_at=${DEPLOYED_AT}" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploy identity v=${VERSION} sha=${BUILD_SHA:0:8} at=${DEPLOYED_AT}"
      # Staging-first gate (principle 20260521T194246Z-7ad798e3). main-branch
      # deploys MUST find the staging worker already on the same commit AND
      # its signed_manifest_hash MUST verify against the shared
      # RELEASE_MANIFEST_SIGNING_SECRET. If staging is on a different SHA or
      # the HMAC mismatches, prod refuses to deploy. To pass: push the same
      # commit to the staging branch first, let the staging deploy job
      # complete, then push to main. There is no bypass flag; the gate IS
      # the contract.
      - name: Verify staging /v1/version before main deploy
        if: github.ref_name == 'main'
        working-directory: .
        env:
          RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.RELEASE_MANIFEST_SIGNING_SECRET || secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}
          EXPECTED_SHA: ${{ steps.vars.outputs.build_sha }}
          EXPECTED_CHANNEL: staging
        run: |
          if [ -z "$RELEASE_MANIFEST_SIGNING_SECRET" ]; then
            echo "::error::Neither RELEASE_MANIFEST_SIGNING_SECRET nor UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET is set; cannot verify staging manifest"
            exit 1
          fi
          STAGING_URL="${{ vars.PREVIEW_API_URL }}"
          if [ -z "$STAGING_URL" ]; then
            STAGING_URL="https://unbrowse-backend-staging.lewis-6d8.workers.dev"
          fi
          echo "::notice::Staging-first gate: verifying ${STAGING_URL}/v1/version against $EXPECTED_SHA"
          bash scripts/verify-release-manifest.sh "$STAGING_URL"
      - name: Deploy backend worker
        run: |
          WRANGLER_VARS="--var UNBROWSE_VERSION:${{ steps.vars.outputs.version }} --var UNBROWSE_BUILD_SHA:${{ steps.vars.outputs.build_sha }} --var UNBROWSE_DEPLOYED_AT:${{ steps.vars.outputs.deployed_at }}"
          case "${GITHUB_REF_NAME}" in
            staging)
              ./node_modules/.bin/wrangler deploy --config wrangler.ci.toml --env staging $WRANGLER_VARS
              ;;
            lewis/experiments)
              ./node_modules/.bin/wrangler deploy --config wrangler.ci.toml --env experiments $WRANGLER_VARS
              ;;
            *)
              ./node_modules/.bin/wrangler deploy --config wrangler.ci.toml $WRANGLER_VARS
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend (CF Pages)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - name: Resolve frontend API target
        id: api-url
        env:
          PREVIEW_API_URL_VAR: ${{ vars.PREVIEW_API_URL }}
          PREVIEW_API_URL_SECRET: ${{ secrets.PREVIEW_API_URL }}
          EXPERIMENTS_API_URL_VAR: ${{ vars.EXPERIMENTS_API_URL }}
          EXPERIMENTS_API_URL_SECRET: ${{ secrets.EXPERIMENTS_API_URL }}
        run: |
          case "${GITHUB_REF_NAME}" in
            staging)
              API_URL="${PREVIEW_API_URL_VAR:-${PREVIEW_API_URL_SECRET:-}}"
              if [ -z "$API_URL" ]; then
                echo "::notice::Skipping staging frontend deploy; missing PREVIEW_API_URL repo variable or secret."
                echo "skip_frontend=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            lewis/experiments)
              API_URL="https://beta-api.unbrowse.ai"
              ;;
            *)
              API_URL="https://beta-api.unbrowse.ai"
              ;;
          esac
          echo "::add-mask::$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Deploy frontend worker
        if: steps.api-url.outputs.skip_frontend != '1'
        run: |
          case "${GITHUB_REF_NAME}" in
            staging)
              CLOUDFLARE_ENV=staging ./node_modules/.bin/opennextjs-cloudflare build
              OPEN_NEXT_DEPLOY=true ./node_modules/.bin/wrangler deploy --env staging
              ;;
            lewis/experiments)
              CLOUDFLARE_ENV=experiments ./node_modules/.bin/opennextjs-cloudflare build
              OPEN_NEXT_DEPLOY=true ./node_modules/.bin/wrangler deploy --env experiments
              ;;
            *)
              bun run deploy:ci
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ steps.api-url.outputs.api_url }}

  publish-preview-cli:
    name: Publish Preview CLI (npm)
    runs-on: self-hosted
    if: github.ref_name == 'lewis/experiments'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile

      - name: Set preview backend URL + version
        env:
          EXPERIMENTS_API_URL_VAR: ${{ vars.EXPERIMENTS_API_URL }}
          EXPERIMENTS_API_URL_SECRET: ${{ secrets.EXPERIMENTS_API_URL }}
        run: |
          API_URL="${EXPERIMENTS_API_URL_VAR:-${EXPERIMENTS_API_URL_SECRET:-https://unbrowse-backend-experiments.lewis-6d8.workers.dev}}"
          # Set backend URL for build-release-manifest.ts (writes build-info.generated.ts)
          echo "UNBROWSE_BUILD_DEFAULT_BACKEND_URL=${API_URL}" >> "$GITHUB_ENV"
          # Set preview version: base version + commit sha
          BASE_VERSION=$(node -p 'require("./packages/skill/package.json").version')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | head -c 7)
          PREVIEW_VERSION="${BASE_VERSION}-experiments.${SHORT_SHA}"
          echo "PREVIEW_VERSION=${PREVIEW_VERSION}" >> "$GITHUB_ENV"
          # Bump version everywhere so assert-release-flow.mjs passes
          node -e "
            const fs = require('fs');
            const v = '${PREVIEW_VERSION}';
            for (const f of ['package.json', 'packages/skill/package.json']) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
            const vj = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            vj.version = v;
            fs.writeFileSync('version.json', JSON.stringify(vj, null, 2) + '\n');
          "

      - name: Resolve npm token
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN_INPUT: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          TOKEN="${NPM_TOKEN:-${NPM_PUBLISH_TOKEN:-${NODE_AUTH_TOKEN_INPUT:-}}}"
          if [ -z "$TOKEN" ]; then
            echo "::notice::Skipping npm preview publish; no npm token configured."
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish preview CLI
        if: steps.npm-auth.outputs.skip_publish != '1'
        working-directory: packages/skill
        env:
          UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}
        run: |
          npm pack
          npm publish --tag experiments --ignore-scripts
          echo "Published unbrowse@${PREVIEW_VERSION} with tag 'experiments'"
