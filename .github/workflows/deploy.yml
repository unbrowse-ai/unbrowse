name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend (CF Worker)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend (CF Pages)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  sync-skill:
    name: Sync Skill Repo
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile

      - name: Resolve skill repo token
        id: skill-auth
        env:
          SKILL_REPO_TOKEN: ${{ secrets.SKILL_REPO_TOKEN }}
        run: |
          if [ -n "$SKILL_REPO_TOKEN" ]; then
            echo "skip_sync=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REPOSITORY" = "unbrowse-ai/unbrowse" ]; then
            echo "::error::Missing SKILL_REPO_TOKEN for canonical deploy."
            exit 1
          fi
          echo "::notice::Skipping skill repo sync; no SKILL_REPO_TOKEN configured for $GITHUB_REPOSITORY."
          echo "skip_sync=1" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout skill repo
        if: steps.skill-auth.outputs.skip_sync != '1'
        uses: actions/checkout@v4
        with:
          repository: unbrowse-ai/unbrowse
          token: ${{ secrets.SKILL_REPO_TOKEN }}
          ref: stable
          path: _skill-repo

      - name: Sync and push
        if: steps.skill-auth.outputs.skip_sync != '1'
        env:
          CI: "true"
          UNBROWSE_SKILL_REPO: ${{ github.workspace }}/_skill-repo
          UNBROWSE_SKILL_REPO_BRANCH: stable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-skill.sh "chore: sync main ${GITHUB_SHA}"
