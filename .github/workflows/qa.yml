# QA by an agent: a node built from staging runs on a Mac, nightly and by hand, and Claude uses it the way every agent
# does, through its MCP tools, working through .github/qa/checklist.md (learn and call a route, browse a page that
# needs hands, sign in from the vault without seeing the password, the refusals). The report goes in the run's summary
# and its `qa-report` artifact, on no pull request; a check that fails fails the job.
#
# Needs a Claude credential as a repository secret: ANTHROPIC_API_KEY (an API key) or CLAUDE_CODE_OAUTH_TOKEN (a
# subscription, from `claude setup-token`). `/install-github-app` in Claude Code adds either. Without one the job says
# so and passes.
#
# The agent reads pages anyone can write, so its job holds nothing it could hand on: a read-only token, kept off the
# disk, no OIDC, no cache another job reads, no shell or file reads outside the work tree, and a report scrubbed of
# anything shaped like a key before it leaves. The summary is written by a job of its own that holds no permission and
# runs nothing the agent wrote: it only copies the scrubbed report into the run's summary.
name: QA

# Nightly and by hand, never on each push: the agent's part spends the Claude subscription's weekly allowance. Not on
# a pull request either, labelled or not: a job that holds the model's credential runs no code a pull request brought
# (test_workflow_security.py).
on:
  schedule:
    - cron: '47 20 * * *'
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  qa:
    name: Claude QA
    if: >-
      github.ref == 'refs/heads/staging'
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.auth.outputs.ok }}
    steps:
      - id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY$OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Claude QA didn't run: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret (/install-github-app in Claude Code)"
          fi

      - if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The page sandbox and scratch-node.sh need Node 25 or later (26 is the LTS): older Nodes let a page's scripts reach the network
      # under --permission.
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # A token that is set can still refuse (a weekly limit): the job runs on the first one that answers.
      # The Claude CLI the credential is asked with: the locked one, its lifecycle scripts off, in a step with no secret.
      - name: Install the pinned Claude CLI
        if: steps.auth.outputs.ok == 'true'
        run: npm ci --silent --ignore-scripts --prefix .github/tools/claude-cli
      - name: Pick the Claude credential that answers
        id: credential
        if: steps.auth.outputs.ok == 'true'
        env:
          CLAUDE_BIN: ${{ github.workspace }}/.github/tools/claude-cli/node_modules/.bin/claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: sh .github/scripts/claude-credential.sh TOKEN_2 TOKEN
      - if: steps.auth.outputs.ok == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
      # Restored, never saved: the tree this job ends with has been in reach of the agent's Write.
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor
        with:
          path: unbrowse-node/vendor
          key: btls-sys-${{ runner.os }}-${{ hashFiles('unbrowse-node/scripts/apply-tls-patch.sh', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-ext.patch') }}
      - if: steps.auth.outputs.ok == 'true' && steps.vendor.outputs.cache-hit != 'true'
        working-directory: unbrowse-node
        run: sh scripts/apply-tls-patch.sh
      # The build's folders are restored here and saved straight after the build, before anything that reads the web
      # or an agent with Write runs: a cache this job saves holds only what the build made. A key is saved once, for a
      # lockfile, by the first run that misses it, and no other workflow restores it.
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            unbrowse-node/target
            unbrowse-browser/cli/target
          key: qa-${{ runner.os }}-rust-1.99.1-${{ hashFiles('unbrowse-node/Cargo.lock', 'unbrowse-browser/cli/Cargo.lock') }}
          restore-keys: qa-${{ runner.os }}-rust-1.99.1-
      - name: Build the node and its browser
        if: steps.auth.outputs.ok == 'true'
        run: |
          cargo build --locked --manifest-path unbrowse-browser/cli/Cargo.toml
          cargo build --locked --manifest-path unbrowse-node/Cargo.toml --bin unbrowse-node --bin unb

      - name: Save the build's folders before anything else runs
        if: steps.auth.outputs.ok == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            unbrowse-node/target
            unbrowse-browser/cli/target
          key: qa-${{ runner.os }}-rust-1.99.1-${{ hashFiles('unbrowse-node/Cargo.lock', 'unbrowse-browser/cli/Cargo.lock') }}

      # A node of its own, as an agent's machine would have: an agent key, a login in the vault for the sign-in check,
      # and a browser (the node downloads Chrome for Testing when the runner has none).
      - name: Start the node
        if: steps.auth.outputs.ok == 'true'
        run: |
          node=unbrowse-node/target/debug/unbrowse-node
          export UNBROWSE_HOME="$RUNNER_TEMP/unbrowse"
          echo "UNBROWSE_HOME=$UNBROWSE_HOME" >> "$GITHUB_ENV"
          mkdir -p "$UNBROWSE_HOME"

          if printf 'SuperSecretPassword!\n' | "$node" vault add the-internet.herokuapp.com tomsmith --stored; then
            echo "VAULT_READY=yes" >> "$GITHUB_ENV"
          else
            echo "VAULT_READY=no" >> "$GITHUB_ENV"
          fi
          # The setup names the key by its number, never its token: read the token by that number.
          index=$("$node" agent new qa 2>/dev/null | grep -o -- '--agent [0-9]*' | head -n 1 | cut -d' ' -f2)
          token=$([ -n "$index" ] && "$node" agent token "$index")
          [ -n "$token" ] || { echo "::error::couldn't make an agent key"; exit 1; }
          echo "::add-mask::$token"

          # Telemetry and bug reports on, sent to an address nothing answers: this node is off the network, so check 12's
          # report must stay on it with reports on, and no QA run ever files a real issue.
          UNBROWSE_TELEMETRY=1 UNBROWSE_TELEMETRY_URL=http://127.0.0.1:9/v1/events \
          UNBROWSE_REPORTS=1 UNBROWSE_REPORTS_URL=http://127.0.0.1:9/v1/reports \
            nohup "$node" > "$RUNNER_TEMP/node.log" 2>&1 &
          # `unb` signs each request with the token, as every client does: the node takes no bearer token.
          unb="$GITHUB_WORKSPACE/unbrowse-node/target/debug/unb"
          echo "UNB=$unb" >> "$GITHUB_ENV"
          for _ in $(seq 60); do
            UNBROWSE_AGENT_TOKEN="$token" "$unb" whoami > /dev/null 2>&1 && break
            sleep 2
          done
          UNBROWSE_AGENT_TOKEN="$token" "$unb" whoami > /dev/null || { cat "$RUNNER_TEMP/node.log"; exit 1; }

          for _ in $(seq 120); do
            using=$("$node" browser status --json | jq -r '.chromium // empty')
            [ -n "$using" ] && break
            sleep 5
          done
          [ -n "$using" ] || { echo "::error::the node has no browser"; cat "$RUNNER_TEMP/node.log"; exit 1; }
          echo "Browsing in $using"

          # The node's MCP server as a shipped setup gives it: `unb mcp`, which signs each message.
          jq -n --arg unb "$unb" --arg token "$token" \
            '{mcpServers: {unbrowse: {command: $unb, args: ["mcp"], env: {UNBROWSE_NODE: "http://127.0.0.1:7788", UNBROWSE_AGENT_TOKEN: $token}}}}' \
            > "$RUNNER_TEMP/mcp.json"

      # Whether an agent reaches for the node when nothing tells it to: the QA below turns every other web tool off, so it
      # can't show this. Before QA, so its verdict is out of the agent's reach. It has no shell and no file tools, and a
      # failure here doesn't stop QA: the verdict step at the end reads it. On a scratch node of its own: what its sessions
      # learn (a signed-in session teaches a sign-in route) would otherwise answer the checklist's first asks.
      - name: Tool choice setup
        id: choice-setup
        if: steps.auth.outputs.ok == 'true'
        continue-on-error: true
        run: |
          (cd .github/qa && python3 -m unittest test_tool_choice)
          npm ci --silent --ignore-scripts --prefix .github/tools/claude-cli
          scratch="$RUNNER_TEMP/tc"
          PORT=17820 sh test-banks/popular-sites/scratch-node.sh "$scratch"
          echo "::add-mask::$(cat "$scratch/token")"
          printf 'SuperSecretPassword!\n' | env -i HOME="$scratch/home" UNBROWSE_HOME="$scratch/home/node" PATH=/usr/bin:/bin \
            unbrowse-node/target/debug/unbrowse-node vault add the-internet.herokuapp.com tomsmith --stored
          jq -n --arg unb "$UNB" --arg token "$(cat "$scratch/token")" \
            '{mcpServers: {unbrowse: {command: $unb, args: ["mcp"], env: {UNBROWSE_NODE: "http://127.0.0.1:17820", UNBROWSE_AGENT_TOKEN: $token}}}}' \
            > "$scratch/mcp.json"

      # Only the pinned CLI process receives a model credential. PR scripts, setup and scoring run in separate steps
      # without secrets; CLI dependencies are locked in .github/tools/claude-cli and lifecycle scripts are disabled.
      - name: Run tool choice sessions
        if: steps.auth.outputs.ok == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cli="$GITHUB_WORKSPACE/.github/tools/claude-cli/node_modules/.bin/claude"
          out="$RUNNER_TEMP/tool-choice"
          mkdir -p "$out"
          while IFS= read -r task; do
            id=$(jq -r .id <<< "$task")
            prompt=$(jq -r .prompt <<< "$task")
            "$cli" -p "$prompt" --output-format stream-json --verbose --strict-mcp-config \
              --mcp-config "$RUNNER_TEMP/tc/mcp.json" --setting-sources project \
              --tools WebFetch,WebSearch --allowedTools mcp__unbrowse,WebFetch,WebSearch \
              --max-turns 12 --max-budget-usd 0.75 --no-session-persistence \
              > "$out/$id.jsonl" 2>/dev/null || true
          done < <(jq -c '.tasks[]' .github/qa/tool-choice.json)

      - name: Score tool choice
        id: choice
        if: steps.auth.outputs.ok == 'true'
        continue-on-error: true
        run: |
          python3 .github/qa/tool_choice.py --score-only --mcp-config "$RUNNER_TEMP/tc/mcp.json" --out "$RUNNER_TEMP/tool-choice"
          echo "pass=$(jq -r .pass "$RUNNER_TEMP/tool-choice/tool-choice.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/tool-choice/tool-choice.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop tool choice node
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/tc/node.pid")" 2>/dev/null || true

      - name: QA
        if: steps.auth.outputs.ok == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Read .github/qa/checklist.md and do what it says. VAULT_READY: ${{ env.VAULT_READY }}.
          # The node's tools, Read for the checklist and Write for the report. No shell, no web of its own, and nothing
          # read from the runner's temp folder, where the node's keys and the MCP config are.
          claude_args: >-
            --mcp-config ${{ runner.temp }}/mcp.json
            --allowedTools "mcp__unbrowse__unbrowse_do,mcp__unbrowse__unbrowse_browse,mcp__unbrowse__unbrowse_search,mcp__unbrowse__unbrowse_call,mcp__unbrowse__unbrowse_judge,mcp__unbrowse__unbrowse_report,Read,Write"
            --disallowedTools "Bash,WebFetch,WebSearch,Edit,NotebookEdit,Glob,Grep,Read(/${{ runner.temp }}/**)"
            --max-turns 80

      # Nothing shaped like a key leaves in the report: the node's owner token by value, and agent keys, GitHub tokens
      # and Anthropic keys by their shape.
      - name: Scrub the report
        if: always() && steps.auth.outputs.ok == 'true'
        run: |
          [ -f qa-report.md ] || echo "Claude QA wrote no report: see the QA step's log." > qa-report.md
          OWNER_TOKEN=$(cat "$UNBROWSE_HOME/owner.token" 2>/dev/null || true) perl -pi -e '
            s/\Q$ENV{OWNER_TOKEN}\E/[redacted]/g if length $ENV{OWNER_TOKEN};
            s/\bunb_[A-Za-z0-9_.-]+/[redacted]/g;
            s/\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})/[redacted]/g;
            s/\bsk-ant-[A-Za-z0-9_-]+/[redacted]/g;
          ' qa-report.md
      - name: Tool choice in the report
        if: always() && steps.auth.outputs.ok == 'true'
        run: |
          { echo; cat "$RUNNER_TEMP/tool-choice/tool-choice.md" 2>/dev/null || echo "**Tool choice: didn't finish.** See the step's log."; } >> qa-report.md
      - if: always() && steps.auth.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report
          path: qa-report.md
      - name: Verdict
        if: always() && steps.auth.outputs.ok == 'true'
        run: jq -e '.pass == true' qa-verdict.json > /dev/null || { echo "::error::Claude QA found a failing check"; exit 1; }
      - name: Tool choice verdict
        if: always() && steps.auth.outputs.ok == 'true'
        env:
          CHOSE: ${{ steps.choice.outputs.pass }}
        run: '[ "$CHOSE" = true ] || { echo "::error::An agent with other web tools on hand did not reach for the node: see the report"; exit 1; }'

      - if: always() && steps.auth.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-node-log
          path: ${{ runner.temp }}/node.log
          if-no-files-found: ignore

  # The run's summary, from a job that holds no permission, checks nothing out and runs nothing the agent wrote: it only
  # copies the scrubbed report there. A nightly or hand-started run has no pull request to post to, so none is asked for.
  report:
    name: QA report
    needs: qa
    if: always() && needs.qa.outputs.ran == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: qa-report
          path: ${{ runner.temp }}/qa
      - name: Report
        run: |
          report="$RUNNER_TEMP/qa/qa-report.md"
          mkdir -p "$RUNNER_TEMP/qa"
          [ -f "$report" ] || echo "Claude QA wrote no report: see the QA job's log." > "$report"
          { echo "## Claude QA"; echo; cat "$report"; } >> "$GITHUB_STEP_SUMMARY"
