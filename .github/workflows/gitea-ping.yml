# Minimal trigger probe — isolates whether this gitea fires a NEWLY-added
# workflow at all. Single self-hosted label (what the working kuri job uses),
# no checkout/container/working-directory. If this runs on a `ping-*` tag, the
# trigger path works and the deploy workflow had a parse/runs-on defect.
name: Gitea Ping
on:
  workflow_dispatch:
  push:
    tags: ["ping-*"]
jobs:
  ping:
    runs-on: self-hosted
    steps:
      - run: echo "gitea-ping OK on $(hostname) at $(date -u)"
