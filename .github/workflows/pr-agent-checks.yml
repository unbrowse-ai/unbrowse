# The agent QA and the task gate's slice on a pull request into staging, before it merges (UNB-248). Lewis, 20 Nov
# 2026: "we should do it this way yes". The same checks qa.yml and gate-bank.yml run on a push to staging, run here on
# the pull request's merge commit, once it is ready for review and again on each push while it stays ready:
#
#   Workflow security test  test_workflow_security.py on this pull request, before any job that holds the credential
#   Build the node once   a node, its CLI, its browser and the window, built from the pull request's merge commit with
#                         no secret and no write permission, packed into one archive whose SHA-256 every job below
#                         checks before it unpacks it. Built once; every job below runs that build.
#   MCP check             no model: qa.yml's MCP contract, journey, skills and window checks, on that build
#   Claude QA             qa.yml's Claude QA and tool choice, on that build, a screenshot per check, in the same
#                         four shards side by side (each a machine and a node of its own), merged in the report
#   Skill triggers        qa.yml's skill trigger evals (needs no build)
#                         not asked again when the same inputs already passed on staging (looked up, never saved)
#   Gate bank (slice)     gate-bank.yml's slice (test-banks/gate/slice.json), on that build
#   QA report             qa.yml's report: one picture per check and what the model runs cost, into the run's summary
#   PR agent checks       the one check to require for merging into staging: green only when every job above passed,
#                         on a ready pull request from a branch of this repository
#
# Who gets the Claude credential: only a ready pull request into staging from a branch of this repository. A fork's
# pull request and a draft never reach a job that holds it: every job's `if` opens with both conditions and the only
# trigger is pull_request (never pull_request_target, so a fork's run would get no secret from GitHub either, and this
# private repository sends none to forks). The model's jobs run in the GitHub environment `pr-agent-checks`, which no
# other workflow or job may name (.github/scripts/test/test_workflow_security.py). A draft or a fork turns the last
# check red with its reason, so neither merges without these checks: push the fork's commits to a branch here, or mark
# the draft ready.
#
# A branch of this repository is written by someone who may push to it, and could already run qa.yml on it by hand; a
# pull request's code (its node, the node's MCP program the CLI starts) runs beside the credential here as it does in
# that hand-started run. What it may not do: hold a write token (permissions are read-only), save a cache (nothing here
# saves one, so nothing a pull request built reaches staging's runs), or post on the pull request (the report goes in
# the run's summary). The model's credential sits only on the steps that run the locked CLI, as in qa.yml.
#
# The full bank (about four hours) and the live-site check stay on staging and nightly; they never block a pull request.
name: PR agent checks

on:
  pull_request:
    branches: [staging]
    types: [opened, reopened, synchronize, ready_for_review]

# A newer push to the same pull request cancels the older run.
concurrency:
  group: pr-agent-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Where this workflow's agent jobs run (UNB-166): one of Lewis's own runners while one is free, else a Blacksmith
  # machine that starts at once, so a Mac that is asleep or busy never holds a run up. The summary says why for each
  # job. A fork's pull request is never placed on a local runner. .github/scripts/place_jobs.py
  place:
    name: Where the agent jobs run
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      qa1: ${{ steps.place.outputs.qa1 }}
      qa2: ${{ steps.place.outputs.qa2 }}
      qa3: ${{ steps.place.outputs.qa3 }}
      qa4: ${{ steps.place.outputs.qa4 }}
      slice: ${{ steps.place.outputs.slice }}
      check: ${{ steps.place.outputs.check }}
      skills: ${{ steps.place.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/place_jobs.py
          sparse-checkout-cone-mode: false
      # No runner token here: in this workflow only the model's jobs hold a secret. A Mac that is asleep shows as a
      # job waiting for it with nothing running on it.
      - id: place
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_POOL: ${{ vars.MAC_RUNNER }}
          LINUX_POOL: ${{ vars.LINUX_POOL || '["self-hosted", "linux", "x64"]' }}
        # One Mac takes one job, the slice (as before sharding); the Claude QA shards and the MCP check go to Blacksmith
        # at once, side by side, rather than queueing behind each other on it.
        run: python3 -I .github/scripts/place_jobs.py slice=mac qa4=mac qa1=mac qa2=mac qa3=mac check=mac skills=linux

  # The credential's rules, checked on this pull request's own workflows before any job that holds it starts: a pull
  # request that breaks them never reaches the credential here (its change to the test is in the diff for review).
  security:
    name: Workflow security test
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I .github/scripts/test/test_workflow_security.py

  build:
    name: Build the node once
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
      # Restored, never saved: staging's runs save these, and a pull request's build reaches no other run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor
        with:
          path: unbrowse-node/vendor
          key: btls-sys-${{ runner.os }}-${{ hashFiles('unbrowse-node/scripts/apply-tls-patch.sh', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-ext.patch', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-pss.patch', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-grease-sigalg.patch') }}
      - if: steps.vendor.outputs.cache-hit != 'true'
        working-directory: unbrowse-node
        run: sh scripts/apply-tls-patch.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            unbrowse-node/target
            unbrowse-browser/cli/target
          key: qa-${{ runner.os }}-rust-1.99.1-${{ hashFiles('unbrowse-node/Cargo.lock', 'unbrowse-browser/cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            qa-${{ runner.os }}-rust-1.99.1-${{ hashFiles('unbrowse-node/Cargo.lock', 'unbrowse-browser/cli/Cargo.lock') }}-
            qa-${{ runner.os }}-rust-1.99.1-
      - name: Build the node and its browser
        run: |
          cargo build --locked --manifest-path unbrowse-browser/cli/Cargo.toml
          cargo build --locked --manifest-path unbrowse-node/Cargo.toml --bin unbrowse-node --bin unb
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Build the window
        working-directory: unbrowse-node/window
        run: zig build
      # One archive, at the paths the build left them: a debug node finds its browser program by the path it was built
      # at, which is the same work folder on every runner of this label. tar keeps the programs executable.
      - name: Pack the build
        id: pack
        run: |
          tar -cf "$RUNNER_TEMP/node-build.tar" \
            unbrowse-node/target/debug/unbrowse-node unbrowse-node/target/debug/unb \
            unbrowse-browser/cli/target/debug/agent-browser unbrowse-node/window/zig-out
          digest=$(shasum -a 256 "$RUNNER_TEMP/node-build.tar" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/node-build.tar"
          echo "sha256 $digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-node-build
          path: ${{ runner.temp }}/node-build.tar
          retention-days: 3
          if-no-files-found: error

  check:
    name: MCP check (no model)
    needs: [place, build]
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.place.outputs.check) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-node-build
          path: ${{ runner.temp }}/node-build
      - name: Unpack the build this run made
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "$DIGEST  $RUNNER_TEMP/node-build/node-build.tar" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/node-build/node-build.tar"
          # A debug node looks for its browser where it was built (browse.rs binary()); this build may come from another
          # runner (Blacksmith's /Users/runner), so name the one unpacked here, or stop: with none, Claude QA's browser
          # checks come back "blocked: browser_missing" and its verdict still passes (staging QA 44917313753).
          browser="$GITHUB_WORKSPACE/unbrowse-browser/cli/target/debug/agent-browser"
          test -x "$browser" || { echo "::error::the build has no browser program at $browser"; exit 1; }
          echo "UNBROWSE_BROWSER=$browser" >> "$GITHUB_ENV"
      # The checks' own tests first: a checker that can't fail proves nothing (fake server, fake browser, no node).
      - name: Test the checks
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.23.0
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s .github/qa -p 'test_*.py'
          python3 -I -m unittest discover -s test-banks/attack -p 'test_*.py'
      # A person's Mac keeps what an earlier job left running (a node on the port this job wants): stop it.
      - name: Stop what an earlier job left running
        run: sh .github/qa/stop-left-nodes.sh
      - name: Start the node
        run: sh .github/qa/start-node.sh unbrowse-node/target/debug/unbrowse-node "$GITHUB_WORKSPACE/unbrowse-node/target/debug/unb" "$RUNNER_TEMP/unbrowse"
      - name: MCP contract and journey
        id: mcp
        continue-on-error: true
        run: |
          UNBROWSE_AGENT_TOKEN="$(cat "$UNBROWSE_HOME/token")" "$RUNNER_TEMP/venv/bin/python" .github/qa/mcp_check.py \
            --unb "$UNB" --out "$RUNNER_TEMP/check" --chrome "$QA_CHROME"
      # Agents try to take a signed-in user's session, stored token and vault password, from inside her node and from
      # another node; a canary oracle reads every reply and what reached an attacker's host (test-banks/attack).
      - name: Attack bank
        id: attack
        continue-on-error: true
        run: |
          # The canary site is reached at a public https address (a node's browser never browses this machine).
          command -v cloudflared > /dev/null || brew install cloudflared
          python3 -I test-banks/attack/run_attack.py --node unbrowse-node/target/debug/unbrowse-node --unb "$UNB" \
            --browser "$UNBROWSE_BROWSER" --out "$RUNNER_TEMP/check/attack"
      - name: Skills against the node's tools
        id: skills
        continue-on-error: true
        run: python3 .github/qa/skill_check.py --tools "$RUNNER_TEMP/check/tools.json" --out "$RUNNER_TEMP/check"
      - name: The window, on this node
        id: window
        continue-on-error: true
        # The window draws itself (qa_tools.py --picture: nanoui's offscreen snapshot) on this node: no screen is read
        # and nothing comes in front of anyone, so a person's own Mac needs no screen permission. A home whose
        # .unbrowse is this node's points it here.
        env:
          QA_WINDOW: ${{ github.workspace }}/unbrowse-node/window/zig-out/bin/unbrowse-window
          QA_WORK: ${{ runner.temp }}/window
          QA_SHOTS: ${{ runner.temp }}/window
          QA_WINDOW_WAIT: "8"
        run: |
          shots="$RUNNER_TEMP/check/shots"
          mkdir -p "$shots"
          drew=fail; python3 -I .github/qa/qa_tools.py --picture "$shots/window.png" > "$RUNNER_TEMP/check/window.log" 2>&1 && drew=pass
          # A new node opens on setting up (window/src/screens/onboarding.zig): Welcome, whose Get started shows its
          # terms; Agree and continue, and the same window asks its owner to sign in (Skip for now).
          opened=fail; python3 -I .github/qa/qa_tools.py --picture "$shots/window-first-run.png" "click:Get started;live:2;click:Agree and continue;live:4" >> "$RUNNER_TEMP/check/window.log" 2>&1 && opened=pass
          # The sign-in shows only in the window that agreed (window/src/app.zig acceptTerms), so a window opened after
          # it goes on to the AI apps step: Skip there (Next when no agent app is installed here) shows ChatGPT and
          # Claude on the web, whose Not now ends on You're set, and Open Unbrowse opens the node. A node with an app
          # connected already skips all of it.
          clicked=fail
          for script in "click:Skip;live:2;click:Not now;live:2;click:Open Unbrowse;live:2;click:Vault;live:2" "click:Next;live:2;click:Not now;live:2;click:Open Unbrowse;live:2;click:Vault;live:2" "click:Vault;live:2"; do
            python3 -I .github/qa/qa_tools.py --picture "$shots/window-vault.png" "$script" >> "$RUNNER_TEMP/check/window.log" 2>&1 && { clicked=pass; break; }
          done
          size=$(wc -c < "$shots/window.png" 2>/dev/null || echo 0)
          {
            echo "#### The window"
            echo
            echo "| Step | Result | Note |"
            echo "| --- | --- | --- |"
            echo "| opens on this node and draws | $drew | window.png, $size bytes |"
            echo "| Get started shows its terms, then Agree and continue asks the owner to sign in | $opened | window-first-run.png |"
            echo "| opened again: the AI apps, ChatGPT and Claude and You're set if they show, then Vault shows the Vault screen | $clicked | window-vault.png |"
          } > "$RUNNER_TEMP/check/window.md"
          cat "$RUNNER_TEMP/check/window.md" "$RUNNER_TEMP/check/window.log"
          [ "$drew" = pass ] && [ "$opened" = pass ] && [ "$clicked" = pass ]
      - name: Collect the node's log
        if: always()
        run: cp "$UNBROWSE_HOME/node.log" "$RUNNER_TEMP/check/node.log" 2>/dev/null || true
      - id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-mcp-check
          path: ${{ runner.temp }}/check/
          if-no-files-found: warn
      - name: Summary
        if: always()
        env:
          SHOTS_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## MCP check (no model)"
            echo
            echo "Every step's picture is in the artifact [qa-mcp-check]($SHOTS_URL) (shots/, named by step)."
            echo
            cat "$RUNNER_TEMP/check/mcp-check.md" 2>/dev/null || echo "**MCP check: didn't finish.** See its step's log."
            echo
            cat "$RUNNER_TEMP/check/skill-check.md" 2>/dev/null || echo "**Skill check: didn't finish.** See its step's log."
            echo
            cat "$RUNNER_TEMP/check/window.md" 2>/dev/null || echo "**The window: didn't finish.** See its step's log."
            echo
            cat "$RUNNER_TEMP/check/attack/attack.md" 2>/dev/null || echo "**Attack bank: didn't finish.** See its step's log."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verdict
        if: always()
        env:
          MCP: ${{ steps.mcp.outcome }}
          SKILLS: ${{ steps.skills.outcome }}
          WINDOW: ${{ steps.window.outcome }}
          ATTACK: ${{ steps.attack.outcome }}
        run: |
          echo "MCP check: $MCP, skills: $SKILLS, window: $WINDOW, attack bank: $ATTACK"
          [ "$MCP" = success ] && [ "$SKILLS" = success ] && [ "$WINDOW" = success ] && [ "$ATTACK" = success ]
      - if: always()
        run: kill "$(cat "$UNBROWSE_HOME/node.pid")" 2>/dev/null || true

  # Claude QA as qa.yml runs it, on the build above. A required check that passes with no credential would prove
  # nothing, so a missing one fails here where qa.yml warns.
  # In qa.yml's shards (test_merge_shards.py holds the two to the same rows).
  qa:
    name: Claude QA (${{ matrix.shard }})
    needs: [place, security, build]
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    environment: pr-agent-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            checks: "1,2,3,8,9,12,13,17"
            choice: true
          - shard: 2
            checks: "4,5,6,7,10,11,18"
          - shard: 3
            checks: "14,15,16,19,20,21,22,23,24"
          - shard: 4
            checks: "25,26,27"
    runs-on: ${{ fromJSON(needs.place.outputs[format('qa{0}', matrix.shard)]) }}
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.auth.outputs.ok }}
    steps:
      - id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$API_KEY$OAUTH_TOKEN" ] || { echo "::error::No Claude credential reaches the pr-agent-checks environment"; exit 1; }
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The page sandbox and scratch-node.sh need Node 25 or later (26 is the LTS).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the pinned Claude CLI
        run: |
          npm ci --silent --ignore-scripts --prefix .github/tools/claude-cli
          # The CLI is a stub until its own install.cjs, from the same locked package, links in the native binary of
          # the platform's locked optional package; skipped, every ask says "claude native binary not installed" (UNB-235).
          node .github/tools/claude-cli/node_modules/@anthropic-ai/claude-code/install.cjs
          .github/tools/claude-cli/node_modules/.bin/claude --version
      - name: Pick the Claude credential that answers
        id: credential
        env:
          CLAUDE_BIN: ${{ github.workspace }}/.github/tools/claude-cli/node_modules/.bin/claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: sh .github/scripts/claude-credential.sh TOKEN_2 TOKEN
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-node-build
          path: ${{ runner.temp }}/node-build
      - name: Unpack the build this run made
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "$DIGEST  $RUNNER_TEMP/node-build/node-build.tar" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/node-build/node-build.tar"
          # A debug node looks for its browser where it was built (browse.rs binary()); this build may come from another
          # runner (Blacksmith's /Users/runner), so name the one unpacked here, or stop: with none, Claude QA's browser
          # checks come back "blocked: browser_missing" and its verdict still passes (staging QA 44917313753).
          browser="$GITHUB_WORKSPACE/unbrowse-browser/cli/target/debug/agent-browser"
          test -x "$browser" || { echo "::error::the build has no browser program at $browser"; exit 1; }
          echo "UNBROWSE_BROWSER=$browser" >> "$GITHUB_ENV"
      # The npm package as npm ships it (pack-sdks.sh's steps, with no release manifest), as qa.yml packs it.
      - name: Pack the npm package
        run: |
          ts=unbrowse-sdk/typescript
          rm -rf "$ts/skill" && cp -R skills/unbrowse "$ts/skill"
          mkdir -p "$RUNNER_TEMP/npm/global"
          ( cd "$ts" && npm ci --silent --ignore-scripts && npm run build --silent && npm pack --silent --pack-destination "$RUNNER_TEMP/npm" )
          tar -xzf "$RUNNER_TEMP"/npm/unbrowse-*.tgz -C "$RUNNER_TEMP/npm/global"
          test -f "$RUNNER_TEMP/npm/global/package/dist/cli.js"
      # A person's Mac keeps what an earlier job left running (a node on the port this job wants): stop it.
      - name: Stop what an earlier job left running
        run: sh .github/qa/stop-left-nodes.sh
      - name: Start the node
        env:
          AGENT_BROWSER_FILE_ROOT: ${{ github.workspace }}/qa-shots
        run: mkdir -p qa-shots && sh .github/qa/start-node.sh unbrowse-node/target/debug/unbrowse-node "$GITHUB_WORKSPACE/unbrowse-node/target/debug/unb" "$RUNNER_TEMP/unbrowse"
      # The owner's surfaces for the agent: the terminal and the window (qa_tools.py), copied to the temp folder first,
      # where the agent can't Write, so nothing the agent writes in the work tree is ever run (as in qa.yml).
      - name: The terminal and the window, for the agent
        run: |
          kit="$RUNNER_TEMP/qa-kit"
          mkdir -p "$kit/bin" qa-work
          cp unbrowse-node/target/debug/unbrowse-node unbrowse-node/target/debug/unb "$kit/bin/"
          cp unbrowse-node/window/zig-out/bin/unbrowse-window "$kit/bin/" 2>/dev/null || echo "::warning::the window didn't build: checks 25 to 27 are blocked"
          cp .github/qa/qa_tools.py "$kit/"
          cp -R .github/qa/fixtures "$kit/fixtures"
          jq --arg py "$(command -v python3)" --arg kit "$kit" --arg ws "$GITHUB_WORKSPACE" --arg home "$UNBROWSE_HOME" \
            --arg chrome "$QA_CHROME" --arg npm "$RUNNER_TEMP/npm/global/package/dist/cli.js" --arg display "${DISPLAY:-}" \
            '.mcpServers.qa = {command: $py, args: ["-I", ($kit + "/qa_tools.py")], env: ((.mcpServers.unbrowse.env) + {
              QA_PROGRAMS: ($kit + "/bin"), QA_WINDOW: ($kit + "/bin/unbrowse-window"), QA_NPM_CLI: $npm, QA_SHOTS: ($ws + "/qa-shots"),
              QA_WORK: ($ws + "/qa-work"), QA_FIXTURES: ($kit + "/fixtures"), QA_CHROME: $chrome, UNBROWSE_HOME: $home,
              PATH: env.PATH} + (if $display == "" then {} else {DISPLAY: $display} end)
              + (if env.UNBROWSE_BROWSER then {UNBROWSE_BROWSER: env.UNBROWSE_BROWSER} else {} end))}' \
            "$RUNNER_TEMP/unbrowse/mcp.json" > "$RUNNER_TEMP/unbrowse/qa-mcp.json"
          echo "QA_FIXTURES=$kit/fixtures" >> "$GITHUB_ENV"
      - name: Tool choice setup
        id: choice-setup
        if: matrix.choice
        continue-on-error: true
        run: |
          scratch="$RUNNER_TEMP/tc"
          PORT=17820 sh test-banks/popular-sites/scratch-node.sh "$scratch"
          echo "::add-mask::$(cat "$scratch/token")"
          printf 'SuperSecretPassword!\n' | env -i HOME="$scratch/home" UNBROWSE_HOME="$scratch/home/node" PATH=/usr/bin:/bin \
            unbrowse-node/target/debug/unbrowse-node vault add the-internet.herokuapp.com tomsmith --stored
          jq -n --arg unb "$UNB" --arg token "$(cat "$scratch/token")" \
            '{mcpServers: {unbrowse: {command: $unb, args: ["mcp"], env: {UNBROWSE_NODE: "http://127.0.0.1:17820", UNBROWSE_AGENT_TOKEN: $token}}}}' \
            > "$scratch/mcp.json"
          python3 .github/qa/tool_choice.py --plan-only --mcp-config "$scratch/mcp.json" --out "$RUNNER_TEMP/tool-choice"
      # Only the pinned CLI process receives a model credential; three sessions at a time, each capped in turns and dollars.
      - name: Run tool choice sessions
        if: matrix.choice
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cli="$GITHUB_WORKSPACE/.github/tools/claude-cli/node_modules/.bin/claude"
          out="$RUNNER_TEMP/tool-choice"
          while IFS= read -r line; do
            record=$(jq -r .record <<< "$line")
            prompt=$(jq -r .prompt <<< "$line")
            "$cli" -p "$prompt" --output-format stream-json --verbose --strict-mcp-config \
              --mcp-config "$RUNNER_TEMP/tc/mcp.json" --setting-sources project \
              --tools WebFetch,WebSearch --allowedTools mcp__unbrowse,WebFetch,WebSearch \
              --max-turns 12 --max-budget-usd 0.75 --no-session-persistence \
              > "$out/$record" 2>/dev/null < /dev/null &
            while [ "$(jobs -rp | wc -l)" -ge 3 ]; do sleep 1; done
          done < "$out/plan.jsonl"
          wait
      - name: Score tool choice
        id: choice
        if: matrix.choice
        continue-on-error: true
        run: |
          python3 .github/qa/tool_choice.py --score-only --mcp-config "$RUNNER_TEMP/tc/mcp.json" --out "$RUNNER_TEMP/tool-choice"
          echo "pass=$(jq -r .pass "$RUNNER_TEMP/tool-choice/tool-choice.json")" >> "$GITHUB_OUTPUT"
      - name: Stop tool choice node
        if: always() && matrix.choice
        run: kill "$(cat "$RUNNER_TEMP/tc/node.pid")" 2>/dev/null || true
      # The agent: the node's tools, Read for the checklist and Write for the report; no shell, no web of its own, no
      # GitHub token, nothing read or written in the runner's temp folder.
      - name: QA
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: 'Read .github/qa/checklist.md and do what it says. CHECKS: ${{ matrix.checks }}. VAULT_READY: ${{ env.VAULT_READY }}. SHOTS: ${{ github.workspace }}/qa-shots. WORK: ${{ github.workspace }}/qa-work. FIXTURES: ${{ env.QA_FIXTURES }}'
        run: |
          echo "execution_file=$RUNNER_TEMP/qa-execution.jsonl" >> "$GITHUB_OUTPUT"
          "$GITHUB_WORKSPACE/.github/tools/claude-cli/node_modules/.bin/claude" -p "$PROMPT" --output-format stream-json --verbose \
            --strict-mcp-config --mcp-config "$RUNNER_TEMP/unbrowse/qa-mcp.json" --setting-sources project \
            --tools Read,Write \
            --allowedTools "mcp__unbrowse__unbrowse_do,mcp__unbrowse__unbrowse_browse,mcp__unbrowse__unbrowse_search,mcp__unbrowse__unbrowse_call,mcp__unbrowse__unbrowse_judge,mcp__unbrowse__unbrowse_report,mcp__qa__terminal,mcp__qa__window,Read,Write" \
            --disallowedTools "Bash,WebFetch,WebSearch,Edit,NotebookEdit,Glob,Grep,Read(/$RUNNER_TEMP/**),Write(/$RUNNER_TEMP/**)" \
            --max-turns 170 --no-session-persistence \
            > "$RUNNER_TEMP/qa-execution.jsonl" < /dev/null
      # From here on this job runs only shell, jq and perl: the agent could write to the work tree.
      - name: Scrub the report
        if: always()
        env:
          EXECUTION: ${{ steps.claude.outputs.execution_file }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/qa-out/shots"
          # The checklist says the repository root; a run that wrote its report into WORK instead (PR #792's run
          # passed all 27 checks and put both files in qa-work/) is still read, never a link the agent planted.
          for f in qa-report.md qa-verdict.json; do
            if [ ! -e "$f" ] && [ -f "qa-work/$f" ] && [ ! -L "qa-work/$f" ]; then cp "qa-work/$f" "$f"; fi
          done
          wrote=yes
          [ -f qa-report.md ] || { wrote=no; echo "Claude QA wrote no report: its last words are in qa-cost.json's result." > qa-report.md; }
          cp qa-report.md "$RUNNER_TEMP/qa-out/qa-report.md"
          cp qa-verdict.json "$RUNNER_TEMP/qa-out/qa-verdict.json" 2>/dev/null || echo '{"pass": false, "checks": []}' > "$RUNNER_TEMP/qa-out/qa-verdict.json"
          if [ -n "$EXECUTION" ] && [ -f "$EXECUTION" ]; then
            jq -sc --arg wrote "$wrote" '[.[] | select(.type == "result")] | last | {type, subtype, is_error, total_cost_usd, num_turns, duration_ms, usage,
              result: (if .is_error or $wrote == "no" then ((.result // "") | tostring | .[0:600]) else null end)}' "$EXECUTION" > "$RUNNER_TEMP/qa-out/qa-cost.json" || true
          fi
          cp "$RUNNER_TEMP"/tool-choice/*.md "$RUNNER_TEMP"/tool-choice/*.json "$RUNNER_TEMP/qa-out/" 2>/dev/null || true
          # The terminal's and the window's own pictures, a PNG per step (qa_tools.py), and their log.
          mkdir -p "$RUNNER_TEMP/qa-out/shots/steps"
          for shot in qa-shots/steps/*.png; do
            [ -f "$shot" ] && [ ! -L "$shot" ] || continue
            [ "$(head -c 4 "$shot" | od -An -c | tr -d ' \n')" = '211PNG' ] || continue
            # Each shard numbers its steps from 001: its number goes first, so the merged folder keeps them all.
            cp "$shot" "$RUNNER_TEMP/qa-out/shots/steps/s${SHARD}-$(basename "$shot")"
          done
          [ -f qa-shots/steps/steps.jsonl ] && [ ! -L qa-shots/steps/steps.jsonl ] && cp qa-shots/steps/steps.jsonl "$RUNNER_TEMP/qa-out/steps.json" || true
          OWNER_TOKEN=$(cat "$UNBROWSE_HOME/owner.token" 2>/dev/null || true) perl -pi -e '
            s/\Q$ENV{OWNER_TOKEN}\E/[redacted]/g if length $ENV{OWNER_TOKEN};
            s/\bunb_[A-Za-z0-9_.-]+/[redacted]/g;
            s/\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})/[redacted]/g;
            s/\bsk-ant-[A-Za-z0-9_-]+/[redacted]/g;
          ' "$RUNNER_TEMP"/qa-out/*.md "$RUNNER_TEMP"/qa-out/*.json
      - name: Take the agent's screenshots
        if: always()
        run: |
          jq -r '.checks[]? | select(.shot != null) | "\(.n) \(.shot)"' "$RUNNER_TEMP/qa-out/qa-verdict.json" 2>/dev/null |
          while read -r n shot; do
            case "$n" in '' | *[!0-9]*) continue ;; esac
            case "$shot" in *..*) continue ;; esac
            case "$shot" in "$GITHUB_WORKSPACE"/qa-shots/* | "$UNBROWSE_HOME"/* | /tmp/* | /private/tmp/* | /var/folders/* | /private/var/folders/*) ;; *) continue ;; esac
            [ -f "$shot" ] && [ ! -L "$shot" ] || continue
            [ "$(head -c 4 "$shot" | od -An -c | tr -d ' \n')" = '211PNG' ] || continue
            cp "$shot" "$RUNNER_TEMP/qa-out/shots/check-$(printf '%02d' "$n").png"
          done
          ls "$RUNNER_TEMP/qa-out/shots"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/qa-out/
      - name: Verdict
        if: always()
        run: jq -e '.pass == true' "$RUNNER_TEMP/qa-out/qa-verdict.json" > /dev/null || { echo "::error::Claude QA found a failing check, or wrote no verdict"; exit 1; }
      - name: Tool choice verdict
        if: always() && matrix.choice
        env:
          CHOSE: ${{ steps.choice.outputs.pass }}
        run: '[ "$CHOSE" = true ] || { echo "::error::An agent with other web tools on hand did not reach for the node: see the report"; exit 1; }'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-node-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/unbrowse/node.log
          if-no-files-found: ignore

  skills:
    name: Skill triggers
    needs: [place, security]
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    environment: pr-agent-checks
    runs-on: ${{ fromJSON(needs.place.outputs.skills) }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: '[ -n "$API_KEY$OAUTH_TOKEN" ] || { echo "::error::No Claude credential reaches the pr-agent-checks environment"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in qa.yml: when a run on staging with the same skills, queries, scripts, CLI and workflows already passed,
      # its pass is kept as an empty cache entry under their hash, and the sessions are not run again here. Looked up,
      # never saved: nothing a pull request did is remembered, so a pull request that changes a skill asks the model
      # on each of its pushes until it has merged and staging has passed.
      - name: What the verdict depends on
        id: inputs
        run: |
          key=$(python3 .github/qa/skill_trigger.py --key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Whether these inputs already passed
        id: passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .skill-triggers-passed
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true
      - name: Already passed
        if: steps.passed.outputs.cache-hit == 'true'
        env:
          KEY: ${{ steps.inputs.outputs.key }}
        run: |
          { echo "## Skill triggers"; echo; echo "Not run again: a run on staging with the same skills, queries, scripts, CLI and workflows already passed (\`$KEY\`). The nightly run asks the model again."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.passed.outputs.cache-hit != 'true'
        with:
          node-version: 26
      - name: Install the pinned Claude CLI
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          npm ci --silent --ignore-scripts --prefix .github/tools/claude-cli
          # The CLI is a stub until its own install.cjs, from the same locked package, links in the native binary of
          # the platform's locked optional package; skipped, every ask says "claude native binary not installed" (UNB-235).
          node .github/tools/claude-cli/node_modules/@anthropic-ai/claude-code/install.cjs
          .github/tools/claude-cli/node_modules/.bin/claude --version
      - name: Pick the Claude credential that answers
        if: steps.passed.outputs.cache-hit != 'true'
        id: credential
        env:
          CLAUDE_BIN: ${{ github.workspace }}/.github/tools/claude-cli/node_modules/.bin/claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: sh .github/scripts/claude-credential.sh TOKEN_2 TOKEN
      - name: Prepare the sessions
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/skill-project/.claude/skills"
          cp -R skills/*/ "$RUNNER_TEMP/skill-project/.claude/skills/"
          python3 .github/qa/skill_trigger.py --plan "$RUNNER_TEMP/skill-runs/plan.jsonl"
      - name: Run skill trigger sessions
        if: steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cli="$GITHUB_WORKSPACE/.github/tools/claude-cli/node_modules/.bin/claude"
          out="$RUNNER_TEMP/skill-runs"
          cd "$RUNNER_TEMP/skill-project"
          while IFS= read -r line; do
            record=$(jq -r .record <<< "$line")
            prompt=$(jq -r .prompt <<< "$line")
            "$cli" -p "$prompt" --output-format stream-json --verbose --setting-sources project \
              --tools Skill,WebFetch,WebSearch --allowedTools Skill \
              --max-turns 3 --max-budget-usd 0.25 --no-session-persistence \
              > "$out/$record" 2>/dev/null < /dev/null &
            while [ "$(jobs -rp | wc -l)" -ge 4 ]; do sleep 1; done
          done < "$out/plan.jsonl"
          wait
      - name: Score
        if: steps.passed.outputs.cache-hit != 'true'
        id: score
        continue-on-error: true
        run: |
          python3 .github/qa/skill_trigger.py --score "$RUNNER_TEMP/skill-runs"
          echo "pass=$(jq -r .pass "$RUNNER_TEMP/skill-runs/skill-trigger.json")" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always() && steps.passed.outputs.cache-hit != 'true'
        run: |
          { echo "## Skill triggers"; echo; cat "$RUNNER_TEMP/skill-runs/skill-trigger.md" 2>/dev/null || echo "**Skill triggers: didn't finish.** See the steps' logs."; } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.passed.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-skill-triggers
          path: |
            ${{ runner.temp }}/skill-runs/skill-trigger.*
          if-no-files-found: ignore
      - name: Verdict
        if: always() && steps.passed.outputs.cache-hit != 'true'
        env:
          PASSED: ${{ steps.score.outputs.pass }}
        run: '[ "$PASSED" = true ] || { echo "::error::A shipped skill was not chosen when it should be, or was chosen for a near miss: see the summary"; exit 1; }'

  # gate-bank.yml's slice, on the build above. Red on a confident wrong answer, or on a slice task right on the
  # reference that is not right now ("changed" until a person re-reads that site by hand). Live sites change on their
  # own: a red slice is read site by site, with the same task on staging, before it is called this change's.
  slice:
    name: Gate bank (slice)
    needs: [place, security, build]
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    environment: pr-agent-checks
    runs-on: ${{ fromJSON(needs.place.outputs.slice) }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLAUDE_BIN: ${{ github.workspace }}/.github/tools/claude-cli/node_modules/.bin/claude
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "GATE=$RUNNER_TEMP/gate" >> "$GITHUB_ENV"
      # Node before the CLI's npm ci: a self-hosted Mac's runner service has no npm on its PATH (gate-bank.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the pinned Claude CLI
        run: |
          npm ci --silent --ignore-scripts --prefix .github/tools/claude-cli
          # The CLI is a stub until its own install.cjs, from the same locked package, links in the native binary of
          # the platform's locked optional package; skipped, every ask says "claude native binary not installed" (UNB-235).
          node .github/tools/claude-cli/node_modules/@anthropic-ai/claude-code/install.cjs
          .github/tools/claude-cli/node_modules/.bin/claude --version
      - name: Pick the Claude credential that answers
        id: credential
        env:
          CLAUDE_BIN: ${{ github.workspace }}/.github/tools/claude-cli/node_modules/.bin/claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: sh .github/scripts/claude-credential.sh TOKEN_2 TOKEN
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-node-build
          path: ${{ runner.temp }}/node-build
      - name: Unpack the build this run made
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "$DIGEST  $RUNNER_TEMP/node-build/node-build.tar" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/node-build/node-build.tar"
          # A debug node looks for its browser where it was built (browse.rs binary()); this build may come from another
          # runner (Blacksmith's /Users/runner), so name the one unpacked here, or stop: with none, Claude QA's browser
          # checks come back "blocked: browser_missing" and its verdict still passes (staging QA 44917313753).
          browser="$GITHUB_WORKSPACE/unbrowse-browser/cli/target/debug/agent-browser"
          test -x "$browser" || { echo "::error::the build has no browser program at $browser"; exit 1; }
          echo "UNBROWSE_BROWSER=$browser" >> "$GITHUB_ENV"
      # A person's Mac keeps what an earlier job left running (a node on the port this job wants): stop it.
      - name: Stop what an earlier job left running
        run: sh .github/qa/stop-left-nodes.sh
      - name: Start the scratch nodes and write the clients' runs
        run: |
          mkdir -p "$GATE"
          pick="--slice test-banks/gate/slice.json"; per=6
          left=$(python3 -I test-banks/gate/run_gate.py left --out "$GATE/none.jsonl" $pick)
          rounds=$(( (left + per - 1) / per ))
          mcps=""
          r=0
          while [ "$r" -lt "$rounds" ]; do
            dir="$RUNNER_TEMP/n$r"
            PORT=$((17810 + r)) sh test-banks/popular-sites/scratch-node.sh "$dir" > "$GATE/node-$r.log" 2>&1 || { cat "$GATE/node-$r.log"; exit 1; }
            token=$(cat "$dir/token")
            echo "::add-mask::$token"
            jq -n --arg unb "$GITHUB_WORKSPACE/unbrowse-node/target/debug/unb" --arg token "$token" --arg node "http://127.0.0.1:$((17810 + r))" \
              '{mcpServers: {unbrowse: {command: $unb, args: ["mcp"], env: {UNBROWSE_NODE: $node, UNBROWSE_AGENT_TOKEN: $token}}}}' > "$dir/mcp.json"
            rm -f "$dir/token"
            mcps="$mcps --mcp $dir/mcp.json"
            r=$((r + 1))
          done
          python3 -I test-banks/gate/run_gate.py prepare --dir "$GATE/runs" $mcps --per "$per" $pick \
            --claude "$CLAUDE_BIN" --build "$GITHUB_SHA debug"
          echo "$left task(s) in $rounds round(s)"
      - name: The clients
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          r=0
          while [ -d "$GATE/runs/round-$r" ]; do
            for f in "$GATE/runs/round-$r"/*.args; do
              while [ "$(jobs -rp | wc -l)" -ge 3 ]; do sleep 2; done
              perl -e '$t=shift; $b=shift; local $/; open F, shift or die; @a=split /\0/, <F>; alarm $t; exec $b, @a' \
                1200 "$CLAUDE_BIN" "$f" < /dev/null > "${f%.args}.out" 2> "${f%.args}.err" &
            done
            wait
            kill "$(cat "$RUNNER_TEMP/n$r/node.pid")" 2>/dev/null || true
            echo "round $r done"
            r=$((r + 1))
          done
      - name: Write the judges' runs
        run: |
          n=$(python3 -I test-banks/gate/run_gate.py judges --dir "$GATE/runs" --claude "$CLAUDE_BIN")
          echo "$n answer(s) to judge"
      - name: The judges
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for f in "$GATE/runs/judge"/*.args; do
            [ -e "$f" ] || continue
            while [ "$(jobs -rp | wc -l)" -ge 3 ]; do sleep 2; done
            perl -e '$t=shift; $b=shift; local $/; open F, shift or die; @a=split /\0/, <F>; alarm $t; exec $b, @a' \
              300 "$CLAUDE_BIN" "$f" < /dev/null > "${f%.args}.out" 2> "${f%.args}.err" &
          done
          wait
      - name: The gate's verdict
        id: verdict
        if: ${{ !cancelled() }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          pick="--slice test-banks/gate/slice.json"
          python3 -I test-banks/gate/run_gate.py collect --dir "$GATE/runs" --out "$GATE/results.jsonl"
          python3 -I test-banks/gate/run_gate.py score --out "$GATE/results.jsonl" $pick --md "$GATE/score.md" > /dev/null
          status=0
          python3 -I .github/scripts/promotion_gate.py check --tasks-only --bank-results "$GATE/results.jsonl" $pick --md "$GATE/verdict.md" || status=$?
          { echo "### Gate bank (slice), tree \`$tree\`"; cat "$GATE/verdict.md"; cat "$GATE/score.md"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 0 ] && echo "GATE_OK scope=slice tree=${tree::12}"
          exit "$status"
      # Kept under the tree of the merge commit this ran on. qa.yml reads the name (.github/qa/passed_on_pr.py): a push
      # to staging with this tree, after this whole run passed, does not run these checks a second time (UNB-166).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-bank-slice-${{ steps.verdict.outputs.tree || github.sha }}
          path: |
            ${{ env.GATE }}/results.jsonl
            ${{ env.GATE }}/score.md
            ${{ env.GATE }}/verdict.md
          if-no-files-found: ignore
          retention-days: 30

  # qa.yml's report job: holds no secret, only reads what the agent left and pictures each check.
  report:
    name: QA report
    needs: qa
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && (always() && needs.qa.outputs.ran == 'true')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/qa
            .github/workflows/pr-agent-checks.yml
      # One folder per Claude QA shard, merged into one verdict that fails on any check no shard answered.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: qa-report-*
          path: ${{ runner.temp }}/qa-shards
      - name: Merge the shards
        run: |
          python3 -I .github/qa/merge_shards.py --checklist .github/qa/checklist.md --plan .github/workflows/pr-agent-checks.yml \
            --shards "$RUNNER_TEMP/qa-shards" --out "$RUNNER_TEMP/qa"
      - name: Pictures and costs
        env:
          QA_CHROME_NO_SANDBOX: "1"
        run: |
          qa="$RUNNER_TEMP/qa"
          mkdir -p "$qa/shots"
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          python3 -I .github/qa/collect_shots.py --verdict "$qa/qa-verdict.json" --shots "$qa/shots" --chrome "$chrome" || true
          python3 -I .github/qa/costs.py --label "Claude QA (claude CLI)" "$qa"/qa-cost-*.json > "$qa/cost.md" || true
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-screenshots
          path: ${{ runner.temp }}/qa/shots/
          if-no-files-found: warn
      - name: Report
        env:
          SHOTS_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          qa="$RUNNER_TEMP/qa"
          [ -f "$qa/qa-report.md" ] || echo "Claude QA wrote no report: see the QA job's log." > "$qa/qa-report.md"
          {
            echo "## Claude QA"
            echo
            cat "$qa/qa-report.md"
            echo
            echo "Pictures: [qa-screenshots]($SHOTS_URL), one per check."
            echo
            cat "$qa/shots/shots.md" 2>/dev/null || true
            echo
            for cost in "$qa"/qa-cost-*.json; do
              jq -r --arg f "${cost##*/}" 'select(.is_error == true) | "**An agent run ended in an error (\($f)):** " + (.result // "no words")' "$cost" 2>/dev/null || true
            done
            echo
            cat "$qa/cost.md" 2>/dev/null || true
            echo
            cat "$qa/tool-choice.md" 2>/dev/null || echo "**Tool choice: didn't finish.** See the QA job's log."
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.pass == true' "$qa/shots/shots.json" > /dev/null || { echo "::error::A check has no picture: see the summary"; exit 1; }
          jq -e '.pass == true' "$qa/qa-verdict.json" > /dev/null || { jq -r '.problems[]? | "::error::" + .' "$qa/qa-verdict.json"; exit 1; }
          echo "QA_OK checks=$(jq '.checks | length' "$qa/qa-verdict.json") shards=$(jq '.shards | length' "$qa/qa-verdict.json")"

  # The check to require for merging into staging. A job skipped by its `if` counts as passed to a required check, so
  # the requirement is this job, which runs on every event and is green only when every job above ran and passed, on a
  # ready pull request from a branch of this repository. It holds no secret and no permission.
  verdict:
    name: PR agent checks
    needs: [place, security, build, check, qa, skills, slice, report]
    if: always()
    # It runs for a fork's pull request too (to be red), so it runs on a hosted machine, never one of Lewis's (UNB-166).
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every agent check ran and passed
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ "$DRAFT" != false ]; then echo "::error::A draft: the agent checks run when it is marked ready for review"; exit 1; fi
          if [ "$SAME_REPO" != true ]; then echo "::error::From a fork: the agent checks run only on a branch of this repository; push its commits to one"; exit 1; fi
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'length == 8 and (to_entries | all(.value.result == "success"))' > /dev/null || { echo "::error::An agent check did not pass: see the jobs above"; exit 1; }
