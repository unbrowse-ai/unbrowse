# The task gate's bank (UNB-208): the fixed tasks in test-banks/gate run through a scratch node's MCP, with a real
# model as the client and as the judge (test-banks/gate/run_gate.py; AGENTS.md, "The task gate and the 13 November
# rule").
#
#   push to staging/main  the slice (test-banks/gate/slice.json): six tasks right on staging on 17 Nov 2026. Red on a
#                         confident wrong answer, or on a slice task right on the reference that is not right now
#                         ("changed" until a person re-reads that site by hand). QA (qa.yml) calls it on those pushes,
#                         so its verdict sits in the same report as every journey (UNB-235)
#                         and it runs the node QA's run built once (`build_digest`), not a build of its own
#   nightly, on staging   the whole bank: the floor's early warning, red when the promotion gate would refuse it
#   push to release/**    the whole bank on the candidate: the run the promotion gate (release.yml, promotion-gate.yml)
#                         reads, kept as the artifact `gate-bank-full-<tree>`
#   by hand               either, on any branch; or `top1k`, the bench (UNB-307): the top 1,000 sites of
#                         test-banks/popular-sites/top-1000.json, cold and warm (2,000 tasks, made by run_gate.py's
#                         one rule), dealt into `shards` jobs side by side (`only` picks some), `sites` to take the
#                         first N in rank order, `resume_run` to keep what an earlier run of the same tree's shard
#                         finished, `node_ref` to run the bench on another build's node (the floor's run on the last
#                         promoted build).
#   top1k, the release    gate-1k.yml calls it on every push to a release branch: the release gate on the bench
#   gate (UNB-307)        (Lewis, 25 Nov 2026: rates, not every task). Every shard runs on one pinned kind of runner
#                         (vars.GATE_1K_RUNNER, else blacksmith-6vcpu-macos-latest), the kind the floor was taken on;
#                         each shard runs once more every task whose verdict measured nothing or is not the floor's
#                         (test-banks/gate/promoted-1k.json), on fresh nodes; the last job reads every shard together
#                         with promotion_gate.py and keeps `gate-1k-<tree>` (results, meta.json, rereads.json, verdict),
#                         the artifact the promotion gate reads. Red when it refuses: fewer right than the floor, a
#                         higher confidently wrong rate, or a task not measured (a shard that did not run counts so).
#
# No pull request starts it. A ready pull request into staging from a branch of this repository runs the same slice
# in pr-agent-checks.yml (UNB-248), the one pull request workflow allowed a model's credential, under its own rules in
# .github/scripts/test/test_workflow_security.py. promotion-gate.yml checks the gate itself on every pull request.
#
# The model's credential sits only on the two steps that run the model, and they run nothing of this repository's but
# the node's own MCP program, which the client starts: OpenCode reads argument files a step without
# the credential wrote (run_gate.py prepare and judges), and a step without it reads the results. The scratch nodes are
# started before, without it. The agent gets only the node's tools: no shell, no web or files of its own.
# Live sites change on their own: a red run is read, site by site, before anything is called a regression.
name: Gate bank

on:
  # staging and main: QA calls the slice (workflow_call below), so a push runs it once, in QA's report.
  push:
    branches: ["release/**"]
  workflow_call:
    inputs:
      scope:
        description: slice, full or top1k
        type: string
        default: slice
      # QA builds the node once for its jobs and this one (qa.yml's `build`): the SHA-256 of the archive it kept as
      # the artifact `qa-node-build`. Empty (a release branch's push, the nightly run, a run by hand): this job builds.
      shards:
        description: "top1k: how many jobs the sites are dealt into, side by side"
        type: string
        default: "1"
      build_digest:
        description: SHA-256 of the calling run's qa-node-build archive (empty = build here)
        type: string
        default: ""
      # Where the calling run's place job put this slice (qa.yml's `slice` output), so one place job hands out the Mac
      # once for the whole run. Without it this workflow's own place job asks, and it cannot see the calling run's own
      # jobs (place_jobs.py skips its run): QA dispatch 44948600956 put Claude QA's shard 4 and the slice both on the
      # one Mac, and the slice waited 6.6 min behind it (UNB-235). Empty: placed here.
      runs_on:
        description: runs-on JSON from the calling run's place job (empty = place here)
        type: string
        default: ""
    secrets:
      # Callers pass the broker key and optional short-lived access token explicitly.
      OPENCODE_CHATGPT_ACCESS_TOKEN:
        required: false
      OPENCODE_CHATGPT_CREDENTIAL_KEY:
        required: false
      DASHBOARD_INGEST_KEY:
        required: false
      RUNNER_READ_TOKEN:
        required: false
  schedule:
    - cron: '47 18 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: slice, full, or top1k (the top 1,000 sites, cold and warm; UNB-307)
        type: choice
        options: [slice, full, top1k]
        default: slice
      sites:
        description: "top1k: only the first N sites in rank order (empty: all 1,000)"
        type: string
        default: ""
      shards:
        description: "top1k: how many jobs the sites are dealt into, side by side"
        type: string
        default: "1"
      only:
        description: "top1k: which shards to run, from 0, comma-separated (empty: every one)"
        type: string
        default: ""
      resume_run:
        description: "top1k: an earlier run's id; each shard keeps what that run's same shard of the same tree finished"
        type: string
        default: ""
      node_ref:
        description: "top1k: build the node from this ref (a release tag) with this commit's bench: the floor's run"
        type: string
        default: ""

concurrency:
  group: gate-bank-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# Model calls use ChatGPT subscription OAuth through agent_cli.py.
env:
  AGENT_AUTH: chatgpt

jobs:
  # Where this workflow's agent jobs run (UNB-166): one of Lewis's own runners while one is free, else a Blacksmith
  # machine that starts at once, so a Mac that is asleep or busy never holds a run up. The summary says why for each
  # job. A fork's pull request is never placed on a local runner. .github/scripts/place_jobs.py
  place:
    name: Where the agent jobs run
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      bank: ${{ steps.place.outputs.bank }}
      runner: ${{ steps.place.outputs.runner }}
      scope: ${{ steps.shards.outputs.scope }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/place_jobs.py
          sparse-checkout-cone-mode: false
      - id: place
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          MAC_POOL: ${{ vars.MAC_RUNNER }}
          LINUX_POOL: ${{ vars.LINUX_POOL || '["self-hosted", "linux", "x64"]' }}
          PLACED: ${{ inputs.runs_on }}
          # top1k: one pinned kind of runner, never placed, so the run is held to a floor taken on the same kind: a
          # data centre's address is walled where a home one is not (bank.yml's 16 of 30 hard sites, Blacksmith Macs).
          PINNED: ${{ inputs.scope == 'top1k' && (vars.GATE_1K_RUNNER || 'blacksmith-6vcpu-macos-latest') || '' }}
        run: |
          if [ -n "$PINNED" ]; then
            python3 -I -c 'import json, sys; print("bank=" + json.dumps(sys.argv[1])); print("runner=" + sys.argv[1])' "$PINNED" | tee -a "$GITHUB_OUTPUT"
          elif [ -n "$PLACED" ]; then
            # A runs-on label or label list, nothing else.
            python3 -I -c 'import json, sys; v = json.loads(sys.argv[1]); assert isinstance(v, str) or (isinstance(v, list) and v and all(isinstance(x, str) for x in v))' "$PLACED"
            echo "bank=$PLACED" >> "$GITHUB_OUTPUT"
            echo "bank=$PLACED (placed by the calling run)"
          else
            python3 -I .github/scripts/place_jobs.py bank=mac
          fi
      # The scope, and the jobs the bank runs as: one for the slice or the whole bank, one per shard for top1k.
      - id: shards
        env:
          SCOPE: ${{ inputs.scope == 'top1k' && 'top1k' || ((inputs.scope == 'slice' || github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) && 'slice' || 'full') }}
          SHARDS: ${{ inputs.shards }}
          ONLY: ${{ inputs.only }}
          SITES: ${{ inputs.sites }}
        run: |
          said=$(python3 -I -c '
          import json, os
          scope = os.environ["SCOPE"]
          n = int(os.environ.get("SHARDS") or 1) if scope == "top1k" else 1
          assert 1 <= n <= 64, f"shards {n}: want 1 to 64"
          assert (os.environ.get("SITES") or "0").isdigit(), "sites: a number"
          only = sorted({int(x) for x in (os.environ.get("ONLY") or "").split(",") if x.strip()}) or list(range(n))
          assert all(0 <= i < n for i in only), f"only {only}: shards are 0 to {n - 1}"
          label = (lambda i: f"top1k, shard {i + 1} of {n}") if scope == "top1k" else (lambda i: scope)
          print("scope=" + scope)
          print("shards=" + json.dumps([{"i": i, "n": n, "label": label(i)} for i in only]))
          ')
          echo "$said" | tee -a "$GITHUB_OUTPUT"

  bank:
    needs: place
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/staging'
    name: Gate bank (${{ matrix.shard.label }})
    runs-on: ${{ fromJSON(needs.place.outputs.bank) }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.place.outputs.shards) }}
    permissions:
      # actions: read for `resume_run` (an earlier run's artifact); a caller (qa.yml) already gives it.
      actions: read
      contents: read
    env:
      SCOPE: ${{ needs.place.outputs.scope }}
      # top1k: this job's shard of the sites (i/n, i from 0), and the first N sites when the run takes only some.
      SHARD: ${{ matrix.shard.i }}/${{ matrix.shard.n }}
      SITES: ${{ inputs.sites }}
      # The bank passes Claude-style arguments through the wrapper to OpenCode.
      CLAUDE_BIN: ${{ github.workspace }}/.github/scripts/agent_cli.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "GATE=$RUNNER_TEMP/gate" >> "$GITHUB_ENV"
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # node_ref: the node and its browser from another build (the last promoted tag), the bench from this commit.
      - if: ${{ env.SCOPE == 'top1k' && inputs.node_ref != '' && inputs.node_ref != null }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.node_ref }}
          path: node-ref
          sparse-checkout: |
            unbrowse-node
            unbrowse-browser
      - if: ${{ env.SCOPE == 'top1k' && inputs.node_ref != '' && inputs.node_ref != null }}
        name: Build the node of node_ref
        run: |
          rm -rf unbrowse-node unbrowse-browser
          mv node-ref/unbrowse-node node-ref/unbrowse-browser .
          rm -rf node-ref
          if [ "$NODE_REF" = v13.18.1 ]; then
            echo "SETTINGS_V=2" >> "$GITHUB_ENV"
            echo "HISTORICAL_BEARER_MCP=1" >> "$GITHUB_ENV"
          fi
          echo "the node's code and its browser are $NODE_REF's; the bench is $(git rev-parse --short HEAD)'s"
        env:
          NODE_REF: ${{ inputs.node_ref }}
      # A shard started again keeps what an earlier run of the same tree's same shard finished (run_gate.py resumes:
      # a task in results.jsonl is not prepared again, unless it hit infrastructure).
      - if: ${{ env.SCOPE == 'top1k' && inputs.resume_run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          pattern: gate-bank-top1k-${{ steps.tree.outputs.tree }}-${{ matrix.shard.i }}of${{ matrix.shard.n }}${{ inputs.node_ref && format('-node-{0}', inputs.node_ref) || '' }}
          path: ${{ runner.temp }}/resume
      - if: ${{ env.SCOPE == 'top1k' && inputs.resume_run != '' }}
        name: Keep the earlier run's results
        run: |
          mkdir -p "$GATE"
          found=$(find "$RUNNER_TEMP/resume" -name results.jsonl 2>/dev/null | head -1)
          [ -n "$found" ] || { echo "::error::run $RESUME has no artifact for shard $SHARD of tree ${{ steps.tree.outputs.tree }}"; exit 1; }
          cp "$found" "$GATE/results.jsonl"
          echo "kept $(wc -l < "$GATE/results.jsonl") result line(s) from run $RESUME"
        env:
          RESUME: ${{ inputs.resume_run }}
      # Node before the CLI's npm ci: a self-hosted Mac's runner service has no npm on its PATH ("npm: command not
      # found", run 44870008228 on lewis-macbook-pro); a hosted image ships one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The model CLI (opencode)
        run: |
          npm i --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/agent-cli" @opencode/cli@2.4.1
          echo "$RUNNER_TEMP/agent-cli/node_modules/.bin" >> "$GITHUB_PATH"
      # Called by QA with the build its run made: checked against the SHA-256 QA's build job gave, then unpacked, and
      # nothing is built here. A push has no inputs and a run by hand has no build_digest: both are null, which is
      # false, so `!inputs.build_digest` is true exactly when this job must build.
      - if: ${{ inputs.build_digest }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qa-node-build
          path: ${{ runner.temp }}/node-build
      - name: Unpack the build the calling run made
        if: ${{ inputs.build_digest }}
        env:
          DIGEST: ${{ inputs.build_digest }}
        run: |
          echo "$DIGEST  $RUNNER_TEMP/node-build/node-build.tar" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/node-build/node-build.tar"
          # A debug node looks for its browser where it was built (browse.rs binary()); this build may come from another
          # runner (Blacksmith's /Users/runner), so name the one unpacked here, or stop: with none, Claude QA's browser
          # checks come back "blocked: browser_missing" and its verdict still passes (staging QA 44917313753).
          browser="$GITHUB_WORKSPACE/unbrowse-browser/cli/target/debug/agent-browser"
          test -x "$browser" || { echo "::error::the build has no browser program at $browser"; exit 1; }
          echo "UNBROWSE_BROWSER=$browser" >> "$GITHUB_ENV"
      # On its own (a release branch, nightly, by hand) it builds the node itself.
      - if: ${{ !inputs.build_digest }}
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
      - if: ${{ !inputs.build_digest }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor
        with:
          path: unbrowse-node/vendor
          key: btls-sys-${{ runner.os }}-${{ hashFiles('unbrowse-node/scripts/apply-tls-patch.sh', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-ext.patch', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-pss.patch', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-grease-sigalg.patch') }}
      - if: ${{ !inputs.build_digest && steps.vendor.outputs.cache-hit != 'true' }}
        working-directory: unbrowse-node
        run: sh scripts/apply-tls-patch.sh
      # Restored, and saved straight after the build, before any node or model runs: a cache this job saves holds only
      # what the build made. Its own key: no other workflow restores it.
      - if: ${{ !inputs.build_digest }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            unbrowse-node/target
            unbrowse-browser/cli/target
          key: gate-${{ runner.os }}-rust-1.99.1-${{ hashFiles('unbrowse-node/Cargo.lock', 'unbrowse-browser/cli/Cargo.lock') }}
          restore-keys: gate-${{ runner.os }}-rust-1.99.1-
      - name: Build the node and its browser
        if: ${{ !inputs.build_digest }}
        run: |
          cargo build --locked --manifest-path unbrowse-browser/cli/Cargo.toml
          cargo build --locked --manifest-path unbrowse-node/Cargo.toml --bin unbrowse-node --bin unb
          # The historical build takes a bearer MCP adapter. Other tagged nodes use this bench's signed MCP client.
          if [ -n "${NODE_REF:-}" ] && [ "${HISTORICAL_BEARER_MCP:-0}" != 1 ]; then
            git worktree add --detach "$RUNNER_TEMP/bench" HEAD
            cargo build --locked --manifest-path "$RUNNER_TEMP/bench/unbrowse-node/Cargo.toml" --bin unb
            cp "$RUNNER_TEMP/bench/unbrowse-node/target/debug/unb" "$RUNNER_TEMP/unb-bench"
            echo "UNB_MCP=$RUNNER_TEMP/unb-bench" >> "$GITHUB_ENV"
            echo "the client's MCP server is this commit's unb; the node and its browser are $NODE_REF's"
          fi
        env:
          NODE_REF: ${{ inputs.node_ref }}
      - name: Save the build's folders before anything else runs
        if: ${{ !inputs.build_digest && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            unbrowse-node/target
            unbrowse-browser/cli/target
          key: gate-${{ runner.os }}-rust-1.99.1-${{ hashFiles('unbrowse-node/Cargo.lock', 'unbrowse-browser/cli/Cargo.lock') }}

      # A person's Mac keeps what an earlier job left running (a node on the port this job wants): stop it.
      - name: Stop what an earlier job left running
        run: sh .github/qa/stop-left-nodes.sh
      # 17810 is where the search starts. A node already answering there is left alone. 7788 is never used.
      - name: Start the scratch nodes and write the clients' runs
        run: sh test-banks/gate/start-rounds.sh "$GATE/runs" n 17810

      # The credential is here and in the judges' step alone. Each run is the locked CLI on its argument file, three at
      # a time, under an alarm (20 minutes a task, as the unbrowse6 harness gives); a round's node stops when it ends.
      - name: The clients
        env:
          RUNS: ${{ env.GATE }}/runs
          NODES: n
          OPENCODE_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENCODE_CHATGPT_ACCESS_TOKEN }}
          OPENCODE_CHATGPT_CREDENTIAL_URL: ${{ vars.OPENCODE_CHATGPT_CREDENTIAL_URL }}
          OPENCODE_CHATGPT_CREDENTIAL_KEY: ${{ secrets.OPENCODE_CHATGPT_CREDENTIAL_KEY }}
        run: |
          runs="$RUNS"
          nodes="$NODES"
          scope="$SCOPE"

          one() {
            # Keep the round going when a client times out or its provider refuses it.
            perl -e '$t=shift; $b=shift; local $/; open F, shift or die; @a=split /\0/, <F>; alarm $t; exec $b, @a' \
              1200 "$CLAUDE_BIN" "$1" < /dev/null > "${1%.args}.out" 2> "${1%.args}.err" \
              || echo "::warning::the client on $1 exited $?: its result reads what it left"
          }

          chrome_count() {
            local count
            [ -f "$1" ] || return 0
            count=$(awk '/^chrome_(headless|headed)_launch([[:space:]]|$)/ { n++ } END { print n+0 }' "$1") || return 0
            echo "$count"
          }

          record_launches() {
            local after count=missing
            after=$(chrome_count "$guard")
            if [[ "$1" =~ ^[0-9]+$ && "$after" =~ ^[0-9]+$ ]]; then count=$((after - $1)); fi
            echo "$count" > "$2"
          }

          round=0
          while [ -d "$runs/round-$round" ]; do
            (
              folder="$runs/round-$round"
              guard="$RUNNER_TEMP/$nodes$round/guard.log"
              for f in "$folder"/*.args; do
                if [ "$scope" = slice ]; then before=$(chrome_count "$guard"); fi
                one "$f"
                if [ "$scope" = slice ]; then record_launches "$before" "${f%.args}.chrome-launches.txt"; fi
              done
              if [ -d "$folder/warm" ]; then
                if [ "$scope" = slice ]; then before=$(chrome_count "$guard"); fi
                for f in "$folder"/warm/*.args; do one "$f" & done
                wait
                if [ "$scope" = slice ]; then record_launches "$before" "$folder/warm/chrome-launches.txt"; fi
              fi
              kill "$(cat "$RUNNER_TEMP/$nodes$round/node.pid")" 2>/dev/null || true
              echo "round $round done"
            ) &
            round=$((round + 1))
          done
          wait

      - name: Write the judges' runs
        run: |
          n=$(python3 -I test-banks/gate/run_gate.py judges --dir "$GATE/runs" --claude "$CLAUDE_BIN")
          echo "$n answer(s) to judge"

      - name: The judges
        env:
          RUNS: ${{ env.GATE }}/runs
          OPENCODE_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENCODE_CHATGPT_ACCESS_TOKEN }}
          OPENCODE_CHATGPT_CREDENTIAL_URL: ${{ vars.OPENCODE_CHATGPT_CREDENTIAL_URL }}
          OPENCODE_CHATGPT_CREDENTIAL_KEY: ${{ secrets.OPENCODE_CHATGPT_CREDENTIAL_KEY }}
        run: |
          for f in "$RUNS/judge"/*.args; do
            [ -e "$f" ] || continue
            while [ "$(jobs -rp | wc -l)" -ge 3 ]; do sleep 2; done
            perl -e '$t=shift; $b=shift; local $/; open F, shift or die; @a=split /\0/, <F>; alarm $t; exec $b, @a' \
              300 "$CLAUDE_BIN" "$f" < /dev/null > "${f%.args}.out" 2> "${f%.args}.err" &
          done
          wait

      - name: Collect the clients' and the judges' verdicts
        if: ${{ !cancelled() }}
        run: |
          flags=()
          if [ "$SCOPE" = slice ]; then flags+=(--require-cold-browser); fi
          python3 -I test-banks/gate/run_gate.py collect "${flags[@]}" --dir "$GATE/runs" --out "$GATE/results.jsonl"

      # top1k: a verdict that measured nothing (infra, error) or is not the floor's is run once more before it counts
      # (Lewis, 25 Nov 2026), with its twin, on nodes that never saw the first run; the second verdict is the one
      # counted, and promotion_gate.py refuses a changed verdict that was never run again.
      - name: What to run again
        id: again
        if: ${{ !cancelled() && env.SCOPE == 'top1k' }}
        run: |
          python3 -I test-banks/gate/run_gate.py again --out "$GATE/results.jsonl" --floor test-banks/gate/promoted-1k.json \
            --bank test-banks/popular-sites/top-1000.json --shard "$SHARD" ${SITES:+--first "$SITES"} \
            --write "$GATE/again.ids" | sed 's/^/n=/' | tee -a "$GITHUB_OUTPUT"
      # 18810 is where the search starts. A node already answering there is left alone. 7788 is never used.
      - name: Start the scratch nodes again and write the clients' runs
        if: ${{ !cancelled() && steps.again.outputs.n > 0 }}
        run: sh test-banks/gate/start-rounds.sh "$GATE/again" a 18810 --again "$GATE/again.ids"

      - name: The clients, again
        if: ${{ !cancelled() && steps.again.outputs.n > 0 }}
        env:
          RUNS: ${{ env.GATE }}/again
          NODES: a
          OPENCODE_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENCODE_CHATGPT_ACCESS_TOKEN }}
          OPENCODE_CHATGPT_CREDENTIAL_URL: ${{ vars.OPENCODE_CHATGPT_CREDENTIAL_URL }}
          OPENCODE_CHATGPT_CREDENTIAL_KEY: ${{ secrets.OPENCODE_CHATGPT_CREDENTIAL_KEY }}
        run: |
          runs="$RUNS"
          nodes="$NODES"
          scope="$SCOPE"

          one() {
            # Keep the round going when a client times out or its provider refuses it.
            perl -e '$t=shift; $b=shift; local $/; open F, shift or die; @a=split /\0/, <F>; alarm $t; exec $b, @a' \
              1200 "$CLAUDE_BIN" "$1" < /dev/null > "${1%.args}.out" 2> "${1%.args}.err" \
              || echo "::warning::the client on $1 exited $?: its result reads what it left"
          }

          chrome_count() {
            local count
            [ -f "$1" ] || return 0
            count=$(awk '/^chrome_(headless|headed)_launch([[:space:]]|$)/ { n++ } END { print n+0 }' "$1") || return 0
            echo "$count"
          }

          record_launches() {
            local after count=missing
            after=$(chrome_count "$guard")
            if [[ "$1" =~ ^[0-9]+$ && "$after" =~ ^[0-9]+$ ]]; then count=$((after - $1)); fi
            echo "$count" > "$2"
          }

          round=0
          while [ -d "$runs/round-$round" ]; do
            (
              folder="$runs/round-$round"
              guard="$RUNNER_TEMP/$nodes$round/guard.log"
              for f in "$folder"/*.args; do
                if [ "$scope" = slice ]; then before=$(chrome_count "$guard"); fi
                one "$f"
                if [ "$scope" = slice ]; then record_launches "$before" "${f%.args}.chrome-launches.txt"; fi
              done
              if [ -d "$folder/warm" ]; then
                if [ "$scope" = slice ]; then before=$(chrome_count "$guard"); fi
                for f in "$folder"/warm/*.args; do one "$f" & done
                wait
                if [ "$scope" = slice ]; then record_launches "$before" "$folder/warm/chrome-launches.txt"; fi
              fi
              kill "$(cat "$RUNNER_TEMP/$nodes$round/node.pid")" 2>/dev/null || true
              echo "round $round done"
            ) &
            round=$((round + 1))
          done
          wait

      - name: Write the judges' runs, again
        if: ${{ !cancelled() && steps.again.outputs.n > 0 }}
        run: |
          n=$(python3 -I test-banks/gate/run_gate.py judges --dir "$GATE/again" --claude "$CLAUDE_BIN")
          echo "$n answer(s) to judge"

      - name: The judges, again
        if: ${{ !cancelled() && steps.again.outputs.n > 0 }}
        env:
          RUNS: ${{ env.GATE }}/again
          OPENCODE_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENCODE_CHATGPT_ACCESS_TOKEN }}
          OPENCODE_CHATGPT_CREDENTIAL_URL: ${{ vars.OPENCODE_CHATGPT_CREDENTIAL_URL }}
          OPENCODE_CHATGPT_CREDENTIAL_KEY: ${{ secrets.OPENCODE_CHATGPT_CREDENTIAL_KEY }}
        run: |
          for f in "$RUNS/judge"/*.args; do
            [ -e "$f" ] || continue
            while [ "$(jobs -rp | wc -l)" -ge 3 ]; do sleep 2; done
            perl -e '$t=shift; $b=shift; local $/; open F, shift or die; @a=split /\0/, <F>; alarm $t; exec $b, @a' \
              300 "$CLAUDE_BIN" "$f" < /dev/null > "${f%.args}.out" 2> "${f%.args}.err" &
          done
          wait

      - name: Collect the verdicts of the run again
        if: ${{ !cancelled() && steps.again.outputs.n > 0 }}
        run: python3 -I test-banks/gate/run_gate.py collect --dir "$GATE/again" --out "$GATE/results.jsonl"

      - name: The gate's verdict
        id: verdict
        if: ${{ !cancelled() }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          [ "$SCOPE" = slice ] && pick="--slice test-banks/gate/slice.json" || pick=""
          if [ "$SCOPE" = top1k ]; then
            # A shard reports; the gate is the `top1k` job's, on every shard together. Red only when it ran nothing.
            pick="--bank test-banks/popular-sites/top-1000.json --shard $SHARD${SITES:+ --first $SITES}"
            python3 -I test-banks/gate/run_gate.py score --out "$GATE/results.jsonl" $pick --md "$GATE/score.md" > /dev/null
            echo "top1k shard $SHARD${SITES:+ of the first $SITES sites}" > "$GATE/verdict.md"
            { echo "### Gate bank (top1k, shard $SHARD), tree \`$tree\`"; cat "$GATE/score.md"; } >> "$GITHUB_STEP_SUMMARY"
            [ -s "$GATE/results.jsonl" ] || { echo "::error title=Gate bank (top1k) ran nothing::shard $SHARD has no result"; exit 1; }
            echo "TOP1K_SHARD_OK shard=$SHARD tree=${tree::12}"
            exit 0
          fi
          python3 -I test-banks/gate/run_gate.py score --out "$GATE/results.jsonl" $pick --md "$GATE/score.md" > /dev/null
          status=0
          python3 -I .github/scripts/promotion_gate.py check --tasks-only --bank-results "$GATE/results.jsonl" $pick --md "$GATE/verdict.md" || status=$?
          if [ "$SCOPE" = slice ]; then
            python3 -I test-banks/gate/run_gate.py browser-verdict --dir "$GATE/runs" --results "$GATE/results.jsonl" >> "$GATE/verdict.md" || status=$?
          fi
          { echo "### Gate bank ($SCOPE), tree \`$tree\`"; cat "$GATE/verdict.md"; cat "$GATE/score.md"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 0 ] && echo "GATE_OK scope=$SCOPE tree=${tree::12}"
          # Either scope's run is red when its verdict refuses. The whole bank's run once stayed green on a refusal
          # (nightly 45323992199, 24 Nov 2026: 80 of 91 tasks not run, PROMOTION_REFUSED), so a refused promotion read as
          # a passing night (Steve QA 2026-11-24, UNB-300). The artifact below is still kept for the promotion gate.
          [ "$status" = 0 ] || echo "::error title=Gate bank ($SCOPE) refused::$(grep -m1 -o 'PROMOTION_REFUSED.*' "$GATE/verdict.md" || echo "the gate exited $status")"
          exit "$status"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-bank-${{ env.SCOPE }}-${{ steps.verdict.outputs.tree || github.sha }}${{ env.SCOPE == 'top1k' && format('-{0}of{1}', matrix.shard.i, matrix.shard.n) || '' }}${{ inputs.node_ref && format('-node-{0}', inputs.node_ref) || '' }}
          path: |
            ${{ env.GATE }}/results.jsonl
            ${{ env.GATE }}/score.md
            ${{ env.GATE }}/verdict.md
          if-no-files-found: ignore
          retention-days: 90

  # top1k: every shard's results as one, scored, and judged by the release gate (promotion_gate.py check --top1k-only:
  # the rates rule against test-banks/gate/promoted-1k.json; a shard that did not run leaves its tasks not measured,
  # which refuses). Kept as `gate-1k-<tree>`, the artifact promotion-gate.sh reads; a run of another build's node
  # (node_ref) is kept under a name of its own, so it never stands for this tree.
  top1k:
    needs: [place, bank]
    if: ${{ !cancelled() && needs.place.outputs.scope == 'top1k' }}
    name: Gate bank (top1k, every shard)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SITES: ${{ inputs.sites }}
      NODE_REF: ${{ inputs.node_ref }}
      RUNNER_KIND: ${{ needs.place.outputs.runner }}
      SHARDS: ${{ needs.place.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # This tree's shards only. One artifact is unpacked straight into the path, several each into a folder of its
      # name (pilot 45550694686 scored nothing when this read the folders' names), so the results are found by name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-bank-top1k-${{ steps.tree.outputs.tree }}-*of*
          path: ${{ runner.temp }}/shards
      - name: Every shard's score
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          out="$RUNNER_TEMP/top1k"
          mkdir -p "$out"
          find "$RUNNER_TEMP/shards" -name results.jsonl | sort | xargs -r cat > "$out/results.jsonl"
          [ -s "$out/results.jsonl" ] || { echo "::error title=Gate bank (top1k) every shard::no shard of tree $tree left results"; exit 1; }
          python3 -I test-banks/gate/run_gate.py score --out "$out/results.jsonl" --bank test-banks/popular-sites/top-1000.json \
            ${SITES:+--first $SITES} --md "$out/score.md" > /dev/null
          { echo "### Gate bank (top1k, every shard), tree \`$tree\`"; cat "$out/score.md"; } >> "$GITHUB_STEP_SUMMARY"
          head -6 "$out/score.md"
          echo "tree=$tree" >> "$GITHUB_ENV"
      # Where it ran, on what, and which shards: the gate holds the run to a floor taken on the same kind of runner.
      - name: The gate's verdict on every shard
        run: |
          out="$RUNNER_TEMP/top1k"
          python3 -I -c '
          import json, os, sys
          shards = json.loads(os.environ.get("SHARDS") or "[]")
          json.dump({"runner": os.environ.get("RUNNER_KIND") or None, "tree": os.environ["tree"], "commit": os.environ["GITHUB_SHA"],
                     "node_ref": os.environ.get("NODE_REF") or None, "run": os.environ.get("GITHUB_RUN_ID"),
                     "shards": shards[0]["n"] if shards else None, "ran": [s["i"] for s in shards],
                     "sites": int(os.environ["SITES"]) if os.environ.get("SITES") else None}, open(sys.argv[1], "w"), indent=1)
          ' "$out/meta.json"
          status=0
          python3 -I .github/scripts/promotion_gate.py check --top1k-only --top1k-results "$out/results.jsonl" \
            --top1k-meta "$out/meta.json" --top1k-rereads "$out/rereads.json" --md "$out/verdict.md" || status=$?
          { echo "### The release gate on the bench, tree \`$tree\`"; cat "$out/verdict.md"; } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$NODE_REF" ] && name="gate-1k-$tree" || name="gate-1k-$tree-node-$NODE_REF"
          echo "name=$name" >> "$GITHUB_ENV"
          [ "$status" = 0 ] && echo "GATE_1K_OK tree=${tree::12}"
          [ "$status" = 0 ] || echo "::error title=Gate 1k refused::$(grep -m1 -o 'PROMOTION_REFUSED.*' "$out/verdict.md" || echo "the gate exited $status")"
          exit "$status"
      - if: ${{ !cancelled() && env.name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.name }}
          path: |
            ${{ runner.temp }}/top1k/results.jsonl
            ${{ runner.temp }}/top1k/score.md
            ${{ runner.temp }}/top1k/meta.json
            ${{ runner.temp }}/top1k/rereads.json
            ${{ runner.temp }}/top1k/verdict.md
          retention-days: 90

  # The run's numbers to the test dashboard (UNB-250): dashboard-post.yml. Never turns the run red. Called from QA, QA
  # posts its own run's numbers, so this one is skipped there.
  dashboard:
    needs: bank
    if: always() && github.workflow == 'Gate bank'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/dashboard-post.yml
    with:
      conclusion: ${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }}
    secrets:
      DASHBOARD_INGEST_KEY: ${{ secrets.DASHBOARD_INGEST_KEY }}
