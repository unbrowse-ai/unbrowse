# Staging went red: an agent reads the failed run and proposes the fix, as a pull request that goes through every check
# and the merge checks in AGENTS.md like any other. Lewis, 23 November 2026: "can you make ci auto fix such bugs" (after #829,
# #832, #833 and #837 were each a red staging run read and fixed by hand).
#
# Only staging: the run that failed was a push to staging, code already merged by someone with write access. A workflow
# that holds a model credential takes no pull_request trigger and checks out no pull request's head
# (.github/scripts/test/test_workflow_security.py); a fixer for a pull request's own branch is not this.
#
# The agent reads and edits files, and nothing else: no shell, no web, no GitHub token, nothing outside the work tree.
# It reads the failed log and the run's facts that `autofix.py plan` wrote into .autofix/, and the repository's own
# rules (AGENTS.md). Then a step with no credential (`autofix.py guard`) refuses a fix that loosens a check instead of
# fixing a cause: a file only a person changes, a check switched off, a test that lost assertions. A fix that passes goes
# on a branch of its own, `autofix/<commit>-<run>`, as a pull request labelled `autofix`; CI and Coverage start on it by
# workflow_dispatch (a pull request opened with this workflow's token starts no pull_request run). Its body carries a
# marker for each failure it works on, so a staging that stays red across many pushes gets one fixer, not one per push.
#
name: Staging autofix

on:
  workflow_run:
    workflows: [CI, Coverage, QA]
    types: [completed]
    branches: [staging]

concurrency:
  group: staging-autofix-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

# Model calls use ChatGPT subscription OAuth through agent_cli.py.
env:
  AGENT_AUTH: chatgpt

jobs:
  place:
    name: Where the agent jobs run
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'staging' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      fix: ${{ steps.place.outputs.fix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/place_jobs.py
          sparse-checkout-cone-mode: false
      - id: place
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          MAC_POOL: ${{ vars.MAC_RUNNER }}
          LINUX_POOL: ${{ vars.LINUX_POOL || '["self-hosted", "linux", "x64"]' }}
        run: python3 -I .github/scripts/place_jobs.py fix=linux

  fix:
    needs: place
    name: Fix staging
    runs-on: ${{ fromJSON(needs.place.outputs.fix) }}
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: What failed, and whether a fix is in hand
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: python3 -I .github/scripts/autofix.py plan --run "$RUN_ID" --out .autofix --repo "$REPO"
      - if: steps.plan.outputs.act == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: The model CLI (opencode)
        if: steps.plan.outputs.act == 'true'
        run: |
          npm i --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/agent-cli" @opencode/cli@2.4.1
          echo "$RUNNER_TEMP/agent-cli/node_modules/.bin" >> "$GITHUB_PATH"
      # The agent: Read, Edit and Write in the work tree, Glob and Grep to find its way; no shell, no web, no GitHub
      # token, nothing read or written in the runner's temp folder. The node's own tests run in CI on the pull request.
      - name: Propose the fix
        id: claude
        if: steps.plan.outputs.act == 'true'
        env:
          OPENCODE_CHATGPT_ACCESS_TOKEN: ${{ secrets.OPENCODE_CHATGPT_ACCESS_TOKEN }}
          OPENCODE_CHATGPT_CREDENTIAL_URL: ${{ vars.OPENCODE_CHATGPT_CREDENTIAL_URL }}
          OPENCODE_CHATGPT_CREDENTIAL_KEY: ${{ secrets.OPENCODE_CHATGPT_CREDENTIAL_KEY }}
          PROMPT: >-
            A push to staging turned CI red. Read .autofix/run.md (the run and which jobs and steps failed) and
            .autofix/failed.log (the end of each failed step's log), then the code they name, and fix the cause in
            the repository's code, following AGENTS.md (CLAUDE.md is the same file). Rules: fix the cause, never the
            check. Never change a workflow or anything under .github/, AGENTS.md or CLAUDE.md, docs/REQUIREMENTS.md,
            docs/COVERAGE-EXCLUSIONS.md, a fixture or testdata file, a lockfile, or a generated file (wire.zig,
            generated.ts, _generated.py, agent-api.json); never add #[ignore], #[allow(...)], .skip( or
            continue-on-error; never take an assertion out of a test or change an expected value so a test passes,
            unless the expectation contradicts a row of docs/REQUIREMENTS.md, and then name that row. If the cause
            is not in the code (a runner that died, the network, a missing secret, a site that refused), or the
            fix needs one of the files above or a decision, change nothing. Either way, write .autofix/summary.md:
            what failed (quote the log line), the cause, what you changed and why it fixes the cause, which test
            covers it (add one that fails without your fix where none does), and anything you could not decide.
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/agent_cli.py" -p "$PROMPT" --output-format stream-json --verbose \
            --setting-sources project \
            --tools Read,Edit,Write,Glob,Grep \
            --allowedTools "Read,Edit,Write,Glob,Grep" \
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,Read(/$RUNNER_TEMP/**),Write(/$RUNNER_TEMP/**)" \
            --max-turns 80 --no-session-persistence \
            > "$RUNNER_TEMP/autofix-execution.jsonl" < /dev/null
      # From here on no step holds a model credential.
      - name: Refuse a fix that loosens a check
        id: guard
        if: steps.plan.outputs.act == 'true'
        env:
          BASE: ${{ github.event.workflow_run.head_sha }}
        run: python3 -I .github/scripts/autofix.py guard --base "$BASE"
      - name: Open the fix as a pull request
        if: steps.plan.outputs.act == 'true' && steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          URL: ${{ steps.plan.outputs.url }}
          SIGNATURES: ${{ steps.plan.outputs.signatures }}
        run: |
          [ -f .autofix/summary.md ] || echo "The agent left no summary." > .autofix/summary.md
          title="fix: staging's red run, proposed by the autofix ($(echo "$SIGNATURES" | jq -r '.[0]' | cut -c1-80))"
          {
            echo "Staging went red: $URL"
            echo
            echo "**Proposed by the staging autofix.** It read the failed log and edited files only, with no shell, and \`autofix.py guard\` found nothing it loosened. CI and Coverage start on this branch below; it merges only through the merge checks in AGENTS.md."
            echo
            cat .autofix/summary.md
            echo
            echo "$SIGNATURES" | jq -r '.[] | "<!-- autofix: \(.) -->"'
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A -- . ':!.autofix'
          git commit -q -m "$title" -m "$(cat .autofix/summary.md | head -c 4000)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          gh label create autofix -R "$REPO" --color FBCA04 --description "A fix the staging autofix proposed" 2>/dev/null || true
          gh pr create -R "$REPO" --base staging --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md" --label autofix
          gh workflow run ci.yml -R "$REPO" --ref "$BRANCH"
          gh workflow run coverage.yml -R "$REPO" --ref "$BRANCH"
      - name: Summary
        if: always()
        env:
          ACT: ${{ steps.plan.outputs.act || 'false' }}
          GUARD: ${{ steps.guard.outputs.ok || 'not run' }}
        run: |
          {
            echo "### Staging autofix"
            [ -f .autofix/run.md ] && cat .autofix/run.md
            echo
            echo "Asked: $ACT; guard: $GUARD"
            if [ -f .autofix/summary.md ]; then echo; cat .autofix/summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
