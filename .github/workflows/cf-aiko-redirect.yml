# One-shot: aiko.unbrowse.ai → https://unbrowse.ai/aiko (301).
# Uses the write-capable gitea CLOUDFLARE_API_TOKEN secret (injected here, never
# printed). Idempotent: creates the proxied DNS record if missing + (re)writes the
# Single Redirect rule. Delete this workflow once the redirect is confirmed live.
name: cf-aiko-redirect
on:
  workflow_dispatch:
jobs:
  redirect:
    name: create aiko redirect
    runs-on: self-hosted
    steps:
      - name: DNS + Single Redirect via CF API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: "73934a4d815fde770167414fc3ead04b"
        run: |
          set -uo pipefail
          api() { curl -s -m20 -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          echo "=== token reach + perms probe (zone read) ==="
          api "https://api.cloudflare.com/client/v4/zones/$ZONE" | python3 -c "import sys,json;d=json.load(sys.stdin);print('zone read ok:',d.get('success'),'name:',(d.get('result') or {}).get('name'),'errs:',[e.get('code') for e in d.get('errors',[])][:2])"

          echo "=== 1. proxied DNS A record aiko (idempotent) ==="
          EXIST=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=aiko.unbrowse.ai" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result',[]) or [];print(r[0]['id'] if r else '')")
          if [ -z "$EXIST" ]; then
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              --data '{"type":"A","name":"aiko","content":"192.0.2.1","proxied":true,"ttl":1,"comment":"redirect-only -> unbrowse.ai/aiko"}' \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print('dns create ok:',d.get('success'),'errs:',[(e.get('code'),e.get('message')) for e in d.get('errors',[])][:2])"
          else
            echo "dns already exists ($EXIST) — skipping create"
          fi

          echo "=== 2. Single Redirect rule -> https://unbrowse.ai/aiko ==="
          api -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets/phases/http_request_dynamic_redirect/entrypoint" \
            --data '{"rules":[{"action":"redirect","action_parameters":{"from_value":{"status_code":301,"target_url":{"value":"https://unbrowse.ai/aiko"},"preserve_query_string":false}},"expression":"(http.host eq \"aiko.unbrowse.ai\")","description":"aiko.unbrowse.ai -> unbrowse.ai/aiko","enabled":true}]}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('redirect rule ok:',d.get('success'),'errs:',[(e.get('code'),e.get('message')) for e in d.get('errors',[])][:3])"
