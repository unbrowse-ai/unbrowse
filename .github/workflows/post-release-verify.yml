name: Post-Release Verification

on:
  # Run after every release
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Also run on schedule to catch metric anomalies
  schedule:
    # Every 6 hours — catches degradation before full day passes
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to test (default: latest)"
        default: "latest"

permissions:
  contents: read
  issues: write

env:
  STAGING_HOST: lekt8@89.169.121.108
  STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

jobs:
  verify-on-staging:
    name: Verify on Staging VM
    runs-on: self-hosted
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      failed: ${{ steps.verify.outputs.failed }}
      report: ${{ steps.verify.outputs.report }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        id: ssh
        run: |
          if [ -z "${STAGING_SSH_KEY:-}" ] || ! printf '%s\n' "$STAGING_SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "Staging SSH key missing or invalid; skipping VM verification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H 89.169.121.108 >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Copy verify script to staging VM
        if: steps.ssh.outputs.skip != 'true'
        run: |
          scp -i ~/.ssh/staging_key -o StrictHostKeyChecking=no \
            scripts/post-release-verify.sh \
            ${{ env.STAGING_HOST }}:/tmp/post-release-verify.sh

      - name: Run verification on staging VM
        id: verify
        run: |
          VERSION="${{ github.event.inputs.version || 'latest' }}"
          if [ "${{ steps.ssh.outputs.skip }}" = "true" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "report={\"skipped\":true,\"reason\":\"staging_ssh_key_missing_or_invalid\"}" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Clean up any stale processes first
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no ${{ env.STAGING_HOST }} \
            "pkill -9 -f 'unbrowse|kuri' 2>/dev/null; sleep 2; true"

          # Run the verify script
          set +e
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ env.STAGING_HOST }} \
            "export PATH=\$HOME/.npm-global/bin:\$PATH && bash /tmp/post-release-verify.sh $VERSION" \
            > /tmp/verify-output.txt 2>&1
          EXIT_CODE=$?
          set -e

          cat /tmp/verify-output.txt

          # Extract the JSON report (last JSON block in output)
          REPORT="$(grep -E '^\{' /tmp/verify-output.txt | tail -1 || echo '{}')"
          INSTALLED_VERSION="$(echo "$REPORT" | node -p 'JSON.parse(require("fs").readFileSync("/dev/stdin","utf-8")).version' 2>/dev/null || echo 'unknown')"

          echo "version=$INSTALLED_VERSION" >> "$GITHUB_OUTPUT"
          echo "report<<REPORT_DELIM" >> "$GITHUB_OUTPUT"
          echo "$REPORT" >> "$GITHUB_OUTPUT"
          echo "REPORT_DELIM" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/staging_key

  traction-watchdog:
    name: Traction Anomaly Detection
    runs-on: self-hosted
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      anomaly_detected: ${{ steps.check.outputs.anomaly_detected }}
      anomaly_details: ${{ steps.check.outputs.anomaly_details }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Check traction metrics for anomalies
        id: check
        run: |
          node -e '
            async function main() {
              const res = await fetch("https://launch.unbrowse.ai/api/traction");
              const text = await res.text();

              // Try to extract daily data from the response
              const data = JSON.parse(text);
              const anomalies = [];

              // Check WAU
              if (data.wau !== undefined && data.wau < 100) {
                anomalies.push(`WAU critically low: ${data.wau} (baseline: 438)`);
              }

              // Check if we can find daily verification data
              // Look for dramatic day-over-day drops
              if (data.daily_verifications) {
                const days = Object.entries(data.daily_verifications).sort();
                if (days.length >= 2) {
                  const [prevDay, prevCount] = days[days.length - 2];
                  const [currDay, currCount] = days[days.length - 1];
                  const dropPct = ((prevCount - currCount) / prevCount * 100).toFixed(1);
                  if (currCount < prevCount * 0.3) {
                    anomalies.push(`Verification cliff: ${currDay} has ${currCount} vs ${prevDay} ${prevCount} (-${dropPct}%)`);
                  }
                }
              }

              // Output
              if (anomalies.length > 0) {
                const details = anomalies.join("; ");
                const fs = require("fs");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `anomaly_detected=true\n`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `anomaly_details<<ANOMALY_DELIM\n${details}\nANOMALY_DELIM\n`);
                console.log("ANOMALIES DETECTED:", details);
              } else {
                const fs = require("fs");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `anomaly_detected=false\n`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `anomaly_details=none\n`);
                console.log("Traction metrics healthy");
              }
            }
            main().catch(e => {
              console.error(e);
              const fs = require("fs");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `anomaly_detected=true\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `anomaly_details<<ANOMALY_DELIM\nFailed to fetch traction metrics: ${e.message}\nANOMALY_DELIM\n`);
            });
          '

  # Also check marketplace stats
      - name: Check marketplace stats
        id: marketplace
        run: |
          node -e '
            async function main() {
              const res = await fetch("https://beta-api.unbrowse.ai/v1/stats/summary");
              const data = await res.json();
              const anomalies = [];

              if (data.hit_rate !== undefined && data.hit_rate < 0.2) {
                anomalies.push(`Marketplace hit rate collapsed: ${(data.hit_rate * 100).toFixed(1)}%`);
              }

              if (anomalies.length > 0) {
                const fs = require("fs");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `marketplace_anomaly=true\n`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `marketplace_details=${anomalies.join("; ")}\n`);
              } else {
                const fs = require("fs");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `marketplace_anomaly=false\n`);
              }
            }
            main().catch(() => {});
          '

  file-issue-on-failure:
    name: Auto-File GitHub Issue
    runs-on: self-hosted
    needs: [verify-on-staging, traction-watchdog]
    if: |
      always() && (
        needs.verify-on-staging.outputs.failed == 'true' ||
        needs.traction-watchdog.outputs.anomaly_detected == 'true'
      )
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for existing open issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Don't spam — check if we already have an open regression issue
          EXISTING="$(gh issue list --label "regression,automated" --state open --limit 1 --json number -q '.[0].number' || true)"
          if [[ -n "$EXISTING" ]]; then
            echo "existing_issue=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Found existing open issue #$EXISTING — will comment instead of creating new"
          else
            echo "existing_issue=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build issue body
        id: body
        run: |
          VERIFY_FAILED="${{ needs.verify-on-staging.outputs.failed }}"
          VERIFY_VERSION="${{ needs.verify-on-staging.outputs.version }}"
          VERIFY_REPORT="${{ needs.verify-on-staging.outputs.report }}"
          TRACTION_ANOMALY="${{ needs.traction-watchdog.outputs.anomaly_detected }}"
          TRACTION_DETAILS="${{ needs.traction-watchdog.outputs.anomaly_details }}"

          cat > /tmp/issue-body.md <<'ISSUE_EOF'
          ## Automated Regression Report

          **Detected at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Trigger:** ${{ github.event_name }}
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ISSUE_EOF

          if [[ "$VERIFY_FAILED" == "true" ]]; then
            cat >> /tmp/issue-body.md <<VERIFY_EOF
          ### Staging VM Verification Failed (v${VERIFY_VERSION})

          \`\`\`json
          ${VERIFY_REPORT}
          \`\`\`
          VERIFY_EOF
          fi

          if [[ "$TRACTION_ANOMALY" == "true" ]]; then
            cat >> /tmp/issue-body.md <<TRACTION_EOF

          ### Traction Anomaly Detected

          ${TRACTION_DETAILS}

          This may indicate a breaking change in a recent release that is causing agent churn.
          Check recent commits and releases for regressions in the resolve/execute pipeline.
          TRACTION_EOF
          fi

          cat >> /tmp/issue-body.md <<'FOOTER_EOF'

          ---
          *Filed automatically by post-release-verify.yml. Fix the regression and close this issue.*
          FOOTER_EOF

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING="${{ steps.existing.outputs.existing_issue }}"
          VERSION="${{ needs.verify-on-staging.outputs.version }}"
          TITLE="[automated] Regression detected in v${VERSION:-unknown}"

          # Ensure labels exist
          gh label create "regression" --color "B60205" --description "Automated regression detection" --force 2>/dev/null || true
          gh label create "automated" --color "FBCA04" --description "Filed by CI automation" --force 2>/dev/null || true

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/issue-body.md \
              --label "regression,automated" \
              --assignee "lewistham9x"
            echo "Created new regression issue"
          fi
