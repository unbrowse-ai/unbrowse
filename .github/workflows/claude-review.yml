# Claude reads each change merged into staging for bugs and posts what it finds as one comment on the pull request that
# merged it (CLAUDE.md and AGENTS.md are its rules). It reads the code; QA (qa.yml) is the one that runs it.
#
# It runs after the merge, not on the pull request: a workflow that holds a model credential takes no pull_request
# trigger (.github/scripts/test/test_workflow_security.py). claude-code-action throws "Unsupported event type: push" for
# every push (it takes issues, pull requests, comments, dispatch, schedule and workflow_run), so all 132 push runs from
# 16 to 21 Nov 2026 failed in a second and reviewed nothing (runs 43900809891 to 44856423550). The review is asked of the
# pinned CLI, as qa.yml's QA is.
#
# Needs a Claude credential as a repository secret, ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN. Without one the job
# says so and passes.
name: Claude review

on:
  push:
    branches: [staging]
  workflow_dispatch:

# One review per merged change, each in a group of its own: every push to staging is another pull request's change, so
# a newer push must not cancel the review of the one before it. With one group for the branch and cancel-in-progress,
# all 21 runs from #757's merge (21 Nov 2026 03:40Z) to 10:22Z were cancelled by the next push while they waited for a
# pool slot, and none reached a runner (runs 44862301460 to 44894018417; UNB-166).
concurrency:
  group: claude-review-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Where this workflow's agent jobs run (UNB-166): one of Lewis's own runners while one is free, else a Blacksmith
  # machine that starts at once, so a Mac that is asleep or busy never holds a run up. The summary says why for each
  # job. A fork's pull request is never placed on a local runner. .github/scripts/place_jobs.py
  place:
    name: Where the agent jobs run
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      review: ${{ steps.place.outputs.review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/place_jobs.py
          sparse-checkout-cone-mode: false
      - id: place
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          MAC_POOL: ${{ vars.MAC_RUNNER }}
          LINUX_POOL: ${{ vars.LINUX_POOL || '["self-hosted", "linux", "x64"]' }}
        run: python3 -I .github/scripts/place_jobs.py review=linux

  review:
    needs: place
    permissions:
      contents: read
      pull-requests: write
    name: Claude review
    if: >-
      github.ref == 'refs/heads/staging'
    runs-on: ${{ fromJSON(needs.place.outputs.review) }}
    timeout-minutes: 30
    steps:
      - id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY$OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Claude review didn't run: add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret"
          fi
      # Two commits deep: staging takes squash merges, so HEAD^..HEAD is the pull request's change.
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # The Claude CLI the credential is asked with: the locked one, its lifecycle scripts off, in a step with no secret.
      - name: Install the pinned Claude CLI
        if: steps.auth.outputs.ok == 'true'
        run: |
          npm ci --silent --ignore-scripts --prefix .github/tools/claude-cli
          # The CLI is a stub until its own install.cjs, from the same locked package, links in the native binary of
          # the platform's locked optional package; skipped, every ask says "claude native binary not installed" (UNB-235).
          node .github/tools/claude-cli/node_modules/@anthropic-ai/claude-code/install.cjs
          .github/tools/claude-cli/node_modules/.bin/claude --version
      # A token that is set can still refuse (a weekly limit): the job runs on the first one that answers.
      - name: Pick the Claude credential that answers
        id: credential
        if: steps.auth.outputs.ok == 'true'
        env:
          CLAUDE_BIN: ${{ github.workspace }}/.github/tools/claude-cli/node_modules/.bin/claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: sh .github/scripts/claude-credential.sh TOKEN_2 TOKEN
      # The change and the pull request it came from, written down with no credential in the step.
      - name: The change to review
        id: change
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          git diff HEAD^ HEAD > .claude-review.diff
          git diff --stat HEAD^ HEAD
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      # Read-only tools on the work tree: no shell, no web, no write, no GitHub token. Capped in turns and dollars.
      - name: Review
        id: claude
        if: steps.auth.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.credential.outputs.name == 'TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          prompt='Review the change in .claude-review.diff (git diff HEAD^ HEAD of this repository) for correctness bugs it adds: wrong results, crashes, races, security holes, broken rules from CLAUDE.md and AGENTS.md. Read the files the diff touches for context. Report only findings you verified against the code, most severe first, each as: file:line, what is wrong, the input or state that breaks it. No style notes. If there is nothing, say "No bugs found." Answer in GitHub markdown, nothing else.'
          .github/tools/claude-cli/node_modules/.bin/claude -p "$prompt" --output-format json --strict-mcp-config \
            --setting-sources project --tools Read,Grep,Glob --allowedTools Read,Grep,Glob \
            --max-turns 40 --max-budget-usd 3 --no-session-persistence \
            > "$RUNNER_TEMP/review/result.json" < /dev/null
          jq -e '.is_error == false' "$RUNNER_TEMP/review/result.json" > /dev/null
      - name: Post the review
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.change.outputs.pr }}
        run: |
          {
            echo "### Claude review of ${GITHUB_SHA::12}"
            echo
            jq -r .result "$RUNNER_TEMP/review/result.json"
          } > "$RUNNER_TEMP/review/comment.md"
          cat "$RUNNER_TEMP/review/comment.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review/comment.md"
          else
            echo "No pull request merged $GITHUB_SHA: the review is in the run's summary only"
          fi
