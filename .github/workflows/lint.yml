name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repo-sanity:
    name: Repo Sanity
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run check:skill-md
