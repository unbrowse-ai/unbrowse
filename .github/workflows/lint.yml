name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  repo-sanity:
    name: Repo Sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check:skill-md
