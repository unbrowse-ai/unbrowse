name: Lint

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  repo-sanity:
    name: Repo Sanity
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run check:skill-md
      - run: bun run check:skill-docs
