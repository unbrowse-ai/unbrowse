name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  repo-sanity:
    name: Repo Sanity
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run check:skill-md
