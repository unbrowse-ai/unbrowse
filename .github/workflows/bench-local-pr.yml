name: Bench Local PR

on:
  pull_request:
    paths:
      - "src/execution/**"
      - "src/capture/**"
      - "src/sandbox/**"
      - "src/reverse-engineer/**"

concurrency:
  group: bench-local-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  bench:
    runs-on: self-hosted
    steps:
      # fetch-depth 0 so we can compute merge-base against origin/main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # baseline sha = merge-base; bench delta is computed against this commit's history
      - id: baseline
        run: echo "sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"

      # cache@v4 keyed by base-sha — simpler than cross-workflow artifact-download lookup
      - uses: actions/cache@v4
        with:
          path: /tmp/base-history.json
          key: bench-history-${{ steps.baseline.outputs.sha }}

      # --force-capture bypasses cache so deltas reflect code changes, not stale fixtures
      - name: Run bench-local
        # one corpus row crashing must not kill the whole bench; partial evidence still renders a useful delta
        continue-on-error: true
        env:
          UNBROWSE_PROXY_URL: ${{ secrets.IPROYAL_URL }}
        run: bash scripts/bench-local.sh --use-source --corpus-file scripts/corpus/hard-target-bench.txt --timeout 120 --force-capture

      # render markdown comment from evidence + base-history delta
      - name: Render PR comment
        run: bun scripts/bench-pr-comment.ts --evidence .bench-local/evidence.csv --base /tmp/base-history.json > /tmp/comment.md

      # upsert by marker — mirrors preview.yml L96-111 (find existing, update or create)
      - name: Upsert bench comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          BENCH_MARKER: "<!-- bench-local-pr -->"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const marker = process.env.BENCH_MARKER;
            const issue_number = Number(process.env.PR_NUMBER);
            const rendered = fs.existsSync("/tmp/comment.md") ? fs.readFileSync("/tmp/comment.md", "utf8") : "_(no bench output)_";
            const body = `${marker}\n${rendered}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
