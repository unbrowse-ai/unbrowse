name: Test Windows E2E

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-support, main]
  pull_request:
    paths:
      - ".github/workflows/test-windows.yml"
      - "submodules/kuri/**"
      - "src/kuri/**"
      - "packages/skill/scripts/**"
      - "packages/skill/vendor/kuri/**"
      - "install.ps1"
      - "src/single-binary.ts"

permissions:
  contents: read

jobs:
  test-windows:
    name: Windows E2E
    runs-on: windows-latest
    # Building kuri.exe from source on the runner (zig + quickjs) + the bun builds
    # + browser test runs ~20 min; give headroom so a slow tail step can't cancel
    # the job after the real tests have already passed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # NOT `recursive` — the skills/foundry submodule (unbrowse-ai/foundry,
          # private) aborts the whole recursive checkout for the CI token. We
          # only need submodules/kuri, pulled selectively below.
          submodules: false

      - name: Init submodules/kuri only
        run: |
          git submodule init submodules/kuri
          git submodule update --init --depth=1 submodules/kuri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check Chrome is available
        shell: pwsh
        run: |
          $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromePath) {
            Write-Host "Chrome found: $chromePath"
            & $chromePath --version
          } else {
            Write-Host "Chrome not at default path, searching..."
            Get-ChildItem "C:\Program Files*\Google\Chrome\Application\chrome.exe" -ErrorAction SilentlyContinue
          }

      - name: Build kuri.exe from source (the exact submodule under test)
        id: resolve_kuri
        shell: pwsh
        run: |
          Push-Location submodules/kuri
          zig build -Dtarget=x86_64-windows-gnu
          Pop-Location
          $exe = "submodules\kuri\zig-out\bin\kuri.exe"
          if (-not (Test-Path $exe)) { Write-Error "kuri.exe not produced by zig build"; exit 1 }
          $resolved = (Resolve-Path $exe).Path
          Write-Host "Built kuri.exe at $resolved"
          "kuri_path=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # The win-x64 kuri.exe is gitignored (unlike the committed darwin/linux
          # ones), so it is absent on a fresh checkout. single-binary.ts embeds it,
          # so stage the freshly-built binary into the vendor path before the
          # unbrowse.exe build below.
          New-Item -ItemType Directory -Force -Path "packages\skill\vendor\kuri\win-x64" | Out-Null
          Copy-Item -Force $resolved "packages\skill\vendor\kuri\win-x64\kuri.exe"

      - name: Test kuri.exe health
        shell: pwsh
        env:
          KURI_PATH: ${{ steps.resolve_kuri.outputs.kuri_path }}
        run: |
          $kuriExe = $env:KURI_PATH
          if (-not (Test-Path $kuriExe)) { Write-Error "kuri.exe still not resolvable"; exit 1 }
          Write-Host "Using kuri.exe at $kuriExe"
          $env:HEADLESS = "true"
          $env:KURI_HEADLESS = "true"
          $stdout = Join-Path $env:RUNNER_TEMP "kuri.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "kuri.stderr.log"
          $proc = Start-Process -FilePath $kuriExe -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($proc.HasExited) {
                Write-Host "kuri.exe exited early with code $($proc.ExitCode)"
                break
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8080/health" -TimeoutSec 2 -ErrorAction Stop
                Write-Host "Kuri health: $($health | ConvertTo-Json -Compress)"
                if ($health.ok -eq $true) { $ok = $true; break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ok) {
              Write-Host "=== kuri stdout ==="
              if (Test-Path $stdout) { Get-Content $stdout -ErrorAction SilentlyContinue | Select-Object -Last 80 }
              Write-Host "=== kuri stderr ==="
              if (Test-Path $stderr) { Get-Content $stderr -ErrorAction SilentlyContinue | Select-Object -Last 80 }
              throw "Kuri did not become healthy within 60s"
            }
            Write-Host "PASS: kuri.exe health"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install dependencies
        # Not --frozen-lockfile: bun.lock is generated on darwin/linux and resolves
        # different platform-specific optional deps on Windows, which trips the
        # frozen check. The E2E only needs deps present to build unbrowse.exe.
        run: bun install --no-frozen-lockfile

      - name: Stage non-Windows Kuri import placeholders
        shell: pwsh
        # src/single-binary.ts statically imports every platform's Kuri asset so
        # Bun can compile any target. This Windows E2E executes only the real
        # win-x64/kuri.exe staged above; non-Windows assets only need to exist
        # at compile time. Release packaging still builds the real shared vendor
        # tree through build-kuri-vendor.
        run: |
          $targets = @(
            @{ Dir = "darwin-arm64"; Bin = "kuri" },
            @{ Dir = "darwin-x64"; Bin = "kuri" },
            @{ Dir = "linux-arm64"; Bin = "kuri" },
            @{ Dir = "linux-x64"; Bin = "kuri" }
          )
          foreach ($target in $targets) {
            $dir = "packages\skill\vendor\kuri\$($target.Dir)"
            $file = Join-Path $dir $target.Bin
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            if (-not (Test-Path $file)) {
              Set-Content -Path $file -NoNewline -Value "#!/bin/sh`necho '[unbrowse] non-Windows Kuri placeholder for Windows compile-only E2E' >&2`nexit 1`n"
            }
          }
          Get-ChildItem packages\skill\vendor\kuri -Recurse | Select-Object FullName, Length

      - name: Build unbrowse.exe
        shell: pwsh
        run: |
          bun build src/single-binary.ts --compile --minify --target=bun-windows-x64 --outfile dist\unbrowse.exe
          Write-Host "Built: $((Get-Item dist\unbrowse.exe).Length / 1MB) MB"

      - name: Test unbrowse health
        shell: pwsh
        run: |
          $env:HEADLESS = "true"
          $result = & dist\unbrowse.exe eval status 2>&1 | Out-String
          Write-Host $result
          if ($result -match '"op_kind":"eval:status"') { Write-Host "PASS: unbrowse eval status" }
          else { Write-Host "WARN: status output unexpected"; exit 1 }

      - name: Test browser workflow (go + snap + close)
        shell: pwsh
        run: |
          $env:HEADLESS = "true"

          Write-Host "=== GO ==="
          $go = & dist\unbrowse.exe breath go "https://example.com" 2>&1 | Out-String
          Write-Host $go

          Start-Sleep -Seconds 3

          Write-Host "=== SNAP ==="
          $snap = & dist\unbrowse.exe eval snap 2>&1 | Out-String
          Write-Host $snap

          Write-Host "=== CLOSE ==="
          $close = & dist\unbrowse.exe breath close 2>&1 | Out-String
          Write-Host $close

          if ($go -match '"ok":true') { Write-Host "PASS: browser workflow" }
          else { Write-Host "FAIL: browser go"; exit 1 }

      - name: Test resolve (marketplace)
        shell: pwsh
        run: |
          $env:HEADLESS = "true"
          & dist\unbrowse.exe eval resolve --intent "top stories" --url "https://news.ycombinator.com" --pretty 2>&1

      - name: Test install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content install.ps1 -Raw), [ref]$errors)
          if ($errors.Count -gt 0) { Write-Error "Syntax errors: $errors"; exit 1 }
          Write-Host "PASS: install.ps1 syntax"

      - name: Test OpenClaw plugin install
        shell: pwsh
        continue-on-error: true
        # Tangential to the browse E2E and prone to hanging on Windows
        # (npx unbrowse-openclaw install). Cap it so a hang cannot run the job
        # out to its timeout and cancel it after the real tests have passed.
        timeout-minutes: 4
        run: |
          npm install -g openclaw 2>&1 | Select-Object -Last 3
          openclaw --version 2>&1
          npx unbrowse-openclaw install 2>&1 | Select-Object -Last 15
