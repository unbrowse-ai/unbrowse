name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run check:public
      - run: bun run typecheck
      - run: bun run check:plugins
      - run: bun test ./packages ./tests
      - name: OpenClaw plugin
        working-directory: plugins/openclaw
        run: npm run typecheck && npm run check && bun test tests
      - name: elizaOS plugin
        working-directory: plugins/elizaos
        run: bun install --frozen-lockfile && bun run typecheck && bun run build && bun test tests
      - name: n8n node
        working-directory: plugins/n8n
        run: npm ci --ignore-scripts && npm run lint && npm run build && npm test
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Hermes plugin
        run: python -m pip install -q pytest pyyaml && python -m pytest -q plugins/hermes/tests
      - name: Dify plugin
        run: python -m pip install -q 'dify_plugin>=0.9.0,<0.10.0' pytest && python -m pytest -q plugins/dify/tests
      - name: LangChain package
        working-directory: plugins/langchain
        run: python -m pip install -q -e '.[test]' && python -m pytest -q
      - name: LlamaIndex package
        working-directory: plugins/llamaindex
        run: python -m pip install -q -e '.[test]' && python -m pytest -q
      - run: bun run build
      - run: node packages/cli/dist/cli.js --version
      - run: node --input-type=module -e 'import("./packages/sdk/dist/index.js").then(m => { if (!new m.Unbrowse().baseUrl.endsWith("/api/v1")) process.exit(1) })'
      - name: Pack and install clients
        run: |
          mkdir -p out
          (cd packages/sdk && npm pack --pack-destination ../../out)
          (cd packages/cli && npm pack --pack-destination ../../out)
          bash scripts/smoke-packed.sh out/unbrowse-sdk-*.tgz out/unbrowse-[0-9]*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: public-client
          path: |
            out/*.tgz
            skill/
            docs/public-surface.json
