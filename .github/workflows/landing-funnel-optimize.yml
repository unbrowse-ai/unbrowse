name: Landing Funnel Optimize

on:
  schedule:
    - cron: "5 9 * * *"
  workflow_dispatch:

jobs:
  optimize:
    name: Optimize Landing Funnel
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run optimize:landing-funnel
        env:
          UNBROWSE_OPTIMIZER_API_URL: https://beta-api.unbrowse.ai
          UNBROWSE_OPTIMIZER_API_KEY: ${{ secrets.UNBROWSE_API_KEY }}
