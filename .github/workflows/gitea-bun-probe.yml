# Throwaway witness: proves the runner.envs NODE_EXTRA_CA_CERTS injection makes
# oven-sh/setup-bun succeed on the self-hosted mac-mini (the TLS issue that was
# failing test.yml/lint.yml/etc). Delete after the env fix is confirmed.
name: Gitea Bun Probe
on:
  push:
    tags: ["bunprobe-*"]
jobs:
  probe:
    runs-on: self-hosted
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun --version && echo "SETUP-BUN OK on self-hosted mac runner"
