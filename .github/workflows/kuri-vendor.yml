name: kuri-vendor

# Native-builder matrix: each runner builds its own host triple via plain
# `zig build` (no -Dtarget), avoiding Zig 0.16's cross-compile sysroot
# requirement. darwin-arm64 is the original lane (release.yml uses the same
# pattern). windows-x64 added 2026-05-20 per
# .claude/build-kuri-for-windows-x86-64-windows-so-unbrows scaffold —
# windows-latest ships MSVC + the SDK headers Zig 0.16 needs for a Windows
# host build, so native build succeeds where macOS-host cross-compile fails.
# darwin-x64, linux-arm64, linux-x64 still deferred.

on:
  workflow_dispatch:
    inputs:
      kuri_ref:
        description: "kuri ref to build (branch, tag, or commit). Must be >= 894ecb9b503f60665a31d2c4c8e96b17d9da3f61."
        required: false
        default: "feat/sandbox-proxy"

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            zig_target: aarch64-macos
            bin_name: kuri
            shell: bash
          - platform: windows-x64
            runner: windows-latest
            zig_target: x86_64-windows
            bin_name: kuri.exe
            shell: bash
          # darwin-x64, linux-arm64, linux-x64 deferred — see header comment.

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout kuri
        uses: actions/checkout@v4
        with:
          repository: lekt9/kuri
          ref: ${{ github.event.inputs.kuri_ref }}
          path: kuri

      - name: Install Zig 0.16.0
        # Kuri's build.zig.zon declares minimum_zig_version 0.16.0; 0.13/0.14
        # will be rejected outright. Bump only with matching upstream proof.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build kuri (native ${{ matrix.zig_target }})
        # Native build only — no -Dtarget. Zig cross-compile mode triggered
        # by -Dtarget skips the host SDK lookup even when arch matches the
        # runner. Each runner builds its own host triple.
        working-directory: kuri
        run: |
          zig build -Doptimize=ReleaseSafe
          ls -la zig-out/bin/

      - name: Locate binary
        id: locate
        working-directory: kuri
        run: |
          BIN_PATH=$(find zig-out -type f -name '${{ matrix.bin_name }}' | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "kuri binary not found under zig-out/" >&2
            ls -laR zig-out/ >&2
            exit 1
          fi
          echo "bin_path=kuri/$BIN_PATH" >> "$GITHUB_OUTPUT"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$BIN_PATH"
          else
            sha256sum "$BIN_PATH"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: kuri-${{ matrix.platform }}
          path: ${{ steps.locate.outputs.bin_path }}
          if-no-files-found: error
          retention-days: 14
