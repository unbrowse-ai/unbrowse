name: PR Agent

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository full name
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: PR head sha
        required: true
        type: string
      trigger_source:
        description: Source event
        required: true
        type: string
      trigger_reason:
        description: Trigger reason
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  pr-agent:
    name: Review And Repair PR
    runs-on: self-hosted
    timeout-minutes: 90
    concurrency:
      group: pr-agent-${{ inputs.repo }}-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - run: bash scripts/ensure-submodules.sh submodules/kuri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Run PR agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/pr-agent.ts \
            --repo "${{ inputs.repo }}" \
            --pr "${{ inputs.pr_number }}" \
            --trigger-source "${{ inputs.trigger_source }}" \
            --trigger-reason "${{ inputs.trigger_reason }}"
