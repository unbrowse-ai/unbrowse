name: Test

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run test:issue-regressions
        name: Run issue regressions and eval contract tests
      - run: bun test tests/path-params.test.ts tests/utils.test.ts tests/pr-agent.test.ts
        name: Run unit tests

  quality-gate:
    name: Quality Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun test evals/quality-gate.test.ts
        name: Run quality gate tests

  backend-tests:
    name: Backend Tests
    runs-on: self-hosted
    env:
      GRAPH_TEST_API_KEY: ${{ secrets.UNBROWSE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun test backend/tests/
        name: Run all backend tests

  landing-funnel-e2e:
    name: Landing Funnel E2E
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run test:landing-funnel:e2e
        name: Run landing funnel end-to-end coverage

  typecheck:
    name: Typecheck Backend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        name: Typecheck backend

  package-cli:
    name: Package CLI
    runs-on: self-hosted
    env:
      UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run check:kuri-vendor
        name: Check baked Kuri vendor state
      - run: npm pack --dry-run
        name: Validate npm package
        working-directory: packages/skill
      - run: bash scripts/smoke-packaged-cli.sh
        name: Smoke packaged global install

  cli-e2e:
    name: CLI E2E
    runs-on: self-hosted
    env:
      UNBROWSE_DISABLE_AUTO_UPDATE: "1"
      UNBROWSE_NON_INTERACTIVE: "1"
      UNBROWSE_TOS_ACCEPTED: "1"
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run cli -- setup --no-start
        name: Build Kuri for CLI tests
      - run: bun test tests/cli-e2e.test.ts
        name: Run CLI end-to-end tests
