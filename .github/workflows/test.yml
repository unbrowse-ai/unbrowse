name: Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration-version-sync:
    name: Integration Version Sync
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun scripts/sync-integration-versions.mjs --check
        name: Check integration version sync

  unit-tests:
    name: Unit Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test tests/path-params.test.ts tests/utils.test.ts tests/repeatability-gate.test.ts tests/marketplace-retrieval-eval.test.ts tests/marketplace-retrieval-cases.test.ts tests/many-domains-gate.test.ts
        name: Run unit tests

  quality-gate:
    name: Quality Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test evals/quality-gate.test.ts
        name: Run quality gate tests

  backend-tests:
    name: Backend Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test backend/tests/
        name: Run all backend tests

  typecheck:
    name: Typecheck Backend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
        working-directory: .
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run typecheck
        name: Typecheck backend

  package-cli:
    name: Package CLI
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun scripts/sync-skill-md.ts --check
        name: Check SKILL.md sync
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          npm pack --dry-run
        name: Validate npm package
        working-directory: packages/skill

  package-cli-windows:
    name: Package CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-skill-md.ts --check
        name: Check SKILL.md sync
      - name: Build npm tarball
        working-directory: packages/skill
        shell: pwsh
        run: |
          $pack = npm pack --json | ConvertFrom-Json
          "UNBROWSE_TARBALL=$($pack[0].filename)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke install packaged CLI
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "unbrowse-cli-smoke"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Push-Location $tmp
          npm init -y | Out-Null
          npm install --omit=optional (Join-Path $env:GITHUB_WORKSPACE "packages/skill" $env:UNBROWSE_TARBALL)
          npx unbrowse --help
          Pop-Location

  openclaw-plugin:
    name: OpenClaw Plugin
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Install deps
        working-directory: integrations/openclaw
        run: npm install --no-package-lock
      - name: Typecheck plugin
        working-directory: integrations/openclaw
        run: npm run typecheck
      - name: Test plugin
        working-directory: integrations/openclaw
        run: npm test

  package-frameworks-npm:
    name: Package Frameworks (npm)
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - integrations/elizaos
          - integrations/mcp
          - integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Install deps
        working-directory: ${{ matrix.package_dir }}
        run: npm install --no-package-lock
      - name: Validate npm package
        working-directory: ${{ matrix.package_dir }}
        run: npm pack --dry-run

  package-frameworks-python:
    name: Package Frameworks (Python)
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - integrations/hermes
          - integrations/langchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build Python package
        working-directory: ${{ matrix.package_dir }}
        run: python -m build

  resolve-execute-eval:
    name: Resolve Execute Eval
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
          bun test ./evals/resolve-execute.test.ts
        name: Run resolve-execute eval
