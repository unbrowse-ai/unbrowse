name: Test

on:
  pull_request:
    branches: [rach/restart-base, main]
  push:
    branches: [rach/restart-base, main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun test tests/path-params.test.ts tests/utils.test.ts
        name: Run unit tests

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun test evals/quality-gate.test.ts
        name: Run quality gate tests

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun test backend/tests/
        name: Run all backend tests

  typecheck:
    name: Typecheck Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        name: Typecheck backend

  package-cli:
    name: Package CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-skill-md.ts --check
        name: Check SKILL.md sync
      - run: npm pack --dry-run
        name: Validate npm package
        working-directory: packages/skill

  cli-e2e:
    name: CLI E2E
    runs-on: ubuntu-latest
    env:
      UNBROWSE_DISABLE_AUTO_UPDATE: "1"
      UNBROWSE_NON_INTERACTIVE: "1"
      UNBROWSE_TOS_ACCEPTED: "1"
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - run: bun run cli -- setup --no-start
        name: Build Kuri for CLI tests
      - run: bun test tests/cli-e2e.test.ts
        name: Run CLI end-to-end tests
