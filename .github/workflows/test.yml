name: Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration-version-sync:
    name: Integration Version Sync
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun scripts/sync-integration-versions.mjs --check
        name: Check integration version sync

  unit-tests:
    name: Unit Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test tests/path-params.test.ts tests/utils.test.ts tests/repeatability-gate.test.ts tests/marketplace-retrieval-eval.test.ts tests/marketplace-retrieval-cases.test.ts tests/many-domains-gate.test.ts
        name: Run unit tests

  quality-gate:
    name: Quality Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test evals/quality-gate.test.ts
        name: Run quality gate tests

  backend-tests:
    name: Backend Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun test backend/tests/
        name: Run all backend tests

  typecheck:
    name: Typecheck Backend
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
        working-directory: .
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun run typecheck
        name: Typecheck backend

  package-cli:
    name: Package CLI
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun scripts/sync-skill-md.ts --check
        name: Check SKILL.md sync
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          npm pack --dry-run
        name: Validate npm package
        working-directory: packages/skill

  package-cli-windows:
    name: Package CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init submodules/kuri
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-skill-md.ts --check
        name: Check SKILL.md sync
      - name: Build npm tarball
        working-directory: packages/skill
        shell: pwsh
        run: |
          $raw = npm pack --json | Out-String
          $lines = $raw -split "`r?`n"
          $jsonStart = ($lines | Select-String '^\[\s*$' | Select-Object -First 1).LineNumber
          if (-not $jsonStart) { throw "npm pack --json did not emit a JSON payload" }
          $json = ($lines[($jsonStart - 1)..($lines.Length - 1)] -join "`n")
          $pack = $json | ConvertFrom-Json
          "UNBROWSE_TARBALL=$($pack[0].filename)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke install packaged CLI
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "unbrowse-cli-smoke"
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Push-Location $tmp
          npm init -y | Out-Null
          npm install --omit=optional (Join-Path $env:GITHUB_WORKSPACE "packages/skill" $env:UNBROWSE_TARBALL)
          npx unbrowse --help
          Pop-Location

  openclaw-plugin:
    name: OpenClaw Plugin
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Install deps
        working-directory: integrations/openclaw
        run: npm install --no-package-lock
      - name: Typecheck plugin
        working-directory: integrations/openclaw
        run: npm run typecheck
      - name: Test plugin
        working-directory: integrations/openclaw
        run: npm test

  package-frameworks-npm:
    name: Package Frameworks (npm)
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - integrations/elizaos
          - integrations/mcp
          - integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Install deps
        working-directory: ${{ matrix.package_dir }}
        run: npm install --no-package-lock
      - name: Validate npm package
        working-directory: ${{ matrix.package_dir }}
        run: npm pack --dry-run

  package-frameworks-python:
    name: Package Frameworks (Python)
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - integrations/hermes
          - integrations/langchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build Python package
        working-directory: ${{ matrix.package_dir }}
        run: python -m build

  resolve-execute-eval:
    name: Resolve Execute Eval
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync --recursive && git submodule update --init submodules/kuri
      - run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
          bun test ./evals/resolve-execute.test.ts
        name: Run resolve-execute eval

  sync-public-repo:
    name: Sync Public Repo
    if: github.event_name == 'push'
    runs-on: self-hosted
    needs:
      - integration-version-sync
      - unit-tests
      - quality-gate
      - backend-tests
      - typecheck
      - package-cli
      - package-cli-windows
      - openclaw-plugin
      - package-frameworks-npm
      - package-frameworks-python
      - resolve-execute-eval
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve public repo token
        id: public-auth
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::notice::No PUBLIC_REPO_TOKEN — skipping public repo sync."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$PUBLIC_REPO_TOKEN"
          echo "PUBLIC_REMOTE=https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/unbrowse-ai/unbrowse.git" >> "$GITHUB_ENV"

      - name: Force-sync main to public repo
        if: steps.public-auth.outputs.skip != '1'
        run: |
          git remote remove public >/dev/null 2>&1 || true
          git remote add public "$PUBLIC_REMOTE"
          git push public HEAD:refs/heads/main --force
