# Gitea-native deploy — runs on the self-hosted mac-mini runner (macos-arm64).
#
# Why this exists separately from .github/workflows/deploy.yml: the GitHub
# workflow targets `ubuntu-latest`, but the only ONLINE gitea runner
# (`mac-mini-kuri`) is `self-hosted`/`macos-arm64` host-mode. The CF Worker
# deploy is node/wrangler-based, so it runs natively on the mini with no Docker.
#
# Scope (honest): STAGING + experiments only. The prod (`main`) path in the
# GitHub workflow has a staging-first manifest gate that requires the
# cross-platform release artifacts; that still belongs on GitHub Actions / the
# RunPod ephemeral runner. This workflow proves gitea can deploy the backend to
# the safe (staging) target with the secrets that live on this box.
name: Gitea Mini Deploy

on:
  workflow_dispatch:
  push:
    # Tag push is the trigger that demonstrably fires on the self-hosted gitea
    # (the release flow runs from v* tags); branch-push / API-dispatch do not
    # materialize runs on this instance. A `deploy-staging-*` tag cuts a deploy.
    tags: ["deploy-staging-*", "deploy-experiments-*"]
    branches: [staging, "lewis/experiments"]

concurrency:
  group: gitea-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  # host-mode runner: Node's bundled CA can't verify some downloads; trust the system chain
  NODE_EXTRA_CA_CERTS: /etc/ssl/cert.pem

jobs:
  deploy-backend:
    name: Deploy Backend (CF Worker) — staging/experiments
    runs-on: [self-hosted, macos-arm64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ensure-submodules.sh submodules/kuri
        working-directory: .
      # host-mode runner already has bun (avoids the setup-bun download that fails TLS under Node 26)
      - run: bun --version
      - run: bun install --frozen-lockfile

      - name: Compute deploy identity vars
        id: vars
        working-directory: .
        run: |
          VERSION=$(node -e "console.log(require('./version.json').version)")
          BUILD_SHA="${GITHUB_SHA}"
          DEPLOYED_AT=$(date -u +%FT%TZ)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"
          echo "deployed_at=${DEPLOYED_AT}" >> "$GITHUB_OUTPUT"
          echo "deploy identity v=${VERSION} sha=${BUILD_SHA:0:8} at=${DEPLOYED_AT}"

      - name: Deploy backend worker (env from branch)
        run: |
          WRANGLER_VARS="--var UNBROWSE_VERSION:${{ steps.vars.outputs.version }} --var UNBROWSE_BUILD_SHA:${{ steps.vars.outputs.build_sha }} --var UNBROWSE_DEPLOYED_AT:${{ steps.vars.outputs.deployed_at }}"
          case "${GITHUB_REF_NAME}" in
            "lewis/experiments")
              ./node_modules/.bin/wrangler deploy --config wrangler.ci.toml --env experiments $WRANGLER_VARS ;;
            *)
              # default (incl. staging + workflow_dispatch): deploy the staging worker — never prod from gitea
              ./node_modules/.bin/wrangler deploy --config wrangler.ci.toml --env staging $WRANGLER_VARS ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Provision CAPZY_KEY secret (captcha /v1/solve tier)
        run: |
          if [ -z "$CAPZY_KEY" ]; then
            echo "CAPZY_KEY not set; skipping /v1/solve provisioning (route 503s solver_unconfigured)"; exit 0
          fi
          ENVFLAG="--env staging"; [ "${GITHUB_REF_NAME}" = "lewis/experiments" ] && ENVFLAG="--env experiments"
          printf '%s' "$CAPZY_KEY" | ./node_modules/.bin/wrangler secret put CAPZY_KEY --config wrangler.ci.toml $ENVFLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAPZY_KEY: ${{ secrets.CAPZY_KEY }}

      - name: Provision INTERNAL_AUTH_PASSWORD (dashboard telemetry read)
        run: |
          if [ -z "$INTERNAL_AUTH_PASSWORD" ]; then
            echo "INTERNAL_AUTH_PASSWORD not set; dashboard read stays __admin__-only"; exit 0
          fi
          ENVFLAG="--env staging"; [ "${GITHUB_REF_NAME}" = "lewis/experiments" ] && ENVFLAG="--env experiments"
          printf '%s' "$INTERNAL_AUTH_PASSWORD" | ./node_modules/.bin/wrangler secret put INTERNAL_AUTH_PASSWORD --config wrangler.ci.toml $ENVFLAG
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_AUTH_PASSWORD: ${{ secrets.INTERNAL_AUTH_PASSWORD }}

  # Host-adapted mirror of .github/workflows/deploy.yml `publish-preview-cli`.
  # Follows GitHub: ONLY the experiments channel ships a preview CLI to npm
  # (under the non-default `experiments` dist-tag, versioned <base>-experiments.<sha>,
  # default backend = the experiments Worker). A `deploy-staging-*` tag deploys the
  # backend only — same split as GitHub. No setup-bun/setup-node/setup-zig: the host
  # has bun/node/npm and the kuri binaries are VENDORED (no zig at pack time);
  # NODE_EXTRA_CA_CERTS is set at the runner env (the env block above also carries it).
  publish-preview-cli:
    name: Publish Preview CLI (npm) — experiments channel
    needs: [deploy-backend]
    runs-on: [self-hosted, macos-arm64]
    if: ${{ startsWith(github.ref_name, 'deploy-experiments-') || github.ref_name == 'lewis/experiments' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: bash scripts/ensure-submodules.sh submodules/kuri
      # macOS host CANNOT cross-compile the Linux kuri binaries (curl-impersonate
      # static libs won't link) — rebuilding here writes BROKEN placeholder stubs.
      # The repo already ships REAL committed binaries for all 5 platforms in
      # packages/skill/vendor/kuri. shouldRebuildVendoredKuri() only rebuilds when
      # manifest.source_sha != submodule HEAD, so pin the submodule to the vendored
      # sha → the committed binaries are used verbatim, no compile. (GitHub rebuilds
      # because it runs on Linux; the mini uses the vendored set instead.)
      - name: Use vendored kuri (pin submodule to manifest sha — no macOS cross-compile)
        run: |
          KURI_SHA=$(node -p "require('./packages/skill/vendor/kuri/manifest.json').source_sha")
          echo "vendored kuri source_sha=$KURI_SHA; pinning submodules/kuri to match (use committed binaries)"
          git -C submodules/kuri fetch --depth 1 origin "$KURI_SHA" 2>/dev/null \
            || git -C submodules/kuri fetch origin "$KURI_SHA" 2>/dev/null \
            || git -C submodules/kuri fetch --tags --prune origin 2>/dev/null || true
          if git -C submodules/kuri checkout -q "$KURI_SHA" 2>/dev/null; then
            echo "pinned submodules/kuri to $(git -C submodules/kuri rev-parse HEAD)"
          else
            echo "WARN: could not pin to $KURI_SHA; removing build.zig so prepack uses vendored binaries (sourceDir=null path)"
            rm -f submodules/kuri/build.zig
          fi
      - run: bun --version
      - run: bun install --frozen-lockfile

      - name: Set preview backend URL + version
        env:
          EXPERIMENTS_API_URL: ${{ secrets.EXPERIMENTS_API_URL }}
        run: |
          API_URL="${EXPERIMENTS_API_URL:-https://unbrowse-backend-experiments.lewis-6d8.workers.dev}"
          echo "UNBROWSE_BUILD_DEFAULT_BACKEND_URL=${API_URL}" >> "$GITHUB_ENV"
          BASE_VERSION=$(node -p 'require("./packages/skill/package.json").version')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | head -c 7)
          PREVIEW_VERSION="${BASE_VERSION}-experiments.${SHORT_SHA}"
          echo "PREVIEW_VERSION=${PREVIEW_VERSION}" >> "$GITHUB_ENV"
          node -e "const fs=require('fs');const v='${PREVIEW_VERSION}';for(const f of ['package.json','packages/skill/package.json']){const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=v;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n');}const vj=JSON.parse(fs.readFileSync('version.json','utf8'));vj.version=v;fs.writeFileSync('version.json',JSON.stringify(vj,null,2)+'\n');"
          echo "preview CLI version = ${PREVIEW_VERSION}; default backend = ${API_URL}"

      - name: Resolve npm token
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NODE_AUTH_TOKEN_INPUT: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          TOKEN="${NPM_TOKEN:-${NPM_PUBLISH_TOKEN:-${NODE_AUTH_TOKEN_INPUT:-}}}"
          if [ -z "$TOKEN" ]; then
            echo "no npm token configured; skipping preview publish"
            echo "skip_publish=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish preview CLI (npm dist-tag experiments — never latest)
        if: ${{ steps.npm-auth.outputs.skip_publish != '1' }}
        working-directory: packages/skill
        env:
          UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET: ${{ secrets.UNBROWSE_RELEASE_MANIFEST_SIGNING_SECRET }}
        run: |
          NPMRC="$(mktemp)"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "$NPMRC"
          export npm_config_userconfig="$NPMRC"
          # npm pack runs prepack (build runtime/sdk/manifest onto disk); publish ships
          # those artifacts with --ignore-scripts (skips prepublishOnly assert), exactly as GitHub does.
          npm pack
          npm publish --tag experiments --ignore-scripts
          rm -f "$NPMRC"
          echo "Published unbrowse@${PREVIEW_VERSION} (dist-tag: experiments)"
