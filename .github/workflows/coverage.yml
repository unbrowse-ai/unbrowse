# Runners (UNB-166): every job runs on the local pool's [self-hosted, linux, x64] slots, behind the same-repository guard.
# Line coverage of every part the promotion gate reads (UNB-208): the Rust workspaces and both SDKs, and the contracts
# reported apart. On a pull request it posts the numbers (one comment, kept up to date), and its ratchet job blocks the
# merge when a gated part falls below staging or the lines the pull request adds or changes are under 98% covered
# (Lewis, 18 Nov 2026: a hard block). 98% of a whole part is the bar for promoting staging to public (release.yml's
# promotion gate), not for a pull request.
#
# Each part runs in a job of its own, beside CI rather than after it, so the wait for a pull request's checks is the
# longest single job, not the sum. The summary of a push to staging or a release branch is kept as the artifact
# `coverage-summary-<tree>`, which the promotion gate fetches by the tree it is about to ship.
#
# On a pull request a part runs only when a changed file can reach it (the `scope` job, by ci.yml's own table,
# .github/scripts/ci-scope.py): a part left out is as staging has it, and the ratchet is told so. A push measures
# every part, since the promotion gate reads its summary.
#
# The browser's engine and CLI are tested once on Linux, here: these two jobs are the test run as well as the
# measurement, and fail when a test fails (ci.yml's `engine` job ran the same tests a second time, 21.8 of a push's 130
# Linux minutes, UNB-166; it now runs only for the events this workflow doesn't). For the node, CI's macOS job is still
# what says the tests pass: one that fails here is counted on the run's summary and the coverage of what ran is kept.
# Nothing here holds a secret.
name: Coverage

on:
  push:
    branches: [staging, "release/**"]
  pull_request:
    branches: [staging, "release/**", main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_LLVM_COV: 0.9.1

jobs:
  # The same job as ci.yml's `scope`, without the passes on record: which parts a pull request's changed files reach.
  # A push or a manual run reaches every part, and a part runs if this job fails.
  scope:
    permissions:
      contents: read
      pull-requests: read
    name: What this change reaches (coverage)
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      settlement: ${{ steps.scope.outputs.settlement }}
      engine: ${{ steps.scope.outputs.engine }}
      node: ${{ steps.scope.outputs.node }}
      window: ${{ steps.scope.outputs.window }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci-scope.py
          sparse-checkout-cone-mode: false
      # Local runner pool (UNB-166): installs what a hosted image gave the job, if the pool's image lacks it.
      # Skipped on hosted runners.
      - name: Tools the local runner may lack
        if: runner.environment == 'self-hosted' && !startsWith(runner.name, 'blacksmith-')
        run: dpkg -s gh > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq gh > /dev/null; }
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          complete=true
          : > changed.txt
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
              --jq '.[] | "f \(.filename)", (.previous_filename // empty | "p \(.)")' > listed.txt || complete=false
            [ "$(grep -c '^f ' listed.txt || true)" -ge "$CHANGED" ] || complete=false
            cut -c3- listed.txt > changed.txt
          fi
          python3 -I .github/scripts/ci-scope.py --event "$EVENT" --complete "$complete" < changed.txt 2> why.txt >> "$GITHUB_OUTPUT"
          cat why.txt
          { echo "### What this change reaches"; sed 's/^/- /' why.txt; } >> "$GITHUB_STEP_SUMMARY"

  rust-node:
    permissions:
      contents: read
    name: Coverage, node
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.node == 'true')) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 75
    env:
      AGENT_BROWSER_NO_SANDBOX: "1"
    defaults:
      run:
        working-directory: unbrowse-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Local runner pool (UNB-166): installs what a hosted image gave the job, if the pool's image lacks it. Each
      # workspace's target/ lives in the pool's shared cache, so rust-cache is skipped there. Skipped on hosted runners.
      - name: Tools and cargo cache on the local runner pool
        if: runner.environment == 'self-hosted' && !startsWith(runner.name, 'blacksmith-')
        working-directory: ${{ github.workspace }}
        run: |
          dpkg -s build-essential pkg-config libssl-dev libdbus-1-dev libudev-dev cmake clang libclang-dev perl xz-utils zstd > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config libssl-dev libdbus-1-dev libudev-dev cmake clang libclang-dev perl xz-utils zstd > /dev/null; }
          for w in unbrowse-node unbrowse-browser/cli; do
            d="$STEAM_MACHINE_CARGO_TARGET_DIR/$(echo "$w" | tr / -)"
            mkdir -p "$d" && ln -sfn "$d" "$w/target"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor
        with:
          path: unbrowse-node/vendor
          key: btls-sys-${{ runner.os }}-${{ hashFiles('unbrowse-node/scripts/apply-tls-patch.sh', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-ext.patch', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-pss.patch', 'unbrowse-node/crates/learn/assets/chrome-clienthello/chrome-grease-sigalg.patch') }}
      - if: steps.vendor.outputs.cache-hit != 'true'
        run: sh scripts/apply-tls-patch.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: (runner.environment != 'self-hosted' || startsWith(runner.name, 'blacksmith-'))
        with:
          prefix-key: coverage
          workspaces: |
            unbrowse-node -> target
            unbrowse-browser/cli -> target
      - run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV"
      # The learner's end-to-end tests drive the real browser (ci.yml's node job does the same).
      - name: Build the browser
        working-directory: unbrowse-browser/cli
        run: cargo build --locked && ./target/debug/agent-browser install
      - name: Tests, measured
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          cargo llvm-cov --workspace --locked --no-fail-fast --no-report > "$RUNNER_TEMP/cov/rust-node.log" 2>&1 || echo "::warning::some node tests failed under coverage: see the log artifact"
          # The primitive matrix's rows walk their page in the real browser built above, so plain `cargo test` skips
          # them (`#[ignore]`). Only the person row runs here: the other rows serve their pages on 127.0.0.1, which the
          # browser proxy refuses (learn's proxy::browser_may_reach), and the app's test build has no fixture allowance,
          # so they fail on staging too (UNB-208; run 44301275301 named them).
          cargo llvm-cov -p unbrowse-node-app --bin unbrowse-node --locked --no-fail-fast --no-report -- --ignored --test-threads=1 \
            primitives::tests::every_person_row_asks_the_owner_and_never_runs_headless >> "$RUNNER_TEMP/cov/rust-node.log" 2>&1 || echo "::warning::a primitive-matrix row failed under coverage: see the log artifact"
          cargo llvm-cov --locked -p unbrowse-node-app --bin unbrowse-node --no-fail-fast --no-report -- --ignored --test-threads=1 the_live_view_follows_the_page_to_another_site >> "$RUNNER_TEMP/cov/rust-node.log" 2>&1 || echo "::warning::the live view test failed under coverage"
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/cov/rust-node.json"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/cov/rust-node.lcov"
          grep -E '^test result:' "$RUNNER_TEMP/cov/rust-node.log" | awk '{p+=$4; f+=$6; i+=$8} END {print "node tests under coverage: " p " passed, " f " failed, " i " ignored"}' | tee "$RUNNER_TEMP/cov/rust-node.tests"
      # The behaviour suite alone (.github/behaviour.json): the tests that ask the node as an agent does and assert the
      # reply. Whole-suite coverage counts a line any test ran; this counts the lines a behaviour test ran, which is what
      # #574 lacked (every line it changed was covered, and the second value of four live sites regressed). The whole
      # suite's reports are written above, so its profiles are cleared and the same build runs the suite again alone.
      - name: Behaviour suite, measured alone
        run: |
          cargo llvm-cov clean --workspace --profraw-only
          set -- $(python3 -I -c 'import json; print(" ".join(json.load(open("../.github/behaviour.json"))["tests"]))')
          cargo llvm-cov -p unbrowse-node-app --bin unbrowse-node --locked --no-fail-fast --no-report -- --exact "$@" \
            > "$RUNNER_TEMP/cov/behaviour.log" 2>&1 || echo "::warning::a behaviour test failed under coverage: see behaviour.log"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/cov/behaviour.lcov"
          grep -E '^test result:' "$RUNNER_TEMP/cov/behaviour.log" | tee "$RUNNER_TEMP/cov/behaviour.tests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-rust-node
          path: ${{ runner.temp }}/cov/
          retention-days: 14

  rust-browser:
    permissions:
      contents: read
    name: Coverage, browser (${{ matrix.part }})
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.engine == 'true')) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # The engine (6 minutes on staging 549788a0) and the CLI (15) side by side: one job ran both, 21.5 minutes, the
    # longest check of a push (UNB-235). Each writes its own files, and the report reads both by the cov-* pattern.
    strategy:
      fail-fast: false
      matrix:
        part: [core, cli]
    env:
      AGENT_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Local runner pool (UNB-166): installs what a hosted image gave the job, if the pool's image lacks it. Each
      # workspace's target/ lives in the pool's shared cache, so rust-cache is skipped there. Skipped on hosted runners.
      - name: Tools and cargo cache on the local runner pool
        if: runner.environment == 'self-hosted' && !startsWith(runner.name, 'blacksmith-')
        run: |
          dpkg -s build-essential pkg-config libssl-dev libdbus-1-dev libudev-dev cmake clang libclang-dev perl xz-utils zstd > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq build-essential pkg-config libssl-dev libdbus-1-dev libudev-dev cmake clang libclang-dev perl xz-utils zstd > /dev/null; }
          for w in unbrowse-node/crates/browser unbrowse-browser/cli; do
            d="$STEAM_MACHINE_CARGO_TARGET_DIR/$(echo "$w" | tr / -)"
            mkdir -p "$d" && ln -sfn "$d" "$w/target"
          done
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      # One cache for both halves (a matrix shares the job's id), saved by the longer CLI half; the engine half restores
      # the dependencies it shares.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: (runner.environment != 'self-hosted' || startsWith(runner.name, 'blacksmith-'))
        with:
          prefix-key: coverage
          save-if: ${{ matrix.part == 'cli' }}
          workspaces: |
            unbrowse-node/crates/browser -> target
            unbrowse-browser/cli -> target
      - run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV"
      - name: Engine tests, measured
        if: matrix.part == 'core'
        working-directory: unbrowse-node/crates/browser
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          log="$RUNNER_TEMP/cov/rust-browser-core.log"
          status=0
          cargo llvm-cov --locked --no-fail-fast --no-report > "$log" 2>&1 || { status=1; echo "::error::an engine test failed"; }
          # The walks in a real browser (the runner's Chrome), one at a time: what a walk records, that it hears every
          # frame and worker, how it refuses, hands off and hides the launch mode. `#[ignore]`d because they need a
          # browser; a walk that can't start its browser fails (UNB-208).
          cargo llvm-cov --locked --no-fail-fast --no-report -- --ignored --test-threads=1 --skip windows_process >> "$log" 2>&1 || { status=1; echo "::error::an engine walk failed"; }
          # The coverage of what ran is kept either way; the failures are printed here, and the whole log is in the artifact.
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/cov/rust-browser-core.json"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/cov/rust-browser-core.lcov"
          grep -aE '^test result:|^test .* FAILED$|^---- .* stdout ----$|panicked at' "$log" | tail -n 80
          exit "$status"
      # Upstream's own suite, as upstream runs it, plus the fork's module (`cli/src/native/unbrowse/`).
      - name: CLI tests, measured
        if: matrix.part == 'cli'
        working-directory: unbrowse-browser/cli
        # The stack ci.yml's CLI tests run with: instrumented, test_a_confirmed_launch_keeps_the_allowed_domains_it_was_parked_with
        # overflowed the default 8 MiB and its abort took every later test of the binary with it (run 44912667286).
        env:
          RUST_MIN_STACK: "16777216"
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          log="$RUNNER_TEMP/cov/rust-browser-cli.log"
          status=0
          cargo llvm-cov --locked --no-fail-fast --no-report > "$log" 2>&1 || { status=1; echo "::error::a CLI test failed"; }
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/cov/rust-browser-cli.json"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/cov/rust-browser-cli.lcov"
          grep -aE '^test result:|^test .* FAILED$|^---- .* stdout ----$|panicked at' "$log" | tail -n 80
          exit "$status"
      # Kept when a test failed too: the report and the ratchet read what ran.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cov-rust-browser-${{ matrix.part }}
          path: ${{ runner.temp }}/cov/
          retention-days: 14

  sdk-typescript:
    permissions:
      contents: read
    name: Coverage, TypeScript SDK
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: unbrowse-sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: unbrowse-sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      # Built with source maps, so the lines counted are src/'s; --all counts a file no test loads as 0%.
      - run: npm run build -- --sourceMap
      - name: Tests, measured
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          npx --yes c8@10.1.3 --all --src src --reporter=json --reporter=text-summary \
            --report-dir "$RUNNER_TEMP/cov/ts" node --test --test-timeout=10000 test/*.test.mjs
          mv "$RUNNER_TEMP/cov/ts/coverage-final.json" "$RUNNER_TEMP/cov/sdk-typescript.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-sdk-typescript
          path: ${{ runner.temp }}/cov/sdk-typescript.json
          retention-days: 14

  sdk-python:
    permissions:
      contents: read
    name: Coverage, Python SDK
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: unbrowse-sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13.18
      # With the framework adapters' extras, so their tests run too (ci.yml runs them in a step of their own).
      - run: python -m pip install "coverage==7.17.3" ".[langchain,openai-agents]" "langchain-core==1.6.12" "openai-agents==0.24.0"
      - name: Tests, measured
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          python -m coverage run --source=src/unbrowse -m unittest discover -s tests
          python -m coverage json -o "$RUNNER_TEMP/cov/sdk-python.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-sdk-python
          path: ${{ runner.temp }}/cov/sdk-python.json
          retention-days: 14

  settlement:
    # Reported apart, never gating. Coverage mode compiles with --ir-minimum, where nine tests fail that pass in
    # ci.yml's `forge test` (17 Nov 2026), and full fuzz and invariant runs pass 25 minutes: so few runs here, and the
    # judging of the contracts stays with ci.yml. The contracts' sources are private (`.github/public-tree-exclude`).
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && github.repository == 'unbrowse-ai/unbrowse-core' && (needs.scope.result != 'success' || needs.scope.outputs.settlement == 'true')) }}
    permissions:
      contents: read
    name: Coverage, settlement (reported apart)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    continue-on-error: true
    env:
      FOUNDRY_VERSION: v1.8.5
      FOUNDRY_FUZZ_RUNS: "16"
      FOUNDRY_INVARIANT_RUNS: "4"
    defaults:
      run:
        working-directory: unbrowse-settlement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Tests, measured
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          forge coverage --ir-minimum --report lcov --report-file "$RUNNER_TEMP/cov/settlement.info" > "$RUNNER_TEMP/cov/settlement.log" 2>&1 || echo "::warning::forge coverage reported failures (coverage-mode artefacts are known): see the log"
          tail -n 5 "$RUNNER_TEMP/cov/settlement.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-settlement
          path: ${{ runner.temp }}/cov/
          retention-days: 14

  window:
    # The Zig window, reported apart and never gating (UNB-208): its tests built by LLVM (`zig build test-bin`), run
    # under kcov, its own sources only (tests.zig and the nanoui dependency left out). ci.yml's macOS job is what
    # says the tests pass; a test that fails here on Linux is counted in the log and the coverage of what ran is kept.
    permissions:
      contents: read
    name: Coverage, window (reported apart)
    needs: scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.window == 'true')) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # A local slot unpacks zig once into its own tool cache; that first unpack took 15 minutes on the pool's USB drive.
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        working-directory: unbrowse-node/window
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Tests, measured
        run: |
          zig build test-bin
          mkdir -p "$RUNNER_TEMP/cov" "$RUNNER_TEMP/kcov"
          w="$PWD"
          # The local pool's image carries kcov (a slot has no docker daemon); elsewhere it runs from the kcov image.
          if command -v kcov > /dev/null; then
            kcov --include-path="$w/src" --exclude-pattern=tests.zig "$RUNNER_TEMP/kcov" "$w/zig-out/bin/window-tests" \
              > "$RUNNER_TEMP/cov/window.log" 2>&1 || echo "::warning::window tests reported failures under kcov: see the log"
          else
            docker run --rm --security-opt seccomp=unconfined -v "$w:$w" -v "$RUNNER_TEMP/kcov:/out" -w "$w" \
              docker.io/kcov/kcov@sha256:5c61bd03d2b7f4fa74131b18e4e80356a92a7517872b5b9a505022c38cd6d123 \
              kcov --include-path="$w/src" --exclude-pattern=tests.zig /out "$w/zig-out/bin/window-tests" \
              > "$RUNNER_TEMP/cov/window.log" 2>&1 || echo "::warning::window tests reported failures under kcov: see the log"
          fi
          tail -n 3 "$RUNNER_TEMP/cov/window.log"
          sudo cp "$(ls "$RUNNER_TEMP"/kcov/window-tests.*/coverage.json | head -n 1)" "$RUNNER_TEMP/cov/window.json"
          sudo chown "$(id -u)" "$RUNNER_TEMP/cov/window.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-window
          path: ${{ runner.temp }}/cov/
          retention-days: 14

  report:
    # The numbers per part, the promotion gate's verdict on them, and the summary the gate fetches. A part whose job
    # failed is UNMEASURED, which the gate refuses; one the scope job left out of a pull request is said to be not run.
    needs: [scope, rust-node, rust-browser, sdk-typescript, sdk-python, settlement, window]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled()) }}
    permissions:
      contents: read
    name: Coverage, per part
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cov-*
          merge-multiple: true
          path: ${{ runner.temp }}/cov
      - name: Summarise
        id: tree
        env:
          NODE: ${{ needs.scope.outputs.node }}
          ENGINE: ${{ needs.scope.outputs.engine }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/summary"
          c="$RUNNER_TEMP/cov"
          # The parts the scope job left out (its output is the word `false`; a scope job that failed left none out).
          set --
          [ "$NODE" != false ] || set -- "$@" --not-reached rust:unbrowse-node
          [ "$ENGINE" != false ] || set -- "$@" --not-reached rust:browser-core --not-reached rust:browser-cli
          python3 -I .github/scripts/promotion_gate.py coverage --root "$GITHUB_WORKSPACE" "$@" \
            --llvm "rust:unbrowse-node=$c/rust-node.json" --llvm "rust:browser-core=$c/rust-browser-core.json" \
            --llvm "rust:browser-cli=$c/rust-browser-cli.json" --istanbul "sdk:typescript=$c/sdk-typescript.json" \
            --coveragepy "sdk:python=$c/sdk-python.json" --lcov "settlement=$c/settlement.info" \
            --exclusions docs/COVERAGE-EXCLUSIONS.md --commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/summary/coverage-summary.json" --md "$RUNNER_TEMP/summary/table.md" 2>&1 || true
      - name: The promotion gate on these numbers
        run: |
          s="$RUNNER_TEMP/summary"
          python3 -I .github/scripts/promotion_gate.py check --coverage-only --coverage "$s/coverage-summary.json" --md "$s/gate.md" || true
          {
            echo "<!-- unbrowse-coverage -->"
            echo "### Line coverage (UNB-208)"
            echo
            echo "Commit \`${GITHUB_SHA::8}\`, tree \`${{ steps.tree.outputs.tree }}\`. Promotion to public needs 98% in every gated part. A pull request is blocked by the ratchet below: no gated part may fall below staging, and the lines it adds or changes in a gated part are 98% covered."
            echo
            cat "$s/table.md"
            echo
            cat "$RUNNER_TEMP/cov/rust-node.tests" 2>/dev/null || echo "node tests under coverage: UNMEASURED"
            echo
            echo "Promotion gate, coverage rules only:"
            echo
            cat "$s/gate.md"
            echo
            echo "Exclusions: [docs/COVERAGE-EXCLUSIONS.md](../blob/${GITHUB_SHA}/docs/COVERAGE-EXCLUSIONS.md). $(python3 -I .github/scripts/window_coverage.py "$RUNNER_TEMP/cov/window.json")"
          } > "$s/comment.md"
          cat "$s/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/summary/
          retention-days: 90
      # Every gated part this change reaches has a measurement: one with no line run is a job that failed, not a number.
      - name: Every gated part was measured
        env:
          NODE: ${{ needs.scope.outputs.node }}
          ENGINE: ${{ needs.scope.outputs.engine }}
        run: |
          python3 -c '
          import json, os, sys
          sys.path.insert(0, ".github/scripts")
          import promotion_gate as g
          s = json.load(open(sys.argv[1]))
          out = {"rust:unbrowse-node"} if os.environ["NODE"] == "false" else set()
          out |= {"rust:browser-core", "rust:browser-cli"} if os.environ["ENGINE"] == "false" else set()
          missing = [p for p in g.GATED_PARTS if p not in out and not g._measured(s["parts"].get(p))]
          for p in missing:
              print(f"::error::coverage: {p} UNMEASURED")
          sys.exit(1 if missing else 0)
          ' "$RUNNER_TEMP/summary/coverage-summary.json"

  ratchet:
    # The check that blocks a pull request (UNB-208; Lewis, 18 Nov 2026: a hard block, not a report). It refuses when a
    # gated part falls below staging, or when the lines the pull request adds or changes in a gated part are under 98%
    # covered, and prints the part and the files. It runs whenever the report ran, even after a part's job failed or
    # was skipped: that part is UNMEASURED, which refuses. "Coverage, ratchet" is a required check on staging once Lewis
    # sets it in branch protection. It holds no secret and writes nothing; what it downloads (staging's summaries and
    # this run's reports) is JSON and text, read by the checkout's own script.
    needs: [scope, report]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && github.event_name == 'pull_request') }}
    permissions:
      contents: read
      actions: read
    name: Coverage, ratchet
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 50
      # Local runner pool (UNB-166): installs what a hosted image gave the job, if the pool's image lacks it.
      # Skipped on hosted runners.
      - name: Tools the local runner may lack
        if: runner.environment == 'self-hosted' && !startsWith(runner.name, 'blacksmith-')
        run: dpkg -s gh > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq gh > /dev/null; }
      # A report that is missing leaves its part UNMEASURED, which the ratchet refuses: so a failed download is not a
      # failed step here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: cov-*
          merge-multiple: true
          path: ${{ runner.temp }}/cov
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: coverage-summary-*
          merge-multiple: true
          path: ${{ runner.temp }}/summary
      # The checkout is the merge of the pull request into its base: its first parent is staging as the pull request
      # would land on it, and the diff between them is what the pull request adds or changes.
      - name: Staging's numbers, and the lines this pull request adds or changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --unified=0 --no-color --find-renames --src-prefix=a/ --dst-prefix=b/ HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          sh .github/scripts/coverage-base.sh HEAD^1 "$RUNNER_TEMP/base" > "$RUNNER_TEMP/base.list"
          cat "$RUNNER_TEMP/base.list"
      - name: The ratchet
        env:
          NODE: ${{ needs.scope.outputs.node }}
          ENGINE: ${{ needs.scope.outputs.engine }}
        run: |
          c="$RUNNER_TEMP/cov"
          mkdir -p "$RUNNER_TEMP/ratchet"
          set --
          while read -r f; do set -- "$@" --base "$f"; done < "$RUNNER_TEMP/base.list"
          # A part the scope job left out is as staging has it; a diff that touches it all the same is refused.
          [ "$NODE" != false ] || set -- "$@" --not-reached rust:unbrowse-node
          [ "$ENGINE" != false ] || set -- "$@" --not-reached rust:browser-core --not-reached rust:browser-cli
          status=0
          python3 -I .github/scripts/promotion_gate.py ratchet --root "$GITHUB_WORKSPACE" \
            --head "$RUNNER_TEMP/summary/coverage-summary.json" "$@" --diff "$RUNNER_TEMP/pr.diff" \
            --lcov "rust:unbrowse-node=$c/rust-node.lcov" --lcov "rust:browser-core=$c/rust-browser-core.lcov" \
            --lcov "rust:browser-cli=$c/rust-browser-cli.lcov" --istanbul "sdk:typescript=$c/sdk-typescript.json" \
            --coveragepy "sdk:python=$c/sdk-python.json" --exclusions docs/COVERAGE-EXCLUSIONS.md \
            --md "$RUNNER_TEMP/ratchet/ratchet.md" || status=$?
          { echo "### Coverage ratchet"; echo; cat "$RUNNER_TEMP/ratchet/ratchet.md"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "::error::coverage ratchet refused: see the REFUSE lines above"; fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-ratchet
          path: ${{ runner.temp }}/ratchet/
          retention-days: 14

  # The one line a person or an agent watching the run looks for (UNB-235): every coverage job passed or was left out by
  # the scope job, the report measured every gated part it reached, and on a pull request the ratchet passed.
  verdict:
    needs: [scope, rust-node, rust-browser, sdk-typescript, sdk-python, settlement, window, report, ratchet, behaviour]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled()) }}
    permissions: {}
    name: Coverage verdict
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Every coverage job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<< "$RESULTS")
          [ -z "$bad" ] || { echo "::error::coverage jobs that did not pass: $bad"; exit 1; }
          [ "$(jq -r .report.result <<< "$RESULTS")" = success ] || { echo "::error::the report did not run"; exit 1; }
          if [ "$EVENT" = pull_request ]; then
            [ "$(jq -r .ratchet.result <<< "$RESULTS")" = success ] || { echo "::error::the ratchet did not run"; exit 1; }
          fi
          echo "COVERAGE_OK event=$EVENT sha=${GITHUB_SHA::8}"

  behaviour:
    # Behaviour coverage (.github/scripts/behaviour_coverage.py): of the lines this pull request adds or changes on the
    # node's serving path (.github/behaviour.json), the share the behaviour suite ran, which must reach the config's
    # floor; every listed behaviour test must pass; and a run where none of the path ran is UNMEASURED, which refuses.
    # It reads the node job's reports and holds no secret. A pull request no file of which reaches the node has no line
    # on the serving path, and the node job did not run: this is left out with it.
    needs: [scope, rust-node]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.node == 'true')) }}
    permissions:
      contents: read
    name: Coverage, behaviour
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: cov-rust-node
          path: ${{ runner.temp }}/cov
      - name: The serving path, as the behaviour suite ran it
        run: |
          c="$RUNNER_TEMP/cov"
          mkdir -p "$RUNNER_TEMP/behaviour"
          set --
          # On a pull request the checkout is its merge into the base: the first parent is the base as it would land.
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --unified=0 --no-color --find-renames --src-prefix=a/ --dst-prefix=b/ HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
            set -- --diff "$RUNNER_TEMP/pr.diff"
          fi
          status=0
          python3 -I .github/scripts/behaviour_coverage.py --config .github/behaviour.json --root "$GITHUB_WORKSPACE" \
            --lcov "$c/behaviour.lcov" --log "$c/behaviour.log" "$@" \
            --out "$RUNNER_TEMP/behaviour/behaviour.json" --md "$RUNNER_TEMP/behaviour/behaviour.md" || status=$?
          { echo "### Behaviour coverage"; echo; cat "$RUNNER_TEMP/behaviour/behaviour.md"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then echo "::error::behaviour coverage refused: see the REFUSE lines above"; fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-behaviour
          path: ${{ runner.temp }}/behaviour/
          retention-days: 14

  comment:
    # The table on the pull request: one comment, edited on every run, with the ratchet's verdict under it. It reads the
    # comment from the artifacts as text and runs nothing from them. A fork's pull request has no write token here, and
    # the step summary still has it.
    needs: [report, ratchet]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!cancelled() && github.event_name == 'pull_request') }}
    permissions:
      pull-requests: write
    name: Coverage, on the pull request
    runs-on: blacksmith-2vcpu-ubuntu-2404
    continue-on-error: true
    steps:
      # Local runner pool (UNB-166): installs what a hosted image gave the job, if the pool's image lacks it.
      # Skipped on hosted runners.
      - name: Tools the local runner may lack
        if: runner.environment == 'self-hosted' && !startsWith(runner.name, 'blacksmith-')
        run: dpkg -s gh > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq gh > /dev/null; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/summary
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/summary/comment.md" > "$body"
          { echo; echo "Coverage ratchet (blocks the merge):"; echo; cat "$RUNNER_TEMP/summary/ratchet.md" 2>/dev/null || echo "UNMEASURED: the ratchet wrote no verdict"; } >> "$body"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- unbrowse-coverage -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" > /dev/null
          fi
