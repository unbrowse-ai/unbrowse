name: contree-smoke

# Validates the full contree-runner loop: workflow dispatch -> contree-labeled
# runner (a Nebius microVM spawned by scripts/contree-runner.py) picks up the
# job -> executes basic steps -> result reported back to GitHub.
#
# Run sequence:
#   1. gh workflow run contree-smoke          # job queues waiting for `contree` runner
#   2. scripts/contree-runner.py              # spawns microVM, registers as label=contree, picks up job
#   3. gh run watch <run-id>                  # see it go green

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/contree-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: contree
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Basic exec check
        run: |
          echo "hello from contree runner"
          echo "runner OS: $(uname -s)"
          echo "runner arch: $(uname -m)"
          echo "runner kernel: $(uname -r)"
          cat /etc/os-release | head -3

      - name: Toolchain check
        run: |
          echo "git: $(git --version)"
          echo "python3: $(python3 --version 2>&1)"
          echo "node: $(node --version 2>&1 || echo 'not installed')"
          echo "pip3: $(pip3 --version 2>&1 || echo 'not installed')"

      - name: Contree runner green
        run: echo "SMOKE GREEN — contree runner picked up job, executed steps, reporting back to GitHub"
