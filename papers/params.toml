# Unbrowse protocol parameters: every normative number, once.
#
# Written from the design graph (unbrowse-ai/unbrowse-graph): one entry per live `param.*` node, its value, unit and
# status copied from the node, never set here. A token number changes only on Lewis's written word, in the graph first.
# Superseded param nodes are left out. The spec (protocol/spec/*.md) names these as {{key}}, {{key:n}} or {{key:pct}}.
#
# Fields:
#   v       the value. Shares are fractions (0.65), never percentages. "not set" when the node is open.
#   unit    UNB | USDC | share | count | epochs | months | hours | minutes | blocks | bps | ratio | text
#   status  the node's papers_status:
#           constant  fixed in the immutable contracts; a change is a new deployment
#           launch    set for launch; the pilot may tune it
#           proposed  the graph node is proposed: to be fixed before launch
#           open      the graph node is open: not set; Lewis decides (spec Annex B)
#           client    a client or index-node default, not enforced on-chain
#   since   date decided or first recorded (YYYY-MM-DD)
#   src     the decision it came from: spec section (notes/unb-spec.md) and the graph node
#   node    the graph node id, and its graph status (graph)
#   token   true for a token number (allocations, locks, taxes, fee splits, prices, caps, emission)
#   old     the old value of an open token number, shown, never recomputed
#   lean    optional: Lean names that use it (checked to exist in formal/)
#   calc    optional: calc/params.toml key holding the same value (checked); calc_note excuses a known difference
#   desc    one line: what it is

