description: |
  Self-improving unbrowse MCP that reverse-engineers websites down to the JS dependency
  chain, retrieves and executes captured operations under minimal runtime (headless first,
  headful fallback only when learning), replays for different query types, and ships
  improvements through a dev-time hot-swap proxy workbench installed in .claude/mcps so
  Claude Code can reload it without restarting the session.

  The workbench itself is HARNESS, not product: a proxy MCP that sits between Claude Code
  and the unbrowse daemon, A/B-tests candidate-vs-baseline MCP builds against the bench
  corpus, and signals which build is shipping today's improvement. The product is the
  unbrowse MCP's evolving capability surface.

