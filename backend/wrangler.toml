name = "unbrowse-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Wrangler v3 routes module workers with KV bindings through the newer
# /versions API, which currently rejects our CI token without KV write perms.
# `first_party_worker` disables that code path in Wrangler v3 and keeps deploys
# on the legacy PUT /workers/scripts/:name endpoint instead.
first_party_worker = true

[triggers]
crons = ["17 */6 * * *"]

# Secrets (set via `wrangler secret put`):
#   EMERGENTDB_API_KEY, NEBIUS_API_KEY, API_KEY, FAL_KEY, TURBOBOX_URL,
#   RESEND_API_KEY, CASCADE_SIGNER_SECRET_KEY, CLOUDFLARE_API_TOKEN
#   EXA_API_KEY  — Exa web search, optional; resolve still works without it
#   ADMIN_KEY  — gates /v1/admin/* read surfaces (sponsor-ledger).
#                NEVER put the value in this file or any committed env file —
#                always `wrangler secret put ADMIN_KEY` (per env if needed).
#   PLATFORM_SPONSOR_WALLET_KEY  — signer for the sponsor wallet binding
#                                  set in [vars] below. Both must be set
#                                  for sponsor mode to enable.

[vars]
ENVIRONMENT = "production"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "true"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
# v6.15.0 — sponsor wallet bindings; key is a secret (wrangler secret put PLATFORM_SPONSOR_WALLET_KEY).
PLATFORM_SPONSOR_WALLET_ADDRESS = ""
SPONSOR_CAP_DAILY_USD = "1.0"
SPONSOR_GLOBAL_DAILY_USD = "50.0"

# --- Staging environment ---
# Deploy: wrangler deploy --env staging
# Secrets: wrangler secret put EMERGENTDB_API_KEY --env staging (etc.)
# Uses dedicated staging KV namespace ids (provisioned 2026-05-12). Until then
# this block reused the prod STATS_KV id and silently routed staging analytics
# writes into prod KV.
[env.staging]
name = "unbrowse-backend-staging"
workers_dev = true
routes = []

# Dedicated staging STATS_KV — provisioned 2026-05-12 via
# `wrangler kv namespace create STATS_KV --env staging` (+ --preview).
[[env.staging.kv_namespaces]]
binding = "STATS_KV"
id = "195ca099811f4f6fbdae268d72ce2034"
preview_id = "f4fe69f30a3c47008a627113a505f38b"

[env.staging.vars]
ENVIRONMENT = "staging"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "true"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
# v6.15.0 — sponsor wallet bindings; key is a secret (wrangler secret put PLATFORM_SPONSOR_WALLET_KEY --env staging).
PLATFORM_SPONSOR_WALLET_ADDRESS = ""
SPONSOR_CAP_DAILY_USD = "1.0"
SPONSOR_GLOBAL_DAILY_USD = "50.0"

# --- Lewis experiments environment ---
# Deploy: wrangler deploy --env experiments
# Secrets: wrangler secret put EMERGENTDB_API_KEY --env experiments (etc.)
# Public surface stays on workers.dev so this branch can be used as an isolated sandbox.
[env.experiments]
name = "unbrowse-backend-experiments"
workers_dev = true
routes = []

[[env.experiments.kv_namespaces]]
binding = "STATS_KV"
id = "1d315d7cda1742b785cf5d23c892c5d7"
preview_id = "edcbdb23e34c4244bf8cf28eb404d069"

[env.experiments.vars]
ENVIRONMENT = "staging"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "false"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
