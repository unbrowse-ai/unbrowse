# --- gate-staging environment (MCP release-gate harness uses this) ---
# Deploy: wrangler deploy --env gate-staging
# Provision STATS_KV first: wrangler kv namespace create STATS_KV --env gate-staging  (and --preview)
#          wrangler secret put EMERGENTDB_API_KEY --env gate-staging  (fallback)
# Isolation: ENVIRONMENT="gate-staging" routes marketplace writes to PgKV ns "gate-staging-skills-v3"
#            and stats writes to "gate-staging-stats" via backend/src/services/kv.ts.
[env.gate-staging]
name = "unbrowse-backend-gate-staging"
workers_dev = true
routes = []

