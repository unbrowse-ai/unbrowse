name = "unbrowse-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Wrangler v3 routes module workers with KV bindings through the newer
# /versions API, which currently rejects our CI token without KV write perms.
# `first_party_worker` disables that code path in Wrangler v3 and keeps deploys
# on the legacy PUT /workers/scripts/:name endpoint instead.
first_party_worker = true

[triggers]
crons = ["17 */6 * * *"]

# Secrets (set via `wrangler secret put`):
#   EMERGENTDB_API_KEY, NEBIUS_API_KEY, API_KEY, FAL_KEY, TURBOBOX_URL,
#   RESEND_API_KEY, CASCADE_SIGNER_SECRET_KEY, CLOUDFLARE_API_TOKEN
#   NEBIUS_API_KEY  — also drives the publish-time LLM PII scrubber
#                     (backend/src/services/ai-scrub.ts, contract 101b1f77).
#                     Soft-fails if unset; the regex layer remains authoritative.
#   EXA_API_KEY  — Exa web search, optional; resolve still works without it
#   ADMIN_KEY  — gates /v1/admin/* read surfaces (sponsor-ledger).
#                NEVER put the value in this file or any committed env file —
#                always `wrangler secret put ADMIN_KEY` (per env if needed).
#   PLATFORM_SPONSOR_WALLET_KEY  — signer for the sponsor wallet binding
#                                  set in [vars] below. Both must be set
#                                  for sponsor mode to enable.

[vars]
ENVIRONMENT = "production"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "true"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
# v6.15.0 — sponsor wallet bindings; key is a secret (wrangler secret put PLATFORM_SPONSOR_WALLET_KEY).
PLATFORM_SPONSOR_WALLET_ADDRESS = ""
SPONSOR_CAP_DAILY_USD = "1.0"
SPONSOR_GLOBAL_DAILY_USD = "50.0"
# Privy app id (public). Same value as NEXT_PUBLIC_PRIVY_APP_ID on the
# frontend (frontend/src/lib/privy-provider.tsx, env override). Used by
# backend/src/services/privy.ts to verify JWTs from the frontend
# embedded-wallet flow against the matching JWKS endpoint. PRIVY_APP_SECRET
# is a wrangler secret (wrangler secret put PRIVY_APP_SECRET) — never
# commit. See memory reference_privy_app_creds.
PRIVY_APP_ID = "cmpalnem701z00cjmncqve4q0"
# Domain-verification gate — ON by default (contract 73026078). Set to "0" only
# to opt-out, e.g. for staging back-compat. Even unset, publishSkill defaults
# to enforce; this binding makes the default loud and auditable in wrangler.
REQUIRE_DOMAIN_VERIFICATION = "1"
# Cheap-model used for the publish-time LLM PII scrubber (contract 101b1f77).
# See backend/src/services/ai-scrub.ts. NEBIUS_API_KEY (a secret) is the bearer.
UNBROWSE_AI_SCRUB_MODEL = "moonshotai/Kimi-K2.5"

# --- Staging environment ---
# Deploy: wrangler deploy --env staging
# Secrets: wrangler secret put EMERGENTDB_API_KEY --env staging (etc.)
# Uses dedicated staging KV namespace ids (provisioned 2026-05-12). Until then
# this block reused the prod STATS_KV id and silently routed staging analytics
# writes into prod KV.
[env.staging]
name = "unbrowse-backend-staging"
workers_dev = true
routes = []

# Dedicated staging STATS_KV — provisioned 2026-05-12 via
# `wrangler kv namespace create STATS_KV --env staging` (+ --preview).
[[env.staging.kv_namespaces]]
binding = "STATS_KV"
id = "195ca099811f4f6fbdae268d72ce2034"
preview_id = "f4fe69f30a3c47008a627113a505f38b"

[env.staging.vars]
ENVIRONMENT = "staging"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "true"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
# v6.15.0 — sponsor wallet bindings; key is a secret (wrangler secret put PLATFORM_SPONSOR_WALLET_KEY --env staging).
PLATFORM_SPONSOR_WALLET_ADDRESS = ""
SPONSOR_CAP_DAILY_USD = "1.0"
SPONSOR_GLOBAL_DAILY_USD = "50.0"
# Domain-verification gate — ON by default (contract 73026078). Staging
# mirrors prod here; set to "0" only if a staging integration test fixture
# needs the gate opened.
REQUIRE_DOMAIN_VERIFICATION = "1"

# --- Lewis experiments environment ---
# Deploy: wrangler deploy --env experiments
# Secrets: wrangler secret put EMERGENTDB_API_KEY --env experiments (etc.)
# Public surface stays on workers.dev so this branch can be used as an isolated sandbox.
[env.experiments]
name = "unbrowse-backend-experiments"
workers_dev = true
routes = []

[[env.experiments.kv_namespaces]]
binding = "STATS_KV"
id = "1d315d7cda1742b785cf5d23c892c5d7"
preview_id = "edcbdb23e34c4244bf8cf28eb404d069"

[env.experiments.vars]
ENVIRONMENT = "staging"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "false"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"

# --- gate-staging environment (MCP release-gate harness uses this) ---
# Deploy: wrangler deploy --env gate-staging
# Provision STATS_KV first: wrangler kv namespace create STATS_KV --env gate-staging  (and --preview)
# Secrets: wrangler secret put DATABASE_URL --env gate-staging  (point at same Neon DB; ns isolation is in kv.ts)
#          wrangler secret put EMERGENTDB_API_KEY --env gate-staging  (fallback)
# Isolation: ENVIRONMENT="gate-staging" routes marketplace writes to PgKV ns "gate-staging-skills-v3"
#            and stats writes to "gate-staging-stats" via backend/src/services/kv.ts.
[env.gate-staging]
name = "unbrowse-backend-gate-staging"
workers_dev = true
routes = []

[[env.gate-staging.kv_namespaces]]
binding = "STATS_KV"
id = "930ed4fa3d1c4febafcafb6905365dc8"
preview_id = "1eac26403aab4949ad69c35678dca938"

[env.gate-staging.vars]
ENVIRONMENT = "gate-staging"
PAYMENTS_ENABLED = "false"
CREDITS_ENABLED = "0"
X402_SEARCH_ENABLED = "false"
X402_NETWORK_MODE = "devnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
PLATFORM_SPONSOR_WALLET_ADDRESS = ""
SPONSOR_CAP_DAILY_USD = "0.0"
SPONSOR_GLOBAL_DAILY_USD = "0.0"
