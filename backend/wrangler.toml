# OPERATOR PROVISIONING — KV namespaces.
# Every TODO_create_via_wrangler_kv_namespace_create_<NAME>[_preview]
# placeholder below must be replaced with a real namespace id before the
# binding starts serving real traffic. The 503/honest-envelope behavior
# (see services/*-state.ts + services/audit.ts) keeps unprovisioned
# bindings from 500-ing, but every named-env stanza MUST be filled per
# env. Wrangler v3 env stanzas OVERRIDE the top-level [[kv_namespaces]]
# blocks entirely; a missing per-env stanza binds NOTHING for that env.
# Provision commands (run once per namespace, then once per env per
# namespace; paste returned id + preview id back into the matching
# slots below — top-level + production + staging + experiments +
# gate-staging):
#
#   # Top-level (legacy CI fallback, `wrangler deploy` without --env):
#   bunx wrangler kv:namespace create AUDIT_LOG
#   bunx wrangler kv:namespace create AUDIT_LOG --preview
#   bunx wrangler kv:namespace create RESPONSE_CACHE
#   bunx wrangler kv:namespace create RESPONSE_CACHE --preview
#   bunx wrangler kv:namespace create SESSION_STATE
#   bunx wrangler kv:namespace create SESSION_STATE --preview
#   bunx wrangler kv:namespace create TRACE_STATE
#   bunx wrangler kv:namespace create TRACE_STATE --preview
#   bunx wrangler kv:namespace create SETTINGS_STATE
#   bunx wrangler kv:namespace create SETTINGS_STATE --preview
#   bunx wrangler kv:namespace create SCREENSHOT_BLOB
#   bunx wrangler kv:namespace create SCREENSHOT_BLOB --preview
#
#   # Per env (repeat for --env staging, --env experiments,
#   #          --env gate-staging — every named env is its own deploy
#   #          target and must hold its own ids):
#   bunx wrangler kv:namespace create AUDIT_LOG       --env production
#   bunx wrangler kv:namespace create AUDIT_LOG       --env production --preview
#   bunx wrangler kv:namespace create RESPONSE_CACHE  --env production
#   bunx wrangler kv:namespace create RESPONSE_CACHE  --env production --preview
#   bunx wrangler kv:namespace create SESSION_STATE   --env production
#   bunx wrangler kv:namespace create SESSION_STATE   --env production --preview
#   bunx wrangler kv:namespace create TRACE_STATE     --env production
#   bunx wrangler kv:namespace create TRACE_STATE     --env production --preview
#   bunx wrangler kv:namespace create SETTINGS_STATE  --env production
#   bunx wrangler kv:namespace create SETTINGS_STATE  --env production --preview
#   bunx wrangler kv:namespace create SCREENSHOT_BLOB --env production
#   bunx wrangler kv:namespace create SCREENSHOT_BLOB --env production --preview
#   # ...repeat with --env staging / --env experiments / --env gate-staging.
#
# Placeholder convention: TODO_create_via_wrangler_kv_namespace_create_<NAME>
# (and _<NAME>_preview for preview ids). The <NAME> suffix is mandatory so
# `grep -n TODO_create_via_wrangler_kv_namespace_create_AUDIT_LOG
# backend/wrangler.toml` returns every slot the operator must fill for
# that binding. Bare (un-suffixed) forms are forbidden — they collide
# during search.

name = "unbrowse-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Wrangler v3 routes module workers with KV bindings through the newer
# /versions API, which currently rejects our CI token without KV write perms.
# `first_party_worker` disables that code path in Wrangler v3 and keeps deploys
# on the legacy PUT /workers/scripts/:name endpoint instead.
first_party_worker = true

[triggers]
crons = ["17 */6 * * *"]

# STATS_KV — production analytics + bm25-idx + sponsor:ledger writes.
# Previously bound only via `wrangler.ci.toml`'s `unsafe.bindings type=inherit`.
# Making it explicit here keeps top-level (= prod) deploys self-contained — a
# `wrangler deploy --env=""` from this file now carries the binding through
# instead of silently stripping it (which manifested as
# `Cannot read properties of undefined (reading 'put')` in indexEndpoints).
# Namespace id from `wrangler kv namespace list` → `unbrowse-backend-STATS_KV`.
[[kv_namespaces]]
binding = "STATS_KV"
id = "1d315d7cda1742b785cf5d23c892c5d7"
preview_id = "edcbdb23e34c4244bf8cf28eb404d069"

# AUDIT_LOG — v7.0 pointer-only fill-receipt audit log. Stores Ed25519-signed
# receipts (sig-shape v7.0; Groth16 SNARK v7.3 behind same wire). See
# backend/src/services/audit.ts for the KV schema; routes/audit.ts for the
# REST surface. Storage path is INERT in v7.0 scaffold — routes return 501
# with the KV key the real impl will touch. Operator must provision the
# namespace before deploying the wave that wires the real storage:
#   wrangler kv namespace create AUDIT_LOG
#   wrangler kv namespace create AUDIT_LOG --preview
# Then paste the returned ids into the TODO slots below.
[[kv_namespaces]]
binding = "AUDIT_LOG"
id = "TODO_create_via_wrangler_kv_namespace_create_AUDIT_LOG"
preview_id = "TODO_create_via_wrangler_kv_namespace_create_AUDIT_LOG_preview"

# RESPONSE_CACHE — W17 KV-backed response cache for hot Worker paths
# (resolve, marketplace lookup, sponsor-status, audit-verify). Dedicated
# namespace — NOT shared with STATS_KV (analytics) or AUDIT_LOG (signed
# receipts). See backend/src/services/kv-cache.ts for the helper and
# security constraints (no wallet-bound secrets, no private-identifier
# keys). When absent the helper gracefully falls through to compute so
# the hot path NEVER 500s on a missing binding. Operator provisioning:
#   bunx wrangler kv:namespace create RESPONSE_CACHE
#   bunx wrangler kv:namespace create RESPONSE_CACHE --preview
# Then paste the returned ids into the slots below (top-level + every
# named env stanza — production / staging / experiments / gate-staging).
# Matt 6:34 — sufficient unto the day; what was computed need not be
# recomputed.
[[kv_namespaces]]
binding = "RESPONSE_CACHE"
id = "TODO_create_via_wrangler_kv_namespace_create_RESPONSE_CACHE"
preview_id = "TODO_create_via_wrangler_kv_namespace_create_RESPONSE_CACHE_preview"

# SESSION_STATE — v7.2.0-preview.0 persistent-session pointer-of-pointer
# storage (W23 wave, 2026-05-28). Stores the L1..L4 pointer-chain
# registry parked at `unbrowse breath session-park` and read at
# `breath session-restore`. Key shape:
#   session:<walletPubkey-hex>:<sessionId>
# Wallet-prefixed for structural cross-wallet isolation — a request
# signed by wallet-A can never produce a key prefix matching wallet-B's
# rows. v7.2.0-preview.0 storage path is INERT (helper throws
# BindingMissingError → route returns 503 honestly with `_wave_hint`
# pointing operators at the provisioning steps below); v7.3 wave wires
# the real impl.
#   bunx wrangler kv:namespace create SESSION_STATE
#   bunx wrangler kv:namespace create SESSION_STATE --preview
# Then paste the returned ids into the slots below (top-level + every
# named env stanza). Mt 6:19-20 — lay up for yourselves treasures in
# heaven; the KV-cached pointer-chain IS the persistent treasure that
# browser-close was destroying every session.
[[kv_namespaces]]
binding = "SESSION_STATE"
id = "TODO_create_via_wrangler_kv_namespace_create_SESSION_STATE"
preview_id = "TODO_create_via_wrangler_kv_namespace_create_SESSION_STATE_preview"

# TRACE_STATE — v7.2.0-preview.0 trace-state KV (Day-3 Land worker B,
# 2026-05-28). Pointer-only execution traces; decision_trace step
# labels + timings + status_class + canonical error_code only. Key shape:
#   trace:<walletPubkey-hex>:<sigHashHex>
# where sigHashHex = sha256(signature)[:32]. Rolling 7d TTL. See
# backend/src/services/trace-state.ts for the schema and routes/trace.ts
# for the wire surface. Storage path returns 503 honest envelope when
# the binding is absent. Operator provisions via:
#   bunx wrangler kv:namespace create TRACE_STATE
#   bunx wrangler kv:namespace create TRACE_STATE --preview
[[kv_namespaces]]
binding = "TRACE_STATE"
id = "TODO_create_via_wrangler_kv_namespace_create_TRACE_STATE"
preview_id = "TODO_create_via_wrangler_kv_namespace_create_TRACE_STATE_preview"

# SETTINGS_STATE — v7.2.0-preview.0 per-wallet durable preferences
# (Day-3 Land worker B, 2026-05-28). Pointer-only settingValuePointer
# (literal: | op:// | keychain:// | bw:// | arg:// | unbrowse://);
# never raw values. Key shape:
#   settings:<walletPubkey-hex>:<settingKeyHash>
# where settingKeyHash = sha256(settingKey)[:32] (so settings keys are
# not enumerable from a KV listing). Indefinite TTL. See
# backend/src/services/settings-state.ts + routes/settings.ts. Operator:
#   bunx wrangler kv:namespace create SETTINGS_STATE
#   bunx wrangler kv:namespace create SETTINGS_STATE --preview
[[kv_namespaces]]
binding = "SETTINGS_STATE"
id = "TODO_create_via_wrangler_kv_namespace_create_SETTINGS_STATE"
preview_id = "TODO_create_via_wrangler_kv_namespace_create_SETTINGS_STATE_preview"

# SCREENSHOT_BLOB — v7.2.0-preview.0 content-addressable PNG storage
# (Day-5 SWARM worker D, 2026-05-28). Replaces local-disk
# ~/.unbrowse/screenshots/ writes under UNBROWSE_STATELESS=1. Two writes
# per POST (meta + blob), keyed by sigKey = sha256(signature)[:32]:
#   screenshot:<wallet>:<sigKey>:meta  →  metadata envelope JSON
#   screenshot:<wallet>:<sigKey>:blob  →  raw PNG bytes (capped 8MB)
# Wallet-prefixed for cross-wallet structural isolation. TTL 30d.
# See backend/src/services/screenshot-blob.ts + routes/screenshot.ts.
# Binding optional in v7.2.0-preview.0 — route returns 503 honest
# envelope when absent; CLI handler graceful-degrades to tmp file.
# v7.3 wave wires R2/Tigris-backed CAS storage for the blob lane.
# Operator:
#   bunx wrangler kv:namespace create SCREENSHOT_BLOB
#   bunx wrangler kv:namespace create SCREENSHOT_BLOB --preview
[[kv_namespaces]]
binding = "SCREENSHOT_BLOB"
id = "TODO_create_via_wrangler_kv_namespace_create_SCREENSHOT_BLOB"
preview_id = "TODO_create_via_wrangler_kv_namespace_create_SCREENSHOT_BLOB_preview"

# Secrets (set via `wrangler secret put`):
#   EMERGENTDB_API_KEY, NEBIUS_API_KEY, API_KEY, FAL_KEY, TURBOBOX_URL,
#   RESEND_API_KEY, CASCADE_SIGNER_SECRET_KEY, CLOUDFLARE_API_TOKEN
#   NEBIUS_API_KEY  — also drives the publish-time LLM PII scrubber
#                     (backend/src/services/ai-scrub.ts, contract 101b1f77).
#                     Soft-fails if unset; the regex layer remains authoritative.
#   ADMIN_KEY  — gates /v1/admin/* read surfaces (sponsor-ledger).
#                NEVER put the value in this file or any committed env file —
#                always `wrangler secret put ADMIN_KEY` (per env if needed).
#   PLATFORM_SPONSOR_WALLET_KEY  — signer for the sponsor wallet binding
#                                  set in [vars] below. Both must be set
#                                  for sponsor mode to enable.
#
# ─── COVENANT PEER-FEDERATION (operator hand-off, W26-C / W29) ──────────────
# The backend's /v1/covenant route writes its signed receipt to the AUDIT_LOG
# KV row AND (optionally) mirrors that same content-addressed receipt to a
# running covenant-server's ledger. The mirror is fire-and-forget
# (ctx.waitUntil — NEVER adds latency to the user call) and graceful-degrades
# to an honest no-op when the vars below are UNSET (one warn log,
# { ok: true, skipped: true }, no throw). See
# backend/src/services/covenant-peer.ts + routes/covenant.ts.
#
#   To ACTIVATE peer-federation in prod (W33-C opaque boundary):
#     Set AIKO_OP_URL to an aiko-level proxy base URL. The mirror POSTs an
#     OPAQUE op `<AIKO_OP_URL>/op` with body
#     {op_class, op_kind, params, identity, sig?, unbrowse_receipt_ptr} — NO
#     covenant verb, NO scripture witness ever crosses the wire (Mark 4:11).
#     The proxy (sovereign, aiko-side) maps op_class -> covenant verb and
#     supplies the default_witness. Example:
#       AIKO_OP_URL = "https://aiko-proxy.example:8787"
#     (Legacy COVENANT_LEDGER_URL still works and ALSO receives the opaque op.)
#     Optionally set PEER_URLS to a comma-separated list of ADDITIONAL proxy
#     base URLs to fan the same op out to. Example:
#       PEER_URLS = "https://peer-a.example,https://peer-b.example"
#     Set AIKO_KEY (secret) to let aiko-authenticated callers see the full
#     /v1/covenant mechanism (kind/action); public callers get the opaque
#     {ok, receiptId, covenantReceiptPtr} only. ADMIN_KEY is also accepted.
#       wrangler secret put AIKO_KEY
#   Leave all UNSET (or omit the commented lines below) to keep federation
#   OFF — the unbrowse KV row is still written; only the cross-store mirror
#   is skipped. These are PLAIN vars (no secret); set per env in the matching
#   [env.<name>.vars] block, or via `wrangler secret put` if you prefer the
#   value not committed.

[vars]
ENVIRONMENT = "production"
CREDITS_ENABLED = "1"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
# Covenant peer-federation (OFF by default; see header block above). Uncomment
# and set to an aiko-proxy base URL to enable the OPAQUE op mirror (W33-C).
# AIKO_OP_URL = "https://aiko-proxy.example:8787"
# COVENANT_LEDGER_URL = "https://covenant-server.example:8787"
# PEER_URLS = "https://peer-a.example,https://peer-b.example"
# v6.15.0 — sponsor wallet bindings; key is a secret (wrangler secret put PLATFORM_SPONSOR_WALLET_KEY).
PLATFORM_SPONSOR_WALLET_ADDRESS = ""
SPONSOR_CAP_DAILY_USD = "1.0"
SPONSOR_GLOBAL_DAILY_USD = "50.0"
# Privy app id (public). Same value as NEXT_PUBLIC_PRIVY_APP_ID on the
# frontend (frontend/src/lib/privy-provider.tsx, env override). Used by
# backend/src/services/privy.ts to verify JWTs from the frontend
# embedded-wallet flow against the matching JWKS endpoint. PRIVY_APP_SECRET
# is a wrangler secret (wrangler secret put PRIVY_APP_SECRET) — never
# commit. See memory reference_privy_app_creds.
PRIVY_APP_ID = "cmpalnem701z00cjmncqve4q0"
# Domain-verification + reserved-domain publish gates — opened in production for
# maximum route coverage (any agent may publish any domain). The code defaults
# stay ON (so staging/tests/other deployments keep the gates); these prod bindings
# open them. The takedown gate (domain-takedown KV) and the first-publisher
# ownership gate remain as the reactive moderation backstop. Flip either back to
# "1" / remove to re-enforce. Trade-off accepted by the owner: open publish +
# reactive takedown instead of upfront verification.
REQUIRE_DOMAIN_VERIFICATION = "0"
RESERVED_DOMAIN_GATE = "0"
# Cheap-model used for the publish-time LLM PII scrubber (contract 101b1f77).
# See backend/src/services/ai-scrub.ts. NEBIUS_API_KEY (a secret) is the bearer.
UNBROWSE_AI_SCRUB_MODEL = "moonshotai/Kimi-K2.5"

# --- Production environment ---
# Deploy: wrangler deploy --env production
# Secrets: wrangler secret put EMERGENTDB_API_KEY --env production (etc.)
#
# Mirrors the top-level [vars] / [[kv_namespaces]] blocks above so that
# `wrangler deploy --env production` is an EXPLICIT, declared path —
# satisfies global principle 20260521T194246Z-7ad798e3 (staging-then-prod
# with signed release manifest), which requires production to be its own
# named env so `wrangler deploy` without `--env` stops being the silent-
# default deploy path. The top-level blocks are KEPT for back-compat with
# the current CI (deploy.yml uses `wrangler deploy` without --env); the
# next wave migrates CI to `--env production` and removes the silent
# top-level fallback.
[env.production]
name = "unbrowse-backend"
workers_dev = false
routes = [
  { pattern = "beta-api.unbrowse.ai/*", zone_name = "unbrowse.ai" },
]

[[env.production.kv_namespaces]]
binding = "STATS_KV"
id = "1d315d7cda1742b785cf5d23c892c5d7"
preview_id = "edcbdb23e34c4244bf8cf28eb404d069"

# AUDIT_LOG — see top-level stanza. v7.0 signed-receipt audit log. Without
# this per-env stanza, `wrangler deploy --env production` binds NOTHING
