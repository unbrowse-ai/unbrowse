name = "unbrowse-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
first_party_worker = true

# CI deploys with a token that can update Worker code and routes but cannot
# re-authorize KV namespace bindings. Preserve the already-attached namespace
# instead of re-sending its namespace_id on every release deploy.
[unsafe.metadata]
keep_bindings = ["kv_namespace"]

[[unsafe.bindings]]
name = "STATS_KV"
type = "inherit"

[vars]
ENVIRONMENT = "production"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "false"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"

[env.staging]
name = "unbrowse-backend-staging"
workers_dev = true
routes = []

[env.staging.unsafe.metadata]
keep_bindings = ["kv_namespace"]

[[env.staging.unsafe.bindings]]
name = "STATS_KV"
type = "inherit"

[env.staging.vars]
ENVIRONMENT = "staging"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "false"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"

[env.experiments]
name = "unbrowse-backend-experiments"
workers_dev = true
routes = []

[env.experiments.unsafe.metadata]
keep_bindings = ["kv_namespace"]

[[env.experiments.unsafe.bindings]]
name = "STATS_KV"
type = "inherit"

[env.experiments.vars]
ENVIRONMENT = "staging"
PAYMENTS_ENABLED = "true"
CREDITS_ENABLED = "1"
X402_SEARCH_ENABLED = "false"
X402_NETWORK_MODE = "mainnet"
PAYMENT_RECIPIENT = "6KpxaoPoTDBAMxNNMPQvQEnTbErtjogL2unK8q3VKcdn"
