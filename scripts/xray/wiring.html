<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>How each route is wired</title>
<style>
:root{--bg:#f7f6f2;--ink:#1c1b19;--mute:#6b675f;--pl:#ffffff;--ple:#cfcabd;--req:#fff6e6;--card:#fff;--holein:#e9e6dd;
--caller:#1d7a4f;--answer:#1f5fbf;--session:#0d7f8c;--storage:#8a6d1f;--clock:#b05a00;--script:#6b3fb5;--page:#5b6470;--person:#c2410c;--unknown:#d4007a;
--fixed:#8a857a;--bad:#c0262d;--warn:#b26b00;--hi:#ffcc00;--diff:#e08a00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#eceae4;--mute:#9a968c;--pl:#211f1b;--ple:#45423a;--req:#2e2515;--card:#1e1d1a;--holein:#0c0c0b;
--caller:#6fd3a0;--answer:#7fb0ff;--session:#5fd0dc;--storage:#e0c060;--clock:#f0a860;--script:#b99cf0;--page:#aab4c0;--person:#ff9a5c;--unknown:#ff5fc0;--fixed:#a8a399;--bad:#ff6b6b;--warn:#f0b040;--hi:#ffd84a;--diff:#ffb040}}
:root[data-theme=dark]{--bg:#141412;--ink:#eceae4;--mute:#9a968c;--pl:#211f1b;--ple:#45423a;--req:#2e2515;--card:#1e1d1a;--holein:#0c0c0b;
--caller:#6fd3a0;--answer:#7fb0ff;--session:#5fd0dc;--storage:#e0c060;--clock:#f0a860;--script:#b99cf0;--page:#aab4c0;--person:#ff9a5c;--unknown:#ff5fc0;--fixed:#a8a399;--bad:#ff6b6b;--warn:#f0b040;--hi:#ffd84a;--diff:#ffb040}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ple);padding:10px 18px 8px}
h1{font-size:18px;margin:0 6px 0 0;display:inline}h2{font-size:15px;margin:18px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
button,select,input{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--ple);border-radius:7px;padding:3px 9px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible,.hole:focus-visible,.rlab:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.flag{display:inline-flex;gap:5px;align-items:center}.flag b{font-variant-numeric:tabular-nums}
.mark{display:inline-block;min-width:16px;height:16px;border-radius:4px;font-size:11px;font-weight:700;line-height:16px;text-align:center;color:#fff}
.lv{display:inline-block;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;border:1px solid}.lv-break{color:var(--bad);border-color:var(--bad)}.lv-risk{color:var(--warn);border-color:var(--warn)}.lv-note{color:var(--mute);border-color:var(--mute)}
.fd{cursor:pointer}.fd:hover{text-decoration:underline}.strip{display:inline-flex;gap:2px;vertical-align:middle}.strip i{display:inline-block;width:9px;height:12px;border-radius:2px;font-style:normal;font-size:8px;line-height:12px;text-align:center;color:#fff}
.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:3px 6px;border-bottom:1px solid var(--ple);font-size:13px}.rrow.on{background:var(--card)}.rrow .tog{padding:0 6px}
.rname{font-weight:600;min-width:150px;color:var(--ink);text-decoration:none}.rsite{min-width:180px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbar{display:inline-block;width:90px;height:8px;border-radius:4px;vertical-align:middle}.steps{display:inline-flex;gap:2px}.st1{font-size:10.5px;min-width:15px;text-align:center;border:1.5px solid var(--ple);border-radius:4px;padding:0 2px}
.rdraw{padding:4px 0 10px 24px;border-bottom:1px solid var(--ple)}
.fn{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.fn .who{color:var(--mute)}.gone{color:var(--bad)}
.m-fell{background:var(--bad)}.m-open{background:var(--bad)}.m-frozen{background:var(--storage)}.m-ceiling{background:var(--warn)}.m-browser{background:var(--page)}.m-under{background:var(--clock)}.m-unknown{background:var(--unknown)}
.m-refused-differs{background:var(--bad)}.m-refused-same{background:var(--warn)}.m-walked-session{background:var(--session)}
.wire3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.wire3>div{border:1px solid var(--ple);border-radius:7px;padding:6px 8px;font-size:12px;overflow-wrap:anywhere}.wire3 b{font-size:11.5px}
.wd{display:inline-block;font-size:10.5px;border-radius:9px;padding:0 6px;border:1px solid var(--bad);color:var(--bad);margin-right:4px;cursor:pointer}.wd.k-walked,.wd.k-reply{border-color:var(--warn);color:var(--warn)}
.nm{display:inline-block;margin:1px 3px 1px 0;padding:0 4px;border-radius:4px;background:var(--ple)}.nm.off{outline:1px solid var(--bad)}
main{padding:10px 18px 40px}
.sub{color:var(--mute);margin:2px 0 6px;max-width:1100px}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--mute);margin:6px 0}
.sw{display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.scroll{overflow-x:auto}
svg{display:block}svg text{font-family:inherit}
.pl{fill:var(--pl);stroke:var(--ple);stroke-width:1.1;fill-opacity:.85}.req{fill:var(--req);stroke-width:1.6}
.ln{font-weight:600;font-size:13px;fill:var(--ink)}.ls{font-size:10.5px;fill:var(--mute)}.dl{font-size:10px;fill:var(--mute)}.hl{font-size:10.5px;fill:var(--ink)}
.rl{font-size:11.5px;font-weight:600;fill:var(--ink)}.rr{font-size:10.5px;fill:var(--mute)}.ok{fill:var(--caller)}.no{fill:var(--bad)}
.bracket{stroke:var(--ple);stroke-width:1.3}.stepdiv{stroke:var(--ple);stroke-dasharray:3 3}
.st{fill:none;stroke-width:2;stroke-linecap:round;opacity:.85}.sib{stroke:var(--script);stroke-dasharray:2 4;stroke-width:1.8;fill:none}
.hole{cursor:pointer}.hole ellipse.ring{fill:var(--holein);stroke-width:2.2}.hole.fixed ellipse.ring{fill:var(--fixed);stroke:var(--fixed)}
.hole.open ellipse.ring{stroke:var(--bad);stroke-dasharray:3 2}.hole.sel ellipse.ring{stroke-width:4}
.hole.changed ellipse.ring{animation:flash 1s ease-in-out 4}.hole.changed .halo{opacity:1}
.halo{fill:none;stroke:var(--hi);stroke-width:5;opacity:0;transition:opacity .4s}
.hole.diff .dring{opacity:1}.dring{fill:none;stroke:var(--diff);stroke-width:2.5;stroke-dasharray:4 2;opacity:0}
@keyframes flash{50%{fill:var(--hi)}}
.fchip{cursor:pointer}.fchip rect{fill:var(--card);stroke:var(--fixed);stroke-dasharray:2 2}.fchip text{font-size:10px;fill:var(--mute)}
.badge text{font-size:10px;font-weight:700;fill:#fff}
#drawer{position:fixed;top:0;right:0;width:min(560px,100%);height:100vh;overflow:auto;background:var(--card);border-left:1px solid var(--ple);box-shadow:-8px 0 24px rgba(0,0,0,.15);padding:14px 16px 40px;z-index:10;transform:translateX(105%);transition:transform .18s}
#drawer.on{transform:none}#drawer h3{margin:0 0 4px;font-size:15px}
pre,code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}pre{background:var(--bg);border:1px solid var(--ple);border-radius:6px;padding:7px 9px;white-space:pre-wrap;word-break:break-word;margin:4px 0}
table{border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--ple)}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--ple);vertical-align:top}th{color:var(--mute);font-weight:600}
tr.differs td{background:color-mix(in srgb,var(--diff) 16%,transparent)}
.card{background:var(--card);border:1px solid var(--ple);border-radius:9px;padding:9px 12px;margin:8px 0}
.step h3{font-size:13.5px;margin:0 0 4px}.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:9px;border:1px solid var(--ple);color:var(--mute);margin-left:4px}
.chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.mute{color:var(--mute)}.small{font-size:12px}
details summary{cursor:pointer;color:var(--mute)}
.empty{border:1px dashed var(--ple);border-radius:9px;padding:12px;color:var(--mute)}
#status{font-size:12px;color:var(--mute)}
</style></head>
<body>
<header>
  <h1>How each route is wired</h1><span id="status"></span>
  <div class="bar" role="toolbar" aria-label="View">
    <button data-view="all" aria-pressed="true" title="1">All routes</button>
    <button data-view="one" aria-pressed="false" title="2">One route</button>
    <button data-view="side" aria-pressed="false" title="3">Side by side</button>
    <button data-view="sites" aria-pressed="false" title="4">Across routes</button>
    <label>group <select id="group" aria-label="Group of routes"></select></label>
    <label id="routeL">route <select id="route" aria-label="Route"></select></label>
    <span id="sideCtl"></span>
    <input id="filter" placeholder="filter: site, route, row…" aria-label="Filter routes" size="18">
    <button id="theme" title="light or dark">◐</button>
  </div>
  <div class="bar" id="flags" aria-label="Flags and findings"></div>
</header>
<main>
  <div id="legend"></div>
  <div id="view"></div>
  <h2>The pick <span class="mute small">which call of each walk was taken as the answer, from the node's log</span></h2>
  <div id="pick"></div>
</main>
<aside id="drawer" aria-label="The hole" tabindex="-1"><button id="close" style="float:right">close (Esc)</button><div id="dbody"></div></aside>
<script>
"use strict";
const LIVE = /*LIVE*/false;
let S = /*STATE*/null;
const UI = {view: 'all', group: null, route: null, sideMode: 'graph', sideA: null, sideB: null, filter: '', only: null, open: new Set(), sel: null, page: 0, expanded: new Set(), show: new Map()};
// The page opens on the overview (one summary a route, the totals, the pick) and fetches a route's holes only when the
// route is opened, and again only when that route's own `sig` moved. A poll asks /version and nothing else when
// nothing changed.
const D = new Map(), DSIG = new Map();   // route key -> its detail, and the sig it was fetched at
let ENG = {tips: {}, kinds: {}, why: {}, wire: {}};
const PAGE = 40, STEPS = 12;
const PREV = new Map(), CHANGED = new Map();
const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const $ = id => document.getElementById(id);
const COL = l => 'var(--' + l + ')';
const FLAGMARK = {open: '?', frozen: '❄', ceiling: '▲', browser: 'B', fell: '⤓', under: '↓', unknown: '!', 'refused-differs': '≠', 'refused-same': '=', 'walked-session': '◐'};
const LVCOL = {break: 'var(--bad)', risk: 'var(--warn)', note: 'var(--mute)'};
const RUNGCOL = r => r == null ? 'var(--fixed)' : ['var(--caller)', 'var(--answer)', 'var(--script)', 'var(--page)', 'var(--page)', 'var(--bad)'][Math.min(5, Math.max(0, r))];
const worstOf = fs => { for (const lv of ['break', 'risk', 'note']) if ((fs || []).some(f => f.level === lv)) return lv; return null; };
const callOf = c => Array.isArray(c) ? {ok: c[0], rung: c[1], browser: c[2], ms: c[3]} : c;
function strip(r) {
  const cs = (r.calls || []).map(callOf); if (!cs.length) return '<span class="mute small">never called</span>';
  return '<span class="strip" title="its last ' + cs.length + ' call(s), oldest first: rung, ✗ failed, B a browser ran">' + cs.map(c => `<i style="background:${c.browser ? 'var(--page)' : RUNGCOL(c.rung)};${c.ok ? '' : 'outline:2px solid var(--bad);outline-offset:-2px'}" title="${E((c.ok ? 'answered' : 'failed') + ' at rung ' + c.rung + (c.browser ? ', a browser ran' : '') + ', ' + c.ms + ' ms' + (c.steps ? '; steps at ' + c.steps.map(x => 'r' + x).join(' ') : ''))}">${c.browser ? 'B' : c.ok ? '' : '✗'}</i>`).join('') + '</span>';
}
const cut = (s, n) => (s = String(s || '')).length > n ? s.slice(0, n - 1) + '…' : s;

function routesOf(g) { return (S && S.summaries && S.summaries[g]) || []; }
function allRoutes() { return [...D.values()]; }
function routeByKey(k) { return D.get(k); }
function summaryOf(k) { for (const g in S.summaries) { const x = S.summaries[g].find(r => r.key === k); if (x) return x; } return null; }
let fetching = new Set();
// Fetch the details of these routes that are missing or stale (their summary's sig moved); then draw again.
async function need(keys) {
  if (!LIVE) return false;
  const todo = keys.filter(k => k && !fetching.has(k) && (!D.has(k) || ((summaryOf(k) || {}).sig && DSIG.get(k) !== summaryOf(k).sig)));
  if (!todo.length) return false;
  todo.forEach(k => fetching.add(k));
  try {
    await Promise.all(todo.map(async k => {
      const d = await (await fetch('/route?key=' + encodeURIComponent(k))).json();
      if (!d.route) return;
      D.set(k, d.route); DSIG.set(k, (summaryOf(k) || {}).sig);
      if (d.engine) { ENG.tips = d.engine.tips; Object.assign(ENG.kinds, d.engine.kinds); Object.assign(ENG.why, d.engine.why); Object.assign(ENG.wire, d.engine.wire || {}); }
    }));
  } finally { todo.forEach(k => fetching.delete(k)); }
  return true;
}
// The routes whose holes the current view draws.
function wanted() {
  const rs = visible(routesOf(UI.group));
  if (UI.view === 'one') return [UI.route && summaryOf(UI.route) ? UI.route : (rs[0] || {}).key];
  if (UI.view === 'side' && UI.sideMode === 'graph') { const r = rs.filter(x => x.graph); return [(r.find(x => x.key === UI.route) || r[0] || {}).key]; }
  if (UI.view === 'side') return sidePairs().slice(UI.page * 8, UI.page * 8 + 8).flat().map(r => r.key);
  return worstFirst(rs).slice(UI.page * PAGE, UI.page * PAGE + PAGE).filter(r => UI.expanded.has(r.key)).map(r => r.key);
}
function label(r) { return r.row || cut(r.what || r.id, 26); }
function visible(rs) {
  const f = UI.filter.toLowerCase();
  return rs.filter(r => (!f || [r.row, r.id, r.site, r.what, r.file].join(' ').toLowerCase().includes(f)) && (!UI.only || (r.counts && r.counts[UI.only]) || (r.found && r.found[UI.only])));
}
function holeKey(r, si, h) { return r.key + '|' + r.by + '|' + si + '|' + h.place; }
function holeSig(h) { return JSON.stringify([h.ways.map(w => [w.rung, w.line]), h.layers.map(l => l.layer), h.flags.map(f => f.kind), (h.findings || []).map(f => f.id)]); }

// What changed since the last draw: a hole whose way or rung is new is lit for a few seconds.
function noteChanges(first) {
  const now = Date.now();
  for (const r of allRoutes()) (r.steps || []).forEach((s, si) => s.holes.forEach(h => {
    const k = holeKey(r, si, h), sg = holeSig(h);
    if (!first && PREV.get(k) !== sg) CHANGED.set(k, now);
    PREV.set(k, sg);
  }));
  for (const [k, t] of CHANGED) if (now - t > 6000) CHANGED.delete(k);
}

// ---------------------------------------------------------------------------------------------- the drawing
const CAP = 40;
const FOLDWORD = {sightings: "the route's sightings (Kind::Browsers)", walk: "the walk: sent on what the document loads by itself", address: 'fixed address pieces', rule: 'the name list'};
const G = {HW: 34, SG: 12, RG: 30, X0: 236, SK: 38, LH: 34, LS: 50, TOP: 14, RH: 46};
function layersUsed(rs) {
  const used = new Set(S.layers.map(l => l[0]).filter(l => l !== 'unknown'));
  for (const r of rs) for (const s of r.steps || []) for (const h of s.holes) for (const l of h.layers) used.add(l.layer);
  return S.layers.filter(l => used.has(l[0]));
}
// One route as the items of its segment: holes, and a chip per step for the browser's own headers, folded.
function segment(r) {
  const items = [];
  const shown_ = UI.show.get(r.key) || STEPS;
  (r.steps || []).forEach((s, si) => {
    if (si >= shown_) return;
    const openK = r.key + '|' + r.by + '|' + si, open = UI.open.has(openK);
    const folded = s.holes.filter(h => h.fold && !h.flags.length && !(h.findings || []).length);
    let shown = s.holes.map((h, hi) => ({h, hi})).filter(x => folded.indexOf(x.h) < 0);
    // In the overview a step's run of fixed text (no string to draw) and a step past CAP holes fold into chips too.
    let fixedN = 0, moreN = 0;
    const marked = h => h.flags.length || (h.findings || []).length;
    const fx = shown.filter(x => x.h.fixed && !marked(x.h));
    if (fx.length > 8) { shown = shown.filter(x => !(x.h.fixed && !marked(x.h))); fixedN = fx.length; }
    // Past CAP, what is folded is never a hole with a flag or a finding: what is counted at the top is drawn.
    if (shown.length > CAP) { const keep = shown.filter(x => marked(x.h)), rest = shown.filter(x => !marked(x.h)); const room = Math.max(0, CAP - keep.length); moreN = rest.length - Math.min(room, rest.length); shown = shown.filter(x => marked(x.h) || rest.indexOf(x) < room); }
    if (open) shown = s.holes.map((h, hi) => ({h, hi}));
    for (const {h, hi} of shown) items.push({kind: 'hole', r, s, si, h, hi});
    const how = folded.reduce((a, h) => (a[h.fold] = (a[h.fold] || 0) + 1, a), {});
    if (folded.length || fixedN || moreN) items.push({kind: 'fold', r, s, si, n: folded.length + fixedN + moreN, openK, open, how, fixedN, moreN, browserN: folded.length});
    items.push({kind: 'gap'});
  });
  if (items.length && items[items.length - 1].kind === 'gap') items.pop();
  return items;
}
function draw(rs, opts) {
  opts = opts || {};
  const sc = opts.scale || 1, HW = G.HW * sc, layers = layersUsed(rs);
  const LY = {}; let y = G.TOP;
  for (const [k] of layers) { LY[k] = y; y += G.LS; }
  const REQY = y + 10, HY = REQY + 28, LABY = REQY + G.RH + 10;
  const width = opts.width || Math.max(900, (document.querySelector('main') || {clientWidth: 1200}).clientWidth - 10);
  // Segments, wrapped into bands that fit the width.
  const segs = rs.map(r => {
    const items = segment(r);
    let w = 0; for (const it of items) w += it.kind === 'gap' ? G.SG : HW;
    const lw = Math.max(label(r).length, 9) * 6.6 + 8;
    return {r, items, w: Math.max(w, Math.min(lw, 140), HW)};
  });
  const bands = []; let cur = [], x = G.X0 + G.SK;
  for (const sg of segs) {
    if (cur.length && x + sg.w + G.RG > width) { bands.push(cur); cur = []; x = G.X0 + G.SK; }
    sg.x = x; cur.push(sg); x += sg.w + G.RG;
  }
  if (cur.length) bands.push(cur);
  if (!bands.length) return `<p class="empty">No route to draw here.${S.pick && S.pick.some(l => !l.kept) ? ' This node kept no route from a learn: the pick, below, says why.' : ''}</p>`;
  let html = '';
  for (const band of bands) {
    const last = band[band.length - 1], W = Math.max(width, last.x + last.w + 60);
    const out = [], strings = [], arcs = [], holes = [], dots = [], labels = [];
    const sheet = (yt, cls, h) => `<polygon class="pl ${cls || ''}" points="${G.X0 + G.SK},${yt} ${W - 10},${yt} ${W - 10 - G.SK},${yt + (h || G.LH)} ${G.X0},${yt + (h || G.LH)}"/>`;
    for (const [k, name, sub] of layers) {
      out.push(sheet(LY[k]));
      out.push(`<text class="ln" x="${G.X0 - 10}" y="${LY[k] + 16}" text-anchor="end" style="fill:${COL(k)}">${E(name)}</text><text class="ls" x="${G.X0 - 10}" y="${LY[k] + 29}" text-anchor="end">${E(sub)}</text>`);
    }
    out.push(sheet(REQY, 'req', G.RH));
    out.push(`<text class="ln" x="${G.X0 - 10}" y="${REQY + 16}" text-anchor="end">The requests</text><text class="ls" x="${G.X0 - 10}" y="${REQY + 29}" text-anchor="end">every value sent is a hole</text>`);
    const levels = [[], [], []], lastWord = {};
    let maxLab = 0;
    for (const sg of band) {
      const r = sg.r; let hx = sg.x + HW / 2, first = null, lastX = null, prevStep = null;
      const pos = new Map();
      for (const it of sg.items) {
        if (it.kind === 'gap') { hx += G.SG; continue; }
        if (prevStep !== null && it.si !== prevStep) out.push(`<line class="stepdiv" x1="${hx - HW / 2 - G.SG / 2}" y1="${REQY + 4}" x2="${hx - HW / 2 - G.SG / 2}" y2="${REQY + G.RH - 4}"/>`);
        if (it.si !== prevStep) {
          const sw = worstOf(it.s.findings);
          out.push(`<text class="dl" x="${hx - HW / 2 + 2}" y="${REQY + 11}" style="${it.s.ran != null ? 'fill:' + RUNGCOL(it.s.ran) + ';font-weight:700' : ''}"><title>step ${it.s.n}: ${E(it.s.method + ' ' + it.s.path)}${it.s.answer ? ', the answer' : ''}${it.s.ran != null ? '; the last call ran it at rung ' + it.s.ran : ''}${(it.s.findings || []).map(f => '; [' + f.level + '] ' + f.title).join('')}</title>step ${it.s.n}${it.s.answer ? ' ★' : ''}${it.s.ran != null ? ' r' + it.s.ran : ''}</text>`);
          if (sw) out.push(`<g class="fd" data-stepf="${E(r.key + '|' + r.by + '|' + it.si)}"><title>${E((it.s.findings || []).map(f => '[' + f.level + '] ' + f.title).join('; '))}</title><circle cx="${hx - HW / 2 + 52}" cy="${REQY + 7}" r="5" style="fill:${LVCOL[sw]}"/></g>`);
        }
        prevStep = it.si;

  if (LIVE) {
    try { await loadGroup(UI.group || ''); VERS = await (await fetch('/version')).json(); }
    catch (e) { document.body.insertAdjacentHTML('afterbegin', '<p class="empty">Cannot read /overview: ' + E(e.message) + '</p>'); return; }
    if (!UI.group || !S.summaries[UI.group]) UI.group = S.group;
    render(); setTimeout(poll, 1200);
    if (await need(wanted())) { noteChanges(true); render(); }
  } else {
    for (const k in S.details || {}) D.set(k, S.details[k]);
    if (S.engine) ENG = Object.assign({tips: {}, kinds: {}, why: {}, wire: {}}, S.engine);
    noteChanges(true); render();
  }
  if (UI.hole) { const el = [...document.querySelectorAll('[data-hole]')].find(x => x.dataset.hole === UI.hole); if (el) openHole(el); }
})();
</script>
</body></html>
