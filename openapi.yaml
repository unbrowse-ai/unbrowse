                session_id:
                  type: string
                started_at:
                  type: string
                  format: date-time
                completed_at:
                  type: string
                  format: date-time
                trace_version:
                  type: string
                api_calls:
                  type: integer
                discovery_queries:
                  type: integer
                cached_skill_calls:
                  type: integer
                fresh_index_calls:
                  type: integer
                browser_mode:
                  type: string
                  enum: [default, replaced, manual, unknown]
                success:
                  type: boolean
                source:
                  type: string
                time_saved_ms:
                  type: integer
                time_saved_pct:
                  type: number
                tokens_saved:
                  type: integer
                tokens_saved_pct:
                  type: number
                cost_saved_uc:
