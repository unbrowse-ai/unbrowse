  # ═══════════════════════════════════════════════════════════════════════
  # GRAPH (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/graph/edges:
    post:
      tags: [Graph]
      summary: Upsert DAG edges for a domain's operation graph
      description: Add or update prerequisite dependency edges between endpoints.
      security:
        - BearerAuth: []
        - SignedClient: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                node:
                  type: object
                  properties:
                    endpoint_id:
                      type: string
                  required: [endpoint_id]
                edges:
                  type: array
                  items:
                    type: object
              required: [domain, node, edges]
      responses:
        '200':
          description: Edges upserted

  /v1/graph/chain:
    post:
      tags: [Graph]
      summary: Resolve prerequisite chain for a target endpoint
      description: Returns the ordered sequence of endpoints that must execute before the target.
      security:
        - BearerAuth: []
        - SignedClient: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                target_endpoint_id:
                  type: string
                available_bindings:
                  type: array
                  items:
                    type: string
                  description: Bindings the agent already has (skip those prereqs)
              required: [domain, target_endpoint_id]
      responses:
        '200':
          description: Ordered prerequisite chain

  /v1/graph/predict/{domain}:
    get:
      tags: [Graph]
      summary: Predict next likely endpoint from co-occurrence patterns
      security:
        - BearerAuth: []
        - SignedClient: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Endpoint ID to predict from
        - name: k
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Predicted next endpoints

  /v1/graph/session:
    post:
      tags: [Graph]
      summary: Record a session action for co-occurrence learning
      security:
        - BearerAuth: []
        - SignedClient: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                action:
                  type: object
                  properties:
                    intent:
                      type: string
                    domain:
                      type: string
                    endpoint_id:
                      type: string
                    result:
                      type: string
                      enum: [success, failure, skip]
                    timestamp:
                      type: number
                  required: [intent, domain, endpoint_id, result]
              required: [session_id, action]
      responses:
        '200':
          description: Action recorded

  /v1/graph/negative:
    post:
      tags: [Graph]
      summary: Record a negative routing example
      description: Tells the graph that a particular intent should NOT route to this endpoint.
      security:
        - BearerAuth: []
        - SignedClient: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                intent_pattern:
                  type: string
                endpoint_id:
                  type: string
              required: [domain, intent_pattern, endpoint_id]
      responses:
        '200':
          description: Negative example recorded

  /v1/graph/credits:
    get:
      tags: [Graph]
      summary: Check remaining Graph API credits
      responses:
        '200':
          description: Credit balance

  /v1/graph/intent-cache:
    get:
      tags: [Graph]
      summary: Check cached intent-to-endpoint routing
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Cache hit/miss result

  /v1/graph/cooccurrence/{domain}:
    get:
      tags: [Graph]
      summary: Dump co-occurrence matrix for a domain
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Co-occurrence matrix

  /v1/graph/edges/{domain}/{endpoint_id}:
    get:
      tags: [Graph]
      summary: Read adjacency list for an endpoint
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adjacency list

  # ═══════════════════════════════════════════════════════════════════════
  # ISSUES (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/issues/auto-file:
    post:
      tags: [Issues]
      summary: Auto-file issues from telemetry failure data
      description: |
        Checks failure threshold, builds a ReproBundle, and files an issue if
        enough failures have accumulated. Rate limited to 10/60s per agent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_id:
                  type: string
                endpoint_id:
                  type: string
                intent:
                  type: string
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      message:
                        type: string
                      trace_id:
                        type: string
                      timestamp:
                        type: string
              required: [skill_id, endpoint_id, errors]
      responses:
        '200':
          description: Below threshold, not filed
        '201':
          description: Issue filed

  # ═══════════════════════════════════════════════════════════════════════
  # FEES (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/fees/summary:
    get:
      tags: [Fees]
      summary: Aggregate fee ledger summary across all agents
      responses:
        '200':
          description: Fee summary

  /v1/fees/agent/{agentId}:
    get:
      tags: [Fees]
      summary: Fee ledger for a specific agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent fee ledger
        '404':
          description: No fees recorded

  # ═══════════════════════════════════════════════════════════════════════
  # TRANSACTIONS (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/transactions:
    post:
      tags: [Transactions]
      summary: Record an x402 payment transaction
      security:
        - BearerAuth: []
        - SignedClient: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_id:
                  type: string
                consumer_id:
                  type: string
                creator_id:
                  type: string
                skill_id:
                  type: string
                endpoint_id:
                  type: string
                price_usd:
                  type: number
                  minimum: 0
                payment_proof:
                  type: string
              required: [transaction_id, consumer_id, skill_id, price_usd]
      responses:
        '201':
          description: Transaction recorded

  /v1/transactions/consumer/{agentId}:
    get:
      tags: [Transactions]
      summary: Consumer payment history
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consumer ledger
        '404':
          description: No transactions

  /v1/transactions/creator/{agentId}:
    get:
      tags: [Transactions]
      summary: Creator earnings history
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Creator ledger
        '404':
          description: No transactions

  /v1/transactions/summary:
    get:
      tags: [Transactions]
      summary: Aggregate transaction stats
      responses:
        '200':
          description: Transaction summary

  # ═══════════════════════════════════════════════════════════════════════
  # ATTRIBUTION (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/attribution/indexer/{indexerId}:
    get:
      tags: [Attribution]
      summary: Indexer earnings from delta-based attribution
      parameters:
        - name: indexerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Indexer ledger
        '404':
          description: No attribution data

  /v1/attribution/summary:
    get:
      tags: [Attribution]
      summary: Aggregate attribution stats across all indexers
      responses:
        '200':
          description: Attribution summary

  # ═══════════════════════════════════════════════════════════════════════
  # DASHBOARD & LEADERBOARD (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/leaderboard:
    get:
      tags: [Dashboard]
      summary: Agent earnings leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Leaderboard entries

  /v1/dashboard/me:
    get:
      tags: [Dashboard]
      summary: Authenticated agent's earnings dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Agent dashboard
        '404':
          description: Agent not found

  /v1/dashboard/wallet/{walletAddress}:
    get:
      tags: [Dashboard]
      summary: Dashboard by Solana wallet address
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wallet dashboard
        '404':
          description: Wallet not found

  # ═══════════════════════════════════════════════════════════════════════
  # MINERS (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/miners/stats:
    get:
      tags: [Miners]
      summary: Miner network stats, domain coverage, leaderboard, bounties, and quests
      description: |
        Returns everything the miner dashboard needs in one call:
        network totals, per-domain breakdown, top earners, available bounties, and active quests.
      responses:
        '200':
          description: Miner stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  network:
                    type: object
                    properties:
                      total_routes:
                        type: integer
                      total_skills:
                        type: integer
                      total_agents:
                        type: integer
                      total_executions:
                        type: integer
                      total_earned_usd:
                        type: number
                      marketplace_hit_rate:
                        type: integer
                      total_resolves:
                        type: integer
                      total_tokens_saved:
                        type: integer
                  domains:
                    type: array
                    items:
                      type: object
                  leaderboard:
                    type: array
                    items:
                      type: object
                  bounties:
                    type: array
                    items:
                      type: object
                  quests:
                    type: array
                    items:
                      type: object

  # ═══════════════════════════════════════════════════════════════════════
  # OPS (Backend — Admin only)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/ops:
    get:
      tags: [Ops]
      summary: Ops dashboard — stats, skills, agents in one call
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ops dashboard

  /v1/ops/reindex:
    post:
      tags: [Ops]
      summary: Re-index active skills into vector store (admin)
      description: |
        Processes skills in batches (default 3). Supports pagination via `offset`.
        Can also purge stale skill IDs from the vector index.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purge_skill_ids:
                  type: array
                  items:
                    type: string
                limit:
                  type: integer
                  default: 3
                offset:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Reindex results
        '403':
          description: Admin only

  /v1/ops/consolidate:
    post:
      tags: [Ops]
      summary: Merge all skills for a domain into one canonical skill (admin)
      description: |
        Finds all active skills for the domain, merges endpoints into the richest one,
        deprecates the rest, and re-indexes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
              required: [domain]
      responses:
        '200':
          description: Consolidation result
        '403':
          description: Admin only

  /v1/ops/migrate-index:
    post:
      tags: [Ops]
      summary: Reset stale split indexes (admin, one-time migration)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Migration triggered
        '403':
          description: Admin only

  /v1/ops/backfill-analytics:
    post:
      tags: [Ops]
      summary: Seed cohort and active-day data from existing agent profiles (admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Backfill result
        '403':
          description: Admin only

  # ═══════════════════════════════════════════════════════════════════════
  # BLOG (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/blog/publish:
    post:
      tags: [Blog]
      summary: Publish a blog post
      description: |
        Requires the blog publish key (separate from regular API key).
        Stores the post in KV and updates the index. Cached for 5 minutes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogPost'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  slug:
                    type: string
                  url:
                    type: string

  /v1/blog/posts:
    get:
      tags: [Blog]
      summary: List all blog posts (newest first)
      responses:
        '200':
          description: Blog post summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        author:
                          type: string
                        published_at:
                          type: string
                        keywords:
                          type: array
                          items:
                            type: string

  /v1/blog/posts/{slug}:
    get:
      tags: [Blog]
      summary: Get a single blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full blog post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'
        '404':
          description: Not found

  # ═══════════════════════════════════════════════════════════════════════
  # LANDING (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/landing/homepage/assign:
    post:
      tags: [Landing]
      summary: Assign a landing page A/B variant to a visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitor_id:
                  type: string
                current_assignment:
                  type: string
                  nullable: true
                icp:
                  type: string
                  nullable: true
                  description: Ideal customer profile segment
              required: [visitor_id]
      responses:
        '200':
          description: Variant assigned

  /v1/landing/homepage/token:
    post:
      tags: [Landing]
      summary: Mint install attribution token for funnel tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                experiment_id:
                  type: string
                variant_id:
                  type: string
                visitor_id:
                  type: string
                session_id:
                  type: string
              required: [experiment_id, variant_id, visitor_id, session_id]
      responses:
        '200':
          description: Token minted

  /v1/landing/homepage/config:
    get:
      tags: [Landing]
      summary: Get experiment configuration (admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Experiment config
        '403':
          description: Admin only
    put:
      tags: [Landing]
      summary: Save experiment configuration (admin only)
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Config saved
        '403':
          description: Admin only

  /v1/landing/homepage/analytics:
    get:
      tags: [Landing]
      summary: Landing page experiment analytics (admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            maximum: 180
      responses:
        '200':
          description: Experiment analytics
        '403':
          description: Admin only

  # ═══════════════════════════════════════════════════════════════════════
  # TELEMETRY (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/telemetry/events:
    post:
      tags: [Telemetry]
      summary: Record a funnel event (install_start, first_resolve, first_execute, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                install_id:
                  type: string
                session_id:
                  type: string
                landing_token:
                  type: string
                name:
                  type: string
                source:
                  type: string
                host_type:
                  type: string
                created_at:
                  type: string
                  format: date-time
                properties:
                  type: object
              required: [install_id, name, source]
      responses:
        '200':
          description: Event recorded

  /v1/telemetry/install:
    post:
      tags: [Telemetry]
      summary: Record install telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                install_id:
                  type: string
                landing_token:
                  type: string
                source:
                  type: string
                host_type:
                  type: string
                skill:
                  type: string
                skill_version:
                  type: string
                status:
                  type: string
                created_at:
                  type: string
                  format: date-time
                properties:
                  type: object
              required: [install_id, source]
      responses:
        '200':
          description: Install recorded

  /v1/telemetry/web:
    post:
      tags: [Telemetry]
      summary: Record web telemetry event (page views, clicks, conversions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitor_id:
                  type: string
                session_id:
                  type: string
                name:
                  type: string
                experiment_id:
                  type: string
                variant_id:
                  type: string
                path:
                  type: string
                referrer:
                  type: string
                  nullable: true
                created_at:
                  type: string
                  format: date-time
                properties:
                  type: object
              required: [visitor_id, session_id, name]
      responses:
        '200':
          description: Web event recorded

  # ═══════════════════════════════════════════════════════════════════════
  # WEBHOOKS (Backend)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/webhooks/github:
    post:
      tags: [Webhooks]
      summary: Process GitHub webhook events (star, issue, PR)
      description: Requires `X-Hub-Signature-256` and `X-GitHub-Event` headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Processed
        '401':
          description: Invalid webhook signature

  # ═══════════════════════════════════════════════════════════════════════
  # STALE CLEANUP (Local)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/stale/cleanup:
    post:
      tags: [Stale Cleanup]
      summary: Verify active skills and mark dead endpoints as stale
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_id:
                  type: string
                  description: Scope cleanup to a single skill
                domain:
                  type: string
                  description: Scope cleanup to a single domain
                limit:
                  type: integer
      responses:
        '200':
          description: Cleanup results

  # ═══════════════════════════════════════════════════════════════════════
  # SESSIONS (Local)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/sessions/{domain}:
    get:
      tags: [Sessions]
      summary: List local trace/debug files for a domain
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  sessions:
                    type: array
                    items:
                      type: object

  # ═══════════════════════════════════════════════════════════════════════
  # FOUNDRY (Local)
  # ═══════════════════════════════════════════════════════════════════════
  /v1/foundry/publish-bundle:
    post:
      tags: [Foundry]
      summary: Derive bundle/share/host artifacts from a workflow preset
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preset_path:
                  type: string
                  description: Path to the workflow preset file
                site_url:
                  type: string
                hosts:
                  type: array
                  items:
                    type: string
                    enum: [codex, claude, openclaw]
              required: [preset_path]
      responses:
        '200':
          description: Bundle artifacts generated
