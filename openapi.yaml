  /v1/analytics/network:
    get:
      tags: [Analytics]
      summary: Network health metrics (coverage, quality, staleness)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Network health data

  /v1/analytics/economics:
    get:
      tags: [Analytics]
      summary: Unit economics metrics (cost per resolve, revenue per execution)
