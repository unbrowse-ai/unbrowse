[package]
name = "obscura-capture"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "obscura-capture"
path = "src/main.rs"

[dependencies]
obscura = { git = "https://github.com/h4ckf0r0day/obscura", tag = "v0.1.11" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
panic = "unwind"
