[package]
name = "unbrowse-net"
description = "The node's peer network: a Kademlia table keyed by site, who may enter it, and where each node sits in it"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "quic", "noise", "yamux", "kad", "identify", "ping", "request-response", "json", "macros", "ed25519", "autonat", "relay", "dcutr", "gossipsub"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unbrowse-files = { path = "../files" }
sha2 = "0.10"
psl = "2"
semver = "1"
url = "2"
# The Antithesis harness's assertions (`antithesis.rs`), built only with the feature below.
antithesis_sdk = { version = "0.3", optional = true }

[features]
antithesis = ["dep:antithesis_sdk"]

[dev-dependencies]
# A provider that ignores the bounds, built from the same libp2p, in the body tests.
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "noise", "yamux", "request-response", "macros", "ed25519"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
